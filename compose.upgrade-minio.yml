# Upgrade readiness keeps the pre-upgrade MinIO service as the shared S3
# backend while validating application/schema compatibility. The independent
# MinIO-to-RustFS copied cutover is governed by docs/rustfs-migration.md.
services:
  gateway:
    environment:
      GATEWAY_S3_ENDPOINT: http://minio:9000
      GATEWAY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER for upgrade readiness}
      GATEWAY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD for upgrade readiness}
      NO_PROXY: postgres,minio,rustfs,host.docker.internal,127.0.0.1,localhost
