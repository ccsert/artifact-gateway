name: Contract lane

on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
      prefix:
        default: contract
        type: string
      cold_cache:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lane:
    name: ${{ inputs.prefix }}/${{ inputs.lane }}
    runs-on: ubuntu-latest
    env:
      CI_CONTRACT_LANE: ${{ inputs.lane }}
      CI_CONTRACT_PREFIX: ${{ inputs.prefix }}
      NPM_CONFIG_FETCH_TIMEOUT: "60000"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"
    steps:
      - name: Initialize failure evidence before checkout or tool setup
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, re
          lane, prefix = os.environ['CI_CONTRACT_LANE'], os.environ['CI_CONTRACT_PREFIX']
          if not re.fullmatch(r'[a-z][a-z-]*', lane) or prefix not in ('contract', 'benchmark-serial', 'benchmark-parallel'):
              raise SystemExit('invalid lane evidence namespace')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / ('ag-' + prefix + '-' + lane)
          path.mkdir()
          (path / 'bootstrap.json').write_text(json.dumps({
              'lane': lane, 'prefix': prefix, 'status': 'bootstrap_incomplete',
              'head': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'startedAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('CI_CONTRACT_EVIDENCE=' + str(path) + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: ${{ !inputs.cold_cache }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: inputs.lane == 'core' || inputs.lane == 'six-format-auth'
        with:
          toolchain: 1.96.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: ${{ inputs.lane == 'core' && !inputs.cold_cache && 'npm' || '' }}
          cache-dependency-path: |
            console/package-lock.json
            tools/openapi/package-lock.json
      - name: Verify public npm lockfile sources before install
        if: inputs.lane == 'core'
        run: node scripts/npm-lockfile-check.mjs
      - name: Install OpenAPI tooling
        if: inputs.lane == 'core'
        run: npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http
        timeout-minutes: 10
        working-directory: tools/openapi
      - name: Install Console code generation dependencies
        if: inputs.lane == 'core'
        run: npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http
        timeout-minutes: 10
        working-directory: console
      - name: Run unchanged lane targets and preserve raw evidence
        env:
          CI_CONTRACT_COLD: ${{ inputs.cold_cache }}
        run: |
          args=(run "$CI_CONTRACT_LANE" --prefix "$CI_CONTRACT_PREFIX" --output "$CI_CONTRACT_EVIDENCE")
          if [[ "$CI_CONTRACT_COLD" == true ]]; then args+=(--cold-cache); fi
          python3 scripts/ci-contract.py "${args[@]}"
      - name: Preserve lane evidence including bootstrap failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.prefix }}-${{ inputs.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ag-${{ inputs.prefix }}-${{ inputs.lane }}/
          if-no-files-found: error
