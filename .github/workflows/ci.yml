name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            tools/openapi/package-lock.json
      - name: Install OpenAPI tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/openapi
      - name: Install Console code generation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: console
      - name: Validate OpenAPI contract
        run: make openapi-check
      - name: Check Native Hosted API compatibility
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make api-change-check
      - name: Run tests
        run: make test
      - name: Validate Cargo C0 with the pinned official client
        run: make cargo-contract
      - name: Validate Kubernetes manifests
        run: make kubernetes-local-check
      - name: Run Native OCI E2E
        run: make native-oci-e2e
      - name: Run Native Raw E2E
        run: make native-raw-e2e
      - name: Run Native Maven E2E
        run: make native-maven-e2e
      - name: Run Native npm E2E
        run: make native-npm-e2e
      - name: Run Native PyPI E2E
        run: make native-pypi-e2e
      - name: Run Go Module Proxy E2E
        run: make native-go-e2e
      - name: Run APT Proxy and Hosted E2E
        run: make native-apt-e2e
      - name: Run APT external signer rotation E2E
        run: make apt-signer-rotation-e2e
      - name: Run Conan E2E
        run: make conan-e2e
      - name: Run integration tests
        run: make integration-test
      - name: Check release readiness entrypoints
        run: make release-readiness-check
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            tools/openapi/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: console
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/openapi
      - name: Run Go lint
        run: make lint
      - name: Run Go vet
        run: make vet
      - name: Verify release version and artifact builder
        run: make release-version-check release-artifacts-test
      - name: Run race detector
        run: make race
      - name: Enforce coverage floor
        run: make coverage
      - name: Audit dependencies
        run: make dependency-audit
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - name: Check generated API client
        run: make console-api-check
      - name: Type check console
        run: make console-typecheck
      - name: Lint and check Console formatting
        run: make console-check
      - name: Run Console unit tests
        run: make console-test
      - name: Build console
        run: make console-build
      - name: Build Console deployment image
        run: make console-docker-build
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: console
      - name: Start gateway for Console E2E
        env:
          GATEWAY_ENV_FILE: ${{ runner.temp }}/artifact-gateway.env
        run: |
          cat > "$GATEWAY_ENV_FILE" <<'EOF'
          GATEWAY_HTTP_PORT=18080
          GATEWAY_POSTGRES_PASSWORD=ci-postgres-password
          GATEWAY_ADMIN_TOKEN=ci-admin-token
          GATEWAY_RESOLVER_TOKEN=ci-resolver-token
          RUSTFS_ACCESS_KEY=ci-rustfs-user
          RUSTFS_SECRET_KEY=ci-rustfs-password
          RUSTFS_RPC_SECRET=ci-rustfs-independent-rpc-secret-0001
          RUSTFS_API_PORT=19000
          RUSTFS_CONSOLE_PORT=19001
          EOF
          docker compose --env-file "$GATEWAY_ENV_FILE" -f compose.yml up --build --wait --remove-orphans
      - name: Run console E2E
        env:
          GATEWAY_ENV_FILE: ${{ runner.temp }}/artifact-gateway.env
        run: make console-e2e
      - name: Stop gateway after Console E2E
        if: always()
        env:
          GATEWAY_ENV_FILE: ${{ runner.temp }}/artifact-gateway.env
        run: |
          if [ -f "$GATEWAY_ENV_FILE" ]; then
            docker compose --env-file "$GATEWAY_ENV_FILE" -f compose.yml down -v --remove-orphans
          else
            echo "Gateway environment file was not created; nothing to clean up."
          fi

  mainline-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contract-and-test, quality, console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build mainline distribution assets
        id: build
        run: |
          version="$(tr -d '[:space:]' < VERSION)-main.${GITHUB_SHA::12}"
          ./scripts/build-release-artifacts.sh \
            --version "$version" \
            --revision "$GITHUB_SHA" \
            --output dist
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload mainline distribution assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-gateway-${{ steps.build.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  mainline-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contract-and-test, quality, console]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: artifact-gateway
            file: Dockerfile
          - image: artifact-gateway-console
            file: Dockerfile.console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve mainline version
        id: version
        run: |
          echo "value=$(tr -d '[:space:]' < VERSION)-main.${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=raw,value=main-sha-${{ steps.version.outputs.short_sha }}
      - name: Confirm this run still owns the main tip
        run: |
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Build and publish mainline image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
