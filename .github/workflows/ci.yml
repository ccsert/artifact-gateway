name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Fail stalled registry requests with an actionable error instead of waiting
  # five minutes per attempt. Dependency integrity and audit gates stay enabled.
  NPM_CONFIG_FETCH_TIMEOUT: "60000"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-core:
    uses: ./.github/workflows/contract-lane.yml
    with:
      lane: core

  contract-native:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [migration-clients, inventory, nuget, oci-migration, maven-oci-auth, six-format-auth, oci-discovery, npm-migration, helm]
    uses: ./.github/workflows/contract-lane.yml
    with:
      lane: ${{ matrix.lane }}

  contract-and-test:
    if: always()
    needs: [contract-core, contract-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prepare aggregate evidence before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/contract-aggregate"
          printf '{"status":"bootstrap_incomplete","head":"%s","runId":"%s","attempt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/contract-aggregate/bootstrap.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download every isolated lane artifact
        id: lane-artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: contract-*
          path: ${{ runner.temp }}/contract-input
      - name: Preserve complete job logs including checkout and setup
        id: job-logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_CONTRACT_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-contract.py collect-job-logs --output "$RUNNER_TEMP/contract-aggregate"
      - name: Require all job results and complete matching lane evidence
        if: always()
        env:
          CI_CONTRACT_NEEDS: ${{ toJSON(needs) }}
          CI_CONTRACT_ARTIFACT_RESULT: ${{ steps.lane-artifacts.outcome }}
          CI_CONTRACT_JOB_LOG_RESULT: ${{ steps.job-logs.outcome }}
        run: python3 scripts/ci-contract.py aggregate --input "$RUNNER_TEMP/contract-input" --output "$RUNNER_TEMP/contract-aggregate"
      - name: Preserve aggregate evidence on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-aggregate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract-aggregate/
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            tools/openapi/package-lock.json
      - name: Verify public npm lockfile sources
        run: node scripts/npm-lockfile-check.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http
        timeout-minutes: 10
        working-directory: console
      - run: npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http
        timeout-minutes: 10
        working-directory: tools/openapi
      - name: Run Go lint
        run: make lint
      - name: Run Go vet
        run: make vet
      - name: Verify release version and artifact builder
        run: make release-version-check release-artifacts-test
      - name: Run race detector
        run: make race
      - name: Enforce coverage floor
        run: make coverage
      - name: Audit dependencies
        run: make dependency-audit
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Verify public npm lockfile sources
        run: node scripts/npm-lockfile-check.mjs
      - run: npm ci --timing --loglevel=http
        timeout-minutes: 10
        working-directory: console
      - name: Check generated API client
        run: make console-api-check
      - name: Type check console
        run: make console-typecheck
      - name: Lint and check Console formatting
        run: make console-check
      - name: Run Console unit tests
        run: make console-test
      - name: Build console
        run: make console-build
      - name: Build Console deployment image
        run: make console-docker-build
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: console
      - name: Verify built Console identity
        run: npx playwright test --config playwright.build.config.ts
        working-directory: console
      - name: Compare Console visual baseline
        run: make console-visual
      - name: Upload Console visual diff
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-visual-diff
          path: console/test-results/
          retention-days: 7
      - name: Start gateway for Console E2E
        env:
          GATEWAY_ENV_FILE: ${{ runner.temp }}/artifact-gateway.env
        run: |
          cat > "$GATEWAY_ENV_FILE" <<'EOF'
          GATEWAY_HTTP_PORT=18080
          GATEWAY_POSTGRES_PASSWORD=ci-postgres-password
          GATEWAY_ADMIN_TOKEN=ci-admin-token
          GATEWAY_RESOLVER_TOKEN=ci-resolver-token
          RUSTFS_ACCESS_KEY=ci-rustfs-user
          RUSTFS_SECRET_KEY=ci-rustfs-password
          RUSTFS_RPC_SECRET=ci-rustfs-independent-rpc-secret-0001
          RUSTFS_API_PORT=19000
          RUSTFS_CONSOLE_PORT=19001
          GATEWAY_OIDC_ISSUER=http://127.0.0.1:1/ci-cli-e2e
          GATEWAY_OIDC_AUDIENCE=ci-cli-e2e
          GATEWAY_OIDC_JWKS_URL=http://127.0.0.1:1/ci-cli-e2e/jwks
          EOF
          docker compose --env-file "$GATEWAY_ENV_FILE" -f compose.yml up --build --wait --remove-orphans
      - name: Run console E2E
        id: console-e2e
        env:
          GATEWAY_ENV_FILE: ${{ runner.temp }}/artifact-gateway.env
        run: make console-e2e
      - name: Upload Console E2E report and traces
        if: ${{ !cancelled() && (steps.console-e2e.outcome == 'success' || steps.console-e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-e2e-results
          path: |
            console/test-results/
            console/playwright-report/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run agctl CLI E2E against the same gateway
        env:
          CLI_E2E_SERVER: http://127.0.0.1:18080
          CLI_E2E_TOKEN: ci-admin-token
          CLI_E2E_RESOLVER_TOKEN: ci-resolver-token
          CLI_E2E_OIDC_ISSUER: http://127.0.0.1:1/ci-cli-e2e
        run: make cli-e2e
      - name: Stop gateway after Console E2E
        if: always()
        env:
          GATEWAY_ENV_FILE: ${{ runner.temp }}/artifact-gateway.env
        run: |
          if [ -f "$GATEWAY_ENV_FILE" ]; then
            docker compose --env-file "$GATEWAY_ENV_FILE" -f compose.yml down -v --remove-orphans
          else
            echo "Gateway environment file was not created; nothing to clean up."
          fi

  mainline-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contract-and-test, quality, console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build mainline distribution assets
        id: build
        run: |
          version="$(tr -d '[:space:]' < VERSION)-main.${GITHUB_SHA::12}"
          ./scripts/build-release-artifacts.sh \
            --version "$version" \
            --revision "$GITHUB_SHA" \
            --output dist
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload mainline distribution assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-gateway-${{ steps.build.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  mainline-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contract-and-test, quality, console]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: artifact-gateway
            file: Dockerfile
          - image: artifact-gateway-console
            file: Dockerfile.console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve mainline version
        id: version
        run: |
          echo "value=$(tr -d '[:space:]' < VERSION)-main.${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=raw,value=main-sha-${{ steps.version.outputs.short_sha }}
      - name: Confirm this run still owns the main tip
        run: |
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Build and publish mainline image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
