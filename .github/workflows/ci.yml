name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate OpenAPI contract
        run: make api-contract
      - name: Check Native Hosted API compatibility
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make api-change-check
      - name: Run tests
        run: make test
