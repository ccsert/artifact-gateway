name: artifact-gateway-gitea-fixture

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_POSTGRES_PASSWORD:?set GITEA_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - gitea-postgres:/var/lib/postgresql/data

  gitea:
    image: gitea/gitea:1.22.6
    depends_on:
      db:
        condition: service_healthy
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_POSTGRES_PASSWORD:?set GITEA_POSTGRES_PASSWORD in .env}
      GITEA__server__ROOT_URL: http://localhost:${GITEA_HTTP_PORT:-3000}/
      GITEA__server__DOMAIN: localhost
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_PORT: 22
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__ENABLE_USER_ORGANIZATION_CREATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__packages__ENABLED: "true"
      GITEA__security__INSTALL_LOCK: "true"
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    volumes:
      - gitea-data:/data

volumes:
  gitea-data:
  gitea-postgres:
