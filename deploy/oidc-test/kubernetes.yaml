apiVersion: v1
kind: Namespace
metadata:
  name: artifact-gateway-oidc-test
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_PASSWORD
              value: gateway-oidc-test-db-password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U gateway -d gateway"]
            initialDelaySeconds: 3
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_ACCESS_KEY
              value: gateway-oidc-test-rustfs
            - name: RUSTFS_SECRET_KEY
              value: gateway-oidc-test-rustfs-password
            - name: RUSTFS_RPC_SECRET
              value: gateway-oidc-test-rustfs-rpc-secret
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: artifact-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: artifact-gateway
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artifact-gateway
  template:
    metadata:
      labels:
        app: artifact-gateway
    spec:
      initContainers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: gateway
            - name: PGUSER
              value: gateway
            - name: PGPASSWORD
              value: gateway-oidc-test-db-password
          command:
            - /bin/sh
            - /migrations/run-migrations.sh
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
        - name: wait-for-rustfs
          image: curlimages/curl:8.14.1
          command:
            - sh
            - -ec
            - until curl --fail --silent http://rustfs:9000/health >/dev/null; do sleep 1; done
      containers:
        - name: gateway
          image: artifact-gateway:oidc-test
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ag-oidc-test-config
          env:
            - name: GATEWAY_LISTEN_ADDRESS
              value: :8080
            - name: GATEWAY_DATABASE_URL
              value: postgres://gateway:gateway-oidc-test-db-password@postgres:5432/gateway?sslmode=disable
            - name: GATEWAY_RUSTFS_ENDPOINT
              value: http://rustfs:9000
            - name: GATEWAY_RUSTFS_BUCKET
              value: gateway-cache
            - name: GATEWAY_RUSTFS_ACCESS_KEY
              value: gateway-oidc-test-rustfs
            - name: GATEWAY_RUSTFS_SECRET_KEY
              value: gateway-oidc-test-rustfs-password
            - name: GATEWAY_ADMIN_TOKEN
              value: gateway-oidc-test-admin-token
            - name: GATEWAY_RESOLVER_TOKEN
              value: gateway-oidc-test-resolver-token
            - name: GATEWAY_SETTINGS_ENCRYPTION_KEY
              value: 0123456789abcdef0123456789abcdef
            - name: GATEWAY_OIDC_ISSUER
              value: http://127.0.0.1:8081/realms/artifact-gateway
            - name: GATEWAY_OIDC_AUDIENCE
              value: artifact-gateway-api
            - name: GATEWAY_OIDC_CLIENT_ID
              value: artifact-gateway-console
            - name: GATEWAY_OIDC_SCOPES
              value: openid profile email
            - name: GATEWAY_OIDC_ADMIN_ROLES
              value: artifact-admin
            - name: GATEWAY_OIDC_WRITER_ROLES
              value: artifact-writer
            - name: GATEWAY_OIDC_READER_ROLES
              value: artifact-reader
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 2
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.0
          args: ["start-dev", "--import-realm", "--http-port=8081"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: gateway-oidc-test-keycloak-admin
            - name: KC_HOSTNAME
              value: http://127.0.0.1:8081
            - name: KC_HOSTNAME_STRICT
              value: "true"
          ports:
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 8
            periodSeconds: 3
          volumeMounts:
            - name: keycloak-realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: ag-oidc-migrations
        - name: keycloak-realm
          configMap:
            name: ag-oidc-keycloak-realm
