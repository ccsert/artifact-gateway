apiVersion: v1
kind: Service
metadata:
  name: artifact-gateway-console
  labels:
    app.kubernetes.io/name: artifact-gateway
    app.kubernetes.io/component: console
spec:
  selector:
    app.kubernetes.io/name: artifact-gateway
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-gateway-console
  labels:
    app.kubernetes.io/name: artifact-gateway
    app.kubernetes.io/component: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: artifact-gateway
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifact-gateway
        app.kubernetes.io/component: console
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: artifact-gateway-console:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /console-healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /console-healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
