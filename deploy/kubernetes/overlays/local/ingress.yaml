apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifact-gateway-ingress
  labels:
    app.kubernetes.io/name: artifact-gateway
    app.kubernetes.io/component: ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: artifact-gateway-ingress
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: artifact-gateway-ingress
subjects:
  - kind: ServiceAccount
    name: artifact-gateway-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: artifact-gateway-ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: artifact-gateway-local-ingress-class-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: artifact-gateway-local-ingress-class-reader
subjects:
  - kind: ServiceAccount
    name: artifact-gateway-ingress
    namespace: artifact-gateway-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: artifact-gateway-local-ingress-class-reader
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: artifact-gateway-local
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-gateway-ingress
  labels:
    app.kubernetes.io/name: artifact-gateway
    app.kubernetes.io/component: ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: artifact-gateway
      app.kubernetes.io/component: ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifact-gateway
        app.kubernetes.io/component: ingress
    spec:
      serviceAccountName: artifact-gateway-ingress
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
          imagePullPolicy: IfNotPresent
          args:
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
            - --api.dashboard=false
            - --accesslog=true
            - --log.level=INFO
            - --entrypoints.web.address=:8000
            # npm requires an encoded slash for scoped package metadata. Raw
            # owns the remaining canonical escaped-path validation; reject
            # backslash and NUL at the edge before either backend sees them.
            - --entrypoints.web.http.encodedcharacters.allowencodedslash=true
            - --entrypoints.web.http.encodedcharacters.allowencodedbackslash=false
            - --entrypoints.web.http.encodedcharacters.allowencodednullcharacter=false
            - --entrypoints.web.http.encodedcharacters.allowencodedpercent=true
            - --entrypoints.web.http.encodedcharacters.allowencodedsemicolon=true
            - --entrypoints.web.http.encodedcharacters.allowencodedquestionmark=true
            - --entrypoints.web.http.encodedcharacters.allowencodedhash=true
            - --entrypoints.health.address=:9100
            - --ping=true
            - --ping.entrypoint=health
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=artifact-gateway-local
            - --providers.kubernetesingress.ingressclass=artifact-gateway-local
            - --providers.kubernetesingress.ingressendpoint.publishedservice=artifact-gateway-local/artifact-gateway-ingress
          ports:
            - name: web
              containerPort: 8000
            - name: health
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-gateway-ingress
  labels:
    app.kubernetes.io/name: artifact-gateway
    app.kubernetes.io/component: ingress
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: artifact-gateway
    app.kubernetes.io/component: ingress
  ports:
    - name: http
      port: 80
      targetPort: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artifact-gateway
  labels:
    app.kubernetes.io/name: artifact-gateway
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: artifact-gateway-local
  rules:
    - host: artifact-gateway.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artifact-gateway-console
                port:
                  name: http
