apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-gateway-config
data:
  GATEWAY_LISTEN_ADDRESS: :8080
  GATEWAY_NODE_ROLES: standalone
  GATEWAY_DATABASE_MAX_OPEN_CONNS: "8"
  GATEWAY_DATABASE_MAX_IDLE_CONNS: "4"
  GATEWAY_DATABASE_COORDINATOR_MAX_OPEN_CONNS: "2"
  GATEWAY_DATABASE_COORDINATOR_MAX_IDLE_CONNS: "1"
  GATEWAY_DATABASE_ARTIFACT_LOCK_MAX_OPEN_CONNS: "2"
  GATEWAY_DATABASE_ARTIFACT_LOCK_MAX_IDLE_CONNS: "1"
  GATEWAY_S3_ENDPOINT: http://rustfs:9000
  GATEWAY_S3_BUCKET: gateway-cache
  NO_PROXY: postgres,rustfs,artifact-gateway,artifact-gateway-console,127.0.0.1,localhost
