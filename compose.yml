name: artifact-gateway

services:
  gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-ready:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      GATEWAY_LISTEN_ADDRESS: :8080
      GATEWAY_DATABASE_URL: postgres://gateway:${GATEWAY_POSTGRES_PASSWORD:?set GATEWAY_POSTGRES_PASSWORD in .env}@postgres:5432/gateway?sslmode=disable
      GATEWAY_REDIS_ADDRESS: redis:6379
      GATEWAY_S3_ENDPOINT: http://minio:9000
      GATEWAY_S3_BUCKET: gateway-cache
      GATEWAY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      GATEWAY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      GATEWAY_OCI_PROXY_ALLOWED_HOSTS: ${GATEWAY_OCI_PROXY_ALLOWED_HOSTS:-}
      GATEWAY_MAVEN_PROXY_ALLOWED_HOSTS: ${GATEWAY_MAVEN_PROXY_ALLOWED_HOSTS:-}
      GATEWAY_ADAPTER_MODE: ${GATEWAY_ADAPTER_MODE:-test}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?set GATEWAY_ADMIN_TOKEN in .env}
      GATEWAY_RESOLVER_TOKEN: ${GATEWAY_RESOLVER_TOKEN:?set GATEWAY_RESOLVER_TOKEN in .env}
      GATEWAY_REPOSITORY_READERS: ${GATEWAY_REPOSITORY_READERS:-}
      GATEWAY_GITEA_USERNAME: ${GATEWAY_GITEA_USERNAME:-}
      GATEWAY_GITEA_TOKEN: ${GATEWAY_GITEA_TOKEN:-}
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/gateway-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:?set GATEWAY_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gateway-postgres:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${GATEWAY_POSTGRES_PASSWORD:?set GATEWAY_POSTGRES_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for migration in /migrations/*.sql; do psql -h postgres -U gateway -d gateway -v ON_ERROR_STOP=1 -f \"$$migration\"; done"]
    volumes:
      - ./migrations:/migrations:ro

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - gateway-minio:/data

  minio-ready:
    image: curlimages/curl:8.14.1
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until curl --fail --silent http://minio:9000/minio/health/live > /dev/null; do sleep 1; done"]

volumes:
  gateway-postgres:
  gateway-minio:
