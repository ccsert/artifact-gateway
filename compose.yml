name: artifact-gateway

x-local-dev:
  gateway-port: ${GATEWAY_HTTP_PORT:-8080}
  console-port: ${GATEWAY_CONSOLE_PORT:-4173}

services:
  gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-ready:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      GATEWAY_LISTEN_ADDRESS: :8080
      GATEWAY_NODE_ROLES: ${GATEWAY_NODE_ROLES:-standalone}
      GATEWAY_INSTANCE_ID: ${GATEWAY_INSTANCE_ID:-gateway-local}
      GATEWAY_WORKER_FORMATS: ${GATEWAY_WORKER_FORMATS:-}
      GATEWAY_WORKER_KINDS: ${GATEWAY_WORKER_KINDS:-}
      GATEWAY_SCANNER_ENDPOINT: ${GATEWAY_SCANNER_ENDPOINT:-}
      GATEWAY_SCANNER_HEALTH_ENDPOINT: ${GATEWAY_SCANNER_HEALTH_ENDPOINT:-}
      GATEWAY_SCANNER_NAME: ${GATEWAY_SCANNER_NAME:-}
      GATEWAY_SCANNER_TOKEN: ${GATEWAY_SCANNER_TOKEN:-}
      GATEWAY_SCANNER_TIMEOUT: ${GATEWAY_SCANNER_TIMEOUT:-}
      GATEWAY_SCANNER_HEALTH_TIMEOUT: ${GATEWAY_SCANNER_HEALTH_TIMEOUT:-}
      GATEWAY_SCANNER_DATABASE_MAX_AGE: ${GATEWAY_SCANNER_DATABASE_MAX_AGE:-}
      GATEWAY_SCANNER_MAX_RESPONSE_BYTES: ${GATEWAY_SCANNER_MAX_RESPONSE_BYTES:-}
      GATEWAY_SCANNER_MAX_ARTIFACT_BYTES: ${GATEWAY_SCANNER_MAX_ARTIFACT_BYTES:-}
      GATEWAY_SCANNER_FORMATS: ${GATEWAY_SCANNER_FORMATS:-}
      GATEWAY_APT_SIGNER_ENDPOINT: ${GATEWAY_APT_SIGNER_ENDPOINT:-}
      GATEWAY_APT_SIGNER_TOKEN: ${GATEWAY_APT_SIGNER_TOKEN:-}
      GATEWAY_APT_SIGNER_TIMEOUT: ${GATEWAY_APT_SIGNER_TIMEOUT:-}
      GATEWAY_APT_SIGNER_TRUSTED_FINGERPRINTS: ${GATEWAY_APT_SIGNER_TRUSTED_FINGERPRINTS:-}
      GATEWAY_APT_SIGNER_TRUSTED_PUBLIC_KEYS_FILE: ${GATEWAY_APT_SIGNER_TRUSTED_PUBLIC_KEYS_FILE:-}
      GATEWAY_APT_SIGNER_TLS_CA_FILE: ${GATEWAY_APT_SIGNER_TLS_CA_FILE:-}
      GATEWAY_DATABASE_URL: postgres://gateway:${GATEWAY_POSTGRES_PASSWORD:?set GATEWAY_POSTGRES_PASSWORD in .env}@postgres:5432/gateway?sslmode=disable
      GATEWAY_DATABASE_MAX_OPEN_CONNS: ${GATEWAY_DATABASE_MAX_OPEN_CONNS:-32}
      GATEWAY_DATABASE_MAX_IDLE_CONNS: ${GATEWAY_DATABASE_MAX_IDLE_CONNS:-8}
      GATEWAY_DATABASE_COORDINATOR_MAX_OPEN_CONNS: ${GATEWAY_DATABASE_COORDINATOR_MAX_OPEN_CONNS:-8}
      GATEWAY_DATABASE_COORDINATOR_MAX_IDLE_CONNS: ${GATEWAY_DATABASE_COORDINATOR_MAX_IDLE_CONNS:-2}
      GATEWAY_DATABASE_ARTIFACT_LOCK_MAX_OPEN_CONNS: ${GATEWAY_DATABASE_ARTIFACT_LOCK_MAX_OPEN_CONNS:-4}
      GATEWAY_DATABASE_ARTIFACT_LOCK_MAX_IDLE_CONNS: ${GATEWAY_DATABASE_ARTIFACT_LOCK_MAX_IDLE_CONNS:-1}
      GATEWAY_DATABASE_CONN_MAX_LIFETIME: ${GATEWAY_DATABASE_CONN_MAX_LIFETIME:-30m}
      GATEWAY_DATABASE_CONN_MAX_IDLE_TIME: ${GATEWAY_DATABASE_CONN_MAX_IDLE_TIME:-5m}
      GATEWAY_RUSTFS_ENDPOINT: http://rustfs:9000
      GATEWAY_RUSTFS_BUCKET: gateway-cache
      GATEWAY_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      GATEWAY_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      GATEWAY_OCI_PROXY_ALLOWED_HOSTS: ${GATEWAY_OCI_PROXY_ALLOWED_HOSTS:-}
      GATEWAY_MAVEN_PROXY_ALLOWED_HOSTS: ${GATEWAY_MAVEN_PROXY_ALLOWED_HOSTS:-}
      GATEWAY_RAW_PROXY_ALLOWED_HOSTS: ${GATEWAY_RAW_PROXY_ALLOWED_HOSTS:-}
      GATEWAY_RAW_CACHE_MAX_OBJECT_BYTES: ${GATEWAY_RAW_CACHE_MAX_OBJECT_BYTES:-}
      GATEWAY_CONAN_CACHE_MAX_OBJECT_BYTES: ${GATEWAY_CONAN_CACHE_MAX_OBJECT_BYTES:-}
      GATEWAY_OCI_CACHE_TTL: ${GATEWAY_OCI_CACHE_TTL:-}
      GATEWAY_MAVEN_CACHE_TTL: ${GATEWAY_MAVEN_CACHE_TTL:-}
      GATEWAY_MAVEN_METADATA_CACHE_TTL: ${GATEWAY_MAVEN_METADATA_CACHE_TTL:-}
      GATEWAY_MAVEN_NEGATIVE_CACHE_TTL: ${GATEWAY_MAVEN_NEGATIVE_CACHE_TTL:-}
      GATEWAY_RAW_CACHE_TTL: ${GATEWAY_RAW_CACHE_TTL:-}
      GATEWAY_CONAN_CACHE_TTL: ${GATEWAY_CONAN_CACHE_TTL:-}
      GATEWAY_NPM_METADATA_CACHE_TTL: ${GATEWAY_NPM_METADATA_CACHE_TTL:-}
      GATEWAY_NPM_NEGATIVE_CACHE_TTL: ${GATEWAY_NPM_NEGATIVE_CACHE_TTL:-}
      GATEWAY_NPM_PROXY_BREAKER_TTL: ${GATEWAY_NPM_PROXY_BREAKER_TTL:-}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?set GATEWAY_ADMIN_TOKEN in .env}
      GATEWAY_RESOLVER_TOKEN: ${GATEWAY_RESOLVER_TOKEN:?set GATEWAY_RESOLVER_TOKEN in .env}
      GATEWAY_EGRESS_PROXY_KEY: ${GATEWAY_EGRESS_PROXY_KEY:-}
      GATEWAY_SETTINGS_ENCRYPTION_KEY: ${GATEWAY_SETTINGS_ENCRYPTION_KEY:-}
      GATEWAY_REPOSITORY_READERS: ${GATEWAY_REPOSITORY_READERS:-}
      GATEWAY_REPOSITORY_CACHE_QUOTAS: ${GATEWAY_REPOSITORY_CACHE_QUOTAS:-}
      GATEWAY_OIDC_ISSUER: ${GATEWAY_OIDC_ISSUER:-}
      GATEWAY_OIDC_AUDIENCE: ${GATEWAY_OIDC_AUDIENCE:-}
      GATEWAY_OIDC_JWKS_URL: ${GATEWAY_OIDC_JWKS_URL:-}
      GATEWAY_OIDC_CLIENT_ID: ${GATEWAY_OIDC_CLIENT_ID:-}
      GATEWAY_OIDC_CLIENT_SECRET: ${GATEWAY_OIDC_CLIENT_SECRET:-}
      GATEWAY_OIDC_REDIRECT_URL: ${GATEWAY_OIDC_REDIRECT_URL:-}
      GATEWAY_OIDC_SCOPES: ${GATEWAY_OIDC_SCOPES:-}
      GATEWAY_OIDC_ADMIN_SUBJECTS: ${GATEWAY_OIDC_ADMIN_SUBJECTS:-}
      GATEWAY_OIDC_READER_ROLES: ${GATEWAY_OIDC_READER_ROLES:-}
      GATEWAY_OIDC_WRITER_ROLES: ${GATEWAY_OIDC_WRITER_ROLES:-}
      GATEWAY_OIDC_ADMIN_ROLES: ${GATEWAY_OIDC_ADMIN_ROLES:-}
      GATEWAY_OTLP_HTTP_ENDPOINT: ${GATEWAY_OTLP_HTTP_ENDPOINT:-}
      GATEWAY_OTEL_SAMPLING_RATIO: ${GATEWAY_OTEL_SAMPLING_RATIO:-1}
      # 出网代理：让 proxy 仓库的上游请求走宿主机代理（容器经 host-gateway 访问）
      HTTP_PROXY: ${GATEWAY_EGRESS_PROXY:-}
      HTTPS_PROXY: ${GATEWAY_EGRESS_PROXY:-}
      NO_PROXY: postgres,rustfs,host.docker.internal,127.0.0.1,localhost
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/gateway-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  reference-scanner:
    profiles: ["scanner"]
    build:
      context: .
      dockerfile: Dockerfile.scanner
    depends_on:
      gateway:
        condition: service_healthy
    # The sidecar shares only Gateway's network namespace and binds loopback.
    # Artifact bytes and an optional bearer token never traverse a Docker network.
    network_mode: "service:gateway"
    environment:
      REFERENCE_SCANNER_LISTEN_ADDRESS: 127.0.0.1:18082
      REFERENCE_SCANNER_TOKEN: ${GATEWAY_SCANNER_TOKEN:-}
      REFERENCE_SCANNER_SCAN_TIMEOUT: ${GATEWAY_SCANNER_TIMEOUT:-10m}
      REFERENCE_SCANNER_HEALTH_TIMEOUT: ${GATEWAY_SCANNER_HEALTH_TIMEOUT:-10s}
      REFERENCE_SCANNER_MAX_ARTIFACT_BYTES: ${REFERENCE_SCANNER_MAX_ARTIFACT_BYTES:-1073741824}
      REFERENCE_SCANNER_MAX_OUTPUT_BYTES: ${REFERENCE_SCANNER_MAX_OUTPUT_BYTES:-67108864}
      REFERENCE_SCANNER_MAX_CONCURRENT: ${REFERENCE_SCANNER_MAX_CONCURRENT:-1}
      REFERENCE_SCANNER_SBOM_DIR: /var/lib/reference-scanner/sboms
      REFERENCE_SCANNER_BASE_URL: http://127.0.0.1:18082
      REFERENCE_SCANNER_MAX_SBOM_BYTES: ${REFERENCE_SCANNER_MAX_SBOM_BYTES:-2147483648}
      HTTP_PROXY: ${GATEWAY_EGRESS_PROXY:-}
      HTTPS_PROXY: ${GATEWAY_EGRESS_PROXY:-}
      NO_PROXY: 127.0.0.1,localhost
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    tmpfs:
      - /tmp:size=1610612736,mode=1777
    volumes:
      - gateway-trivy-cache:/var/cache/trivy
      - gateway-scanner-sboms:/var/lib/reference-scanner/sboms
    healthcheck:
      test: ["CMD", "/usr/local/bin/reference-scanner-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  reference-apt-signer:
    profiles: ["apt-signer"]
    build:
      context: .
      dockerfile: Dockerfile.apt-signer
    depends_on:
      gateway:
        condition: service_healthy
    # Private keys remain in this container and the signer binds only the
    # loopback interface shared with Gateway's network namespace.
    network_mode: "service:gateway"
    environment:
      REFERENCE_APT_SIGNER_LISTEN_ADDRESS: 127.0.0.1:18083
      REFERENCE_APT_SIGNER_TOKEN: ${GATEWAY_APT_SIGNER_TOKEN:-}
      REFERENCE_APT_SIGNER_KEY_FILE: /var/lib/reference-apt-signer/apt-release-private.gpg
      REFERENCE_APT_SIGNER_RSA_BITS: ${REFERENCE_APT_SIGNER_RSA_BITS:-4096}
      REFERENCE_APT_SIGNER_MAX_RELEASE_BYTES: ${REFERENCE_APT_SIGNER_MAX_RELEASE_BYTES:-16777216}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    volumes:
      - gateway-apt-signer:/var/lib/reference-apt-signer
    healthcheck:
      test: ["CMD", "/usr/local/bin/reference-apt-signer-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:?set GATEWAY_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${GATEWAY_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gateway-postgres:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${GATEWAY_POSTGRES_PASSWORD:?set GATEWAY_POSTGRES_PASSWORD in .env}
    entrypoint: ["/usr/local/bin/run-migrations"]
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/usr/local/bin/run-migrations:ro

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    entrypoint: ["/bin/sh", "/usr/local/bin/run-rustfs"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_RPC_SECRET: ${RUSTFS_RPC_SECRET:?set RUSTFS_RPC_SECRET in .env}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - gateway-rustfs:/data
      - ./scripts/run-rustfs.sh:/usr/local/bin/run-rustfs:ro

  rustfs-ready:
    image: curlimages/curl:8.14.1
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for attempt in $$(seq 1 30); do curl --fail --silent --max-time 2 http://rustfs:9000/health > /dev/null && exit 0; sleep 1; done; echo 'RustFS readiness deadline exceeded after 30 attempts.' >&2; exit 1"]

volumes:
  gateway-postgres:
  gateway-rustfs:
  gateway-trivy-cache:
  gateway-scanner-sboms:
  gateway-apt-signer:
