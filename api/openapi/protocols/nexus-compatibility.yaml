---
x-gateway-protocol-overlay:
  officialSpecification: Nexus-style repository roots are a client migration convention,
    not a package protocol.
  gatewayDecision: Resolve /repository/{repository}/{path} to an existing Maven,
    npm, PyPI, Raw, or Go Hosted, Proxy, or Group target and dispatch the request
    to that format's canonical handler. Authentication, authorization, auditing,
    validation, and object lifecycle remain canonical. OCI is excluded because
    Registry V2 clients require the /v2 protocol root.
nexus_compatible_repository_path:
  servers:
  - url: https://gateway.example.com
  parameters:
  - name: repository
    in: path
    required: true
    description: Existing Hosted, Proxy, or Group name. A Hosted/Proxy repository
      takes precedence over a same-named Group, matching canonical routing.
    schema:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  - name: path
    in: path
    required: true
    allowReserved: true
    description: Format-specific catch-all path below the repository root.
    schema:
      type: string
      minLength: 1
  get:
    operationId: readNexusCompatibleRepositoryPath
    description: Reads through the existing Maven, npm, PyPI, Raw, or Go protocol
      handler. Group targets remain read-only. npm tarball URLs preserve this
      repository root so newly generated lockfiles do not switch route families.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    - {}
    responses:
      '200':
        description: Format-specific metadata or artifact bytes
      '206':
        description: Raw single-range response
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  head:
    operationId: headNexusCompatibleRepositoryPath
    description: Returns the same headers as the resolved canonical protocol route
      without a response body.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    - {}
    responses:
      '200':
        description: Format-specific metadata headers
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  put:
    operationId: putNexusCompatibleRepositoryPath
    description: Dispatches standard Maven/Gradle, npm, Raw, or Gateway Go Hosted
      publication to the existing format handler. Proxy and Group targets reject
      writes according to their canonical contracts.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      '200':
        description: Idempotent publication replay accepted
      '201':
        description: Artifact published or staged by the target repository policy
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: postNexusCompatibleRepositoryPath
    description: Dispatches PyPI legacy multipart upload or Raw resumable-upload
      creation to the existing Hosted handler.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: true
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    responses:
      '201':
        description: Distribution published or resumable upload created
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
  patch:
    operationId: patchNexusCompatibleRepositoryPath
    description: Appends a Raw resumable-upload chunk when the query and offset
      headers satisfy the canonical Raw contract.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    responses:
      '204':
        description: Chunk appended
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
  delete:
    operationId: deleteNexusCompatibleRepositoryPath
    description: Dispatches a Raw Hosted delete to the canonical lifecycle path;
      formats without protocol delete support reject the operation.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    responses:
      '204':
        description: Artifact tombstoned
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  x-gateway-catchAll: path
  x-gateway-formats:
  - maven
  - npm
  - pypi
  - raw
  - go
  x-gateway-routing: internal_alias_to_canonical_handler
