description: Conan 2 supports Group/Proxy read-through and native Hosted resolution
  under the existing /conan/v2 route family. Hosted publication uses the repository
  management publish-session contract; lifecycle operations use the native Hosted
  revision routes, while indexed reference browse/search is exposed through the
  versioned management API.
