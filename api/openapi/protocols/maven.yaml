---
x-gateway-protocol-overlay:
  officialSpecification: https://maven.apache.org/repositories/index.html
  gatewayDecision: Publish successful standard Maven/Gradle PUTs directly by default.
    A Maven Hosted repository may opt in to strict publication, which stages uploads
    until an explicit Gateway coordinate commit. Client metadata is not authoritative.
repository_maven_repository_assetPath:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryName"
  - name: assetPath
    in: path
    required: true
    allowReserved: true
    description: 'Canonical Maven asset path: groupId path, artifactId, version, and
      filename. This is a gateway catch-all parameter; directly published or strictly
      committed POMs, component assets, checksums, and generated metadata are readable.'
    schema:
      type: string
      minLength: 1
  get:
    operationId: readMavenAsset
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    - {}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/BinaryObject"
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  put:
    operationId: stageMavenProtocolAsset
    description: Standard Maven/Gradle deploy upload. By default the Gateway publishes
      each verified upload directly so unmodified clients work without a companion call.
      When Maven strict publication is enabled for the Hosted repository, the request
      stages the object until coordinate commit. Client checksum sidecars are assertions
      and client metadata is a compatibility no-op; the Gateway derives authoritative
      checksums and metadata from verified objects.
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    responses:
      '201':
        description: Published directly by default, or staged when Maven strict
          publication is enabled; an idempotent replay is also accepted
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
  x-gateway-catchAll: assetPath
  x-gateway-visibility: repository_policy
  x-gateway-publication: direct_by_default_strict_coordinate_commit_opt_in
repository_maven_repository_coordinates_coordinate_commit:
  servers:
  - url: https://gateway.example.com
  post:
    operationId: commitMavenCoordinate
    description: Used only by Maven Hosted repositories with strict publication enabled.
      A CI integration, publishing wrapper, or optional Maven/Gradle extension calls it
      after normal deploy uploads. It is the strict mode coordinate visibility signal;
      request ordering, checksums, metadata, and quiet time are never completion signals.
      Repositories using the default direct mode reject this operation with 409 because
      their verified PUTs are already visible.
    parameters:
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    - "$ref": "../components/parameters.yaml#/RepositoryName"
    - name: coordinate
      in: path
      required: true
      allowReserved: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+$"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CommitMavenCoordinate"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/Artifact"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
  x-gateway-visibility-transition: single_postgres_transaction
  x-gateway-client-authority: asset_names_only
