---
x-gateway-protocol-overlay:
  officialSpecification: https://docs.npmjs.com/cli/commands/npm-dist-tag
  gatewayDecision: >
    This overlay documents native npm dist-tags, package metadata,
    deprecation and revision-based unpublish. Hosted repositories accept
    metadata changes; Proxy and Group repositories only read metadata and list
    tags. A tag may name only a visible, committed, non-tombstoned version the
    quarantine read policy does not block. Each change commits atomically with
    its audit record and never alters a tarball, digest, or version identity.
npm_repository_package_dist_tags:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryName"
  - "$ref": "../components/parameters.yaml#/NPMPackageName"
  get:
    operationId: listNPMDistTags
    description: >
      Lists the package's dist-tags as an object of tag name to version. Hosted
      repositories read committed tags; Proxy repositories answer from the
      cached upstream packument with the same revalidation and stale rules as
      the packument; Groups merge members in Group order, where the first
      member that defines a tag is authoritative for it. Tags naming a
      quarantine-blocked or invisible version are omitted.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    - {}
    responses:
      '200':
        description: Visible dist-tags
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/NPMDistTags"
      '304':
        description: The If-None-Match ETag still matches
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '403':
        description: Authenticated principal lacks Repository read permission
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
      '503':
        description: Package metadata is unavailable
  head:
    operationId: headNPMDistTags
    description: Returns the same headers as GET without the body.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    - {}
    responses:
      '200':
        description: Visible dist-tag headers
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
npm_repository_package_dist_tag:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryName"
  - "$ref": "../components/parameters.yaml#/NPMPackageName"
  - name: tag
    in: path
    required: true
    description: >
      Dist-tag name. Names that parse as an npm SemVer range, including
      wildcard forms such as x.x, x.1, and v*, are refused. A digit prefix
      alone is allowed: 2026-release, 2026-10-16, 1-canary, and v1-release
      remain ordinary tags so `<pkg>@<tag>` stays unambiguous.
    schema:
      type: string
      minLength: 1
      maxLength: 128
  put:
    operationId: setNPMDistTag
    description: >
      Adds or moves a Hosted dist-tag (`npm dist-tag add`). The body is the
      target version as a JSON string. The store re-checks the target's
      visibility under the same row locks that tombstone and restore take, so a
      tag can never be left naming a tombstoned version. Repeating the current
      state succeeds without a change and is audited with changed=false.
      Requires Repository write permission.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: string
            description: Target SemVer version
    responses:
      '200':
        description: Dist-tag committed
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/NPMDistTagResult"
      '400':
        description: The body is not a JSON string naming a valid SemVer version
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '403':
        description: Authenticated principal lacks Repository write permission
      '404':
        description: The package or target version is not visible
      '405':
        description: Proxy and Group repositories do not accept dist-tag changes
      '409':
        description: The target version is blocked by the quarantine read policy
      '503':
        description: Dist-tag storage is unavailable
  delete:
    operationId: deleteNPMDistTag
    description: >
      Removes a Hosted dist-tag (`npm dist-tag rm`). `latest` cannot be
      removed; move it with PUT instead. Requires Repository write permission.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    responses:
      '200':
        description: Dist-tag removed
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/NPMDistTagResult"
      '400':
        description: The latest dist-tag cannot be removed
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '403':
        description: Authenticated principal lacks Repository write permission
      '404':
        description: The package or dist-tag does not exist
      '405':
        description: Proxy and Group repositories do not accept dist-tag changes
      '503':
        description: Dist-tag storage is unavailable
  x-gateway-visibility: visible_committed_versions_only
  x-gateway-mutation: single_store_transaction_with_audit

npm_repository_package:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryName"
  - "$ref": "../components/parameters.yaml#/NPMPackageName"
  get:
    operationId: getNPMRegistryPackage
    description: >
      Native packument, including per-version deprecated warnings. Hosted
      answers include _rev from a consistent package/version snapshot. npm
      11.6.2 uses ?write=true before deprecate and unpublish. Hosted tombstones
      suppress the same version in lower-priority Group members. Proxy
      deprecated fields follow the normal metadata revalidation/cache contract.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    - {}
    responses:
      '200':
        description: Visible npm package metadata
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/NPMRegistryMetadata"
      '304':
        description: ETag still matches
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '403':
        description: Repository read permission or account state denies access
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
      '503':
        description: Package metadata is unavailable
  put:
    operationId: putNPMRegistryPackage
    description: >
      npm publish with one tarball attachment, or npm deprecate/undeprecate
      with a full packument and no attachments. Both require Repository write
      permission. Metadata changes require current _rev and preserve every
      visible version, dist-tag and immutable manifest field except deprecated.
      npm's own SemVer range selection is honored as the exact changed-version
      set, not reinterpreted as another range language. Messages are plain text,
      at most 4096 UTF-8 bytes; empty clears. At most 1000 versions per metadata
      document. One invalid/unknown target rejects the whole mutation. Changes
      and their actor/version/reason audit commit together. A lost response or
      stale retry must be resolved by reading current state; old revisions get
      409 and never overwrite later publications, tags, deletes or restores.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Native npm publication or full packument with _rev; no alternate management publication model.
            additionalProperties: true
    responses:
      '200':
        description: Metadata committed; bytes, digest, publisher and publication time are unchanged
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/NPMMetadataResult"
      '201':
        description: Immutable version publication committed
      '400':
        description: Invalid document, message, selection or attempted immutable-field/tag change
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '403':
        description: Repository write permission or account state denies access
      '404':
        description: Package or selected version is unavailable
      '405':
        description: Proxy and Group repositories are read-only
      '409':
        description: Stale revision or immutable version already published
      '422':
        description: Tarball identity or integrity does not match the publication
      '507':
        description: Publication exceeds capacity quota
      '503':
        description: Metadata storage is unavailable
  x-gateway-mutation: single_store_transaction_with_audit
npm_repository_package_revision:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryName"
  - "$ref": "../components/parameters.yaml#/NPMPackageName"
  - name: revision
    in: path
    required: true
    schema:
      type: string
      pattern: '^[1-9][0-9]*$'
  put:
    operationId: unpublishNPMRegistryVersions
    description: >
      npm 11.6.2 single-version unpublish. Requires Repository admin permission,
      current path/body _rev, and a full packument retaining unchanged version
      documents. Removed versions become existing lifecycle tombstones; tags
      are updated in the same transaction. Invalid retained targets reject the
      complete change. Tarballs remain under retention, object leases,
      reference-safe reclaim and the existing management restore operation.
      No Proxy/Group mutation or upstream delete is performed.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/NPMRegistryMetadata"
    responses:
      '200':
        description: Selected versions, tags, tombstones and audit committed together
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/NPMMetadataResult"
      '400':
        description: Invalid selection, tags or changed immutable fields
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '403':
        description: Repository admin permission or account state denies deletion
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
      '405':
        description: Only Hosted repositories accept unpublish
      '409':
        description: Revision changed; re-read before deciding whether to retry
      '503':
        description: Metadata storage is unavailable
  delete:
    operationId: unpublishNPMRegistryPackage
    description: >
      npm whole-package unpublish or removal of its only remaining version.
      Requires Repository admin permission and current revision. At most 1000
      visible versions are atomically tombstoned with tags and audit; no bytes
      are physically deleted. Identity reservations prevent republishing even
      after reclaim. Restore individual versions through the existing
      /repositories/{repositoryId}/restore management operation before reclaim;
      restore preserves deprecation and immutable bytes, creates latest only
      if absent, and does not recreate all removed custom tags.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    responses:
      '200':
        description: Whole package tombstoned with its audit
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/NPMMetadataResult"
      '400':
        description: Package exceeds the bounded mutation selection
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '403':
        description: Repository admin permission or account state denies deletion
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
      '405':
        description: Only Hosted repositories accept unpublish
      '409':
        description: Revision changed; no mutation committed
      '503':
        description: Metadata storage is unavailable
  x-gateway-mutation: single_store_transaction_with_audit
npm_repository_tarball_revision:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryName"
  - "$ref": "../components/parameters.yaml#/NPMPackageName"
  - name: tarball
    in: path
    required: true
    schema:
      type: string
      maxLength: 255
  - name: revision
    in: path
    required: true
    schema:
      type: string
      pattern: '^[1-9][0-9]*$'
  delete:
    operationId: acknowledgeNPMUnpublishTarball
    description: >
      npm's follow-up cleanup acknowledgement. Requires Repository admin,
      current package revision and an already-tombstoned tarball identity.
      Repeating acknowledgement is safe. This never deletes bytes; retention
      and reference-safe reclaim own physical deletion. A still-visible
      version must first be unpublished atomically through its packument.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    responses:
      '200':
        description: Tombstone acknowledged; bytes retained
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/NPMMetadataResult"
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '403':
        description: Repository admin permission or account state denies deletion
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
      '405':
        description: Only Hosted repositories accept unpublish
      '409':
        description: Stale revision or tarball version has not been tombstoned
      '503':
        description: Metadata storage is unavailable
