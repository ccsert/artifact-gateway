---
x-gateway-protocol-overlay:
  officialSpecification: https://go.dev/ref/mod#goproxy-protocol
  gatewayDecision: >
    GET and HEAD implement the standard GOPROXY read protocol. Go defines no
    upload protocol, so Hosted publication is an explicit Gateway extension:
    one authenticated PUT of a canonical module ZIP derives .mod and .info and
    atomically publishes all three representations.
go_repository_modulePath:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryName"
  - name: modulePath
    in: path
    required: true
    allowReserved: true
    description: >
      Catch-all beginning with the case-escaped module path and ending in
      /@v/list, /@latest, or /@v/<escaped-version>.(info|mod|zip).
    schema:
      type: string
      minLength: 1
  get:
    operationId: readGoModuleRepresentation
    description: Reads a standard GOPROXY list, latest, info, mod, or zip representation.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    - {}
    responses:
      '200':
        description: Immutable GOPROXY representation
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  head:
    operationId: headGoModuleRepresentation
    description: Returns the same headers as GET without the representation body.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    - {}
    responses:
      '200':
        description: Immutable GOPROXY representation headers
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  put:
    operationId: publishGoHostedModule
    description: >
      Gateway-specific Go Hosted publication. The catch-all must identify an
      escaped semantic version with a .zip suffix. The body is validated as a
      canonical Go module ZIP containing a matching top-level go.mod. The
      Gateway derives .mod and .info and publishes all representations in one
      metadata transaction. Identical retries preserve the first publication
      time; changed bytes at the same module version are rejected.
    security:
    - protocolBasicAuth: []
    - protocolBearerAuth: []
    requestBody:
      required: true
      content:
        application/zip:
          schema:
            type: string
            contentEncoding: binary
    responses:
      '200':
        description: Identical publication replayed
      '201':
        description: Module version published
      '400':
        description: Request body could not be read
      '401':
        "$ref": "../components/responses.yaml#/BasicUnauthorized"
      '403':
        description: Authenticated principal lacks Repository write permission
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '413':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
      '500':
        description: Publication persistence failed
      '503':
        description: Publication coordination is unavailable
      '507':
        description: Repository capacity quota exceeded
  x-gateway-catchAll: modulePath
  x-gateway-visibility: all_three_representations_committed_together
  x-gateway-publication: gateway_specific_single_zip_put
