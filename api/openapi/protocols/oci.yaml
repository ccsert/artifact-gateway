---
x-gateway-protocol-overlay:
  officialSpecification: https://distribution.github.io/distribution/spec/api/
  gatewayDecision: Hosted implements Registry V2 publication and reads. Proxy and
    Group discovery uses bounded principal-bound Catalog snapshots and verified
    OCI 1.1 Referrers API responses from the subject's fixed authority. Source or
    permission changes reject stale snapshots. Unsupported Catalog or Referrers
    is explicit; referrers tag fallback is not implemented. Verified bytes do not
    establish signer trust. Proxy/Group writes and direct blob deletion are excluded.
v2_name_blobs_uploads:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/OCIName"
  post:
    operationId: startOCIUpload
    description: Starts a Registry V2 blob upload. mount and from request a cross-repository
      mount when the source blob is available to the Gateway.
    security:
    - ociBearerAuth: []
    parameters:
    - name: mount
      in: query
      schema:
        type: string
        pattern: "^sha256:[a-f0-9]{64}$"
    - name: from
      in: query
      schema:
        type: string
    responses:
      '201':
        description: Blob mounted
        headers:
          Location:
            schema:
              type: string
          Docker-Content-Digest:
            schema:
              type: string
              pattern: "^sha256:[a-f0-9]{64}$"
      '202':
        "$ref": "../components/responses.yaml#/OCIUploadAccepted"
      '400':
        "$ref": "../components/responses.yaml#/OCIError"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
v2_name_blobs_uploads_uuid:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/OCIName"
  - name: uuid
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: getOCIUploadStatus
    security:
    - ociBearerAuth: []
    responses:
      '204':
        "$ref": "../components/responses.yaml#/OCIUploadAccepted"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/OCIError"
  patch:
    operationId: appendOCIUpload
    security:
    - ociBearerAuth: []
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    responses:
      '202':
        "$ref": "../components/responses.yaml#/OCIUploadAccepted"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/OCIError"
      '416':
        "$ref": "../components/responses.yaml#/OCIError"
  put:
    operationId: completeOCIUpload
    security:
    - ociBearerAuth: []
    parameters:
    - name: digest
      in: query
      required: true
      schema:
        type: string
        pattern: "^sha256:[a-f0-9]{64}$"
    requestBody:
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    responses:
      '201':
        description: Blob completed
        headers:
          Location:
            schema:
              type: string
          Docker-Content-Digest:
            schema:
              type: string
              pattern: "^sha256:[a-f0-9]{64}$"
      '400':
        "$ref": "../components/responses.yaml#/OCIError"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/OCIError"
      '409':
        "$ref": "../components/responses.yaml#/OCIError"
      '416':
        "$ref": "../components/responses.yaml#/OCIError"
  delete:
    operationId: cancelOCIUpload
    security:
    - ociBearerAuth: []
    responses:
      '204':
        description: Upload cancelled
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/OCIError"
v2_name_blobs_digest:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/OCIName"
  - "$ref": "../components/parameters.yaml#/Digest"
  get:
    operationId: readOCIBlob
    security:
    - ociBearerAuth: []
    - {}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/BinaryObject"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  head:
    operationId: headOCIBlob
    security:
    - ociBearerAuth: []
    - {}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/BinaryObject"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  x-gateway-visibility: committed_only
v2_name_manifests_reference:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/OCIName"
  - "$ref": "../components/parameters.yaml#/OCIReference"
  get:
    operationId: readOCIManifest
    security:
    - ociBearerAuth: []
    - {}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/OCIManifest"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
      '406':
        "$ref": "../components/responses.yaml#/OCIError"
  head:
    operationId: headOCIManifest
    security:
    - ociBearerAuth: []
    - {}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/OCIManifest"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
      '406':
        "$ref": "../components/responses.yaml#/OCIError"
  put:
    operationId: putOCIManifest
    security:
    - ociBearerAuth: []
    requestBody:
      required: true
      content:
        application/vnd.oci.image.manifest.v1+json:
          schema:
            type: object
        application/vnd.oci.image.index.v1+json:
          schema:
            type: object
    responses:
      '201':
        description: Manifest published
        headers:
          Location:
            schema:
              type: string
          Docker-Content-Digest:
            schema:
              type: string
              pattern: "^sha256:[a-f0-9]{64}$"
      '400':
        "$ref": "../components/responses.yaml#/OCIError"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '413':
        "$ref": "../components/responses.yaml#/OCIError"
  delete:
    operationId: deleteOCIManifest
    description: Deletes an OCI manifest by digest. Deleting by a mutable tag is not
      supported.
    security:
    - ociBearerAuth: []
    responses:
      '202':
        description: Manifest deleted
      '400':
        "$ref": "../components/responses.yaml#/OCIError"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/OCIError"
  x-gateway-visibility: committed_only
v2_name_tags_list:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/OCIName"
  - name: n
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
  - name: last
    in: query
    schema:
      type: string
  get:
    operationId: listOCITags
    security:
    - ociBearerAuth: []
    - {}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/OCITagList"
      '400':
        "$ref": "../components/responses.yaml#/OCIError"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  head:
    operationId: headOCITags
    security:
    - ociBearerAuth: []
    - {}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/OCITagList"
      '400':
        "$ref": "../components/responses.yaml#/OCIError"
      '401':
        "$ref": "../components/responses.yaml#/OCIUnauthorized"
      '404':
        "$ref": "../components/responses.yaml#/ProtocolNotFound"
  x-gateway-visibility: committed_only
v2_catalog:
  servers:
  - url: https://gateway.example.com
  parameters:
  - name: n
    in: query
    schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
  - name: last
    in: query
    schema: {type: string}
  - name: snapshot
    in: query
    description: Server-issued principal-bound snapshot returned in Link. Configuration or authorization changes reject this cursor.
    schema: {type: string, format: uuid}
  get:
    operationId: listOCICatalog
    description: Names use the directly readable repository-or-group/image prefix. Coverage describes only the authorized view; cached image names never substitute for upstream enumeration. Catalog supports bounded complete or partial results; entirely unsupported sources return 501.
    security:
    - ociBearerAuth: []
    responses:
      '200':
        description: Authorized immutable catalog page with explicit coverage
        headers:
          Link: {schema: {type: string}}
          OCI-Gateway-Discovery-Coverage: {schema: {type: string, enum: [complete, partial, unsupported]}}
        content:
          application/json:
            schema:
              type: object
              required: [repositories, gateway]
              properties:
                repositories: {type: array, items: {type: string}}
                gateway:
                  type: object
                  required: [coverage, sources, entries, snapshot]
                  properties:
                    coverage: {type: string, enum: [complete, partial, unsupported]}
                    snapshot: {type: string, format: uuid}
                    sources:
                      type: array
                      items:
                        type: object
                        required: [namespace, state]
                        properties:
                          namespace: {type: string}
                          state: {type: string, enum: [complete, partial, unsupported]}
                          reason: {type: string, enum: [unavailable, upstream_authorization, client_unavailable, catalog_unsupported, invalid_response, invalid_pagination, pagination_loop, invalid_name, name_budget, page_budget, safety_budget]}
                    entries:
                      type: array
                      items:
                        type: object
                        required: [name, sources]
                        properties:
                          name: {type: string}
                          sources: {type: array, items: {type: string}}
      '400': {"$ref": "../components/responses.yaml#/OCIError"}
      '401': {"$ref": "../components/responses.yaml#/OCIUnauthorized"}
      '404': {"$ref": "../components/responses.yaml#/OCIError"}
      '409': {"$ref": "../components/responses.yaml#/OCIError"}
      '429': {"$ref": "../components/responses.yaml#/OCIError"}
      '501': {"$ref": "../components/responses.yaml#/OCIError"}
      '502': {"$ref": "../components/responses.yaml#/OCIError"}
      '503': {"$ref": "../components/responses.yaml#/OCIError"}
  head:
    operationId: headOCICatalog
    description: Catalog page metadata with the same principal-bound snapshot and coverage rules as GET.
    security:
    - ociBearerAuth: []
    responses:
      '200':
        description: Validated discovery page headers without a response body
        headers:
          Link: {schema: {type: string}}
          OCI-Gateway-Discovery-Coverage: {schema: {type: string, enum: [complete, partial, unsupported]}}
      '400': {"$ref": "../components/responses.yaml#/OCIError"}
      '401': {"$ref": "../components/responses.yaml#/OCIUnauthorized"}
      '404': {"$ref": "../components/responses.yaml#/OCIError"}
      '409': {"$ref": "../components/responses.yaml#/OCIError"}
      '429': {"$ref": "../components/responses.yaml#/OCIError"}
      '501': {"$ref": "../components/responses.yaml#/OCIError"}
      '502': {"$ref": "../components/responses.yaml#/OCIError"}
      '503': {"$ref": "../components/responses.yaml#/OCIError"}

v2_name_referrers_digest:
  servers:
  - url: https://gateway.example.com
  parameters:
  - "$ref": "../components/parameters.yaml#/OCIName"
  - name: digest
    in: path
    required: true
    schema: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
  - name: artifactType
    in: query
    schema: {type: string, maxLength: 512}
  - name: n
    in: query
    schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
  - name: last
    in: query
    schema: {type: string}
  - name: snapshot
    in: query
    schema: {type: string, format: uuid}
  get:
    operationId: listOCIReferrers
    description: Verified OCI 1.1 Referrers API discovery. The subject, artifacts and their complete content closure stay with one persistent authority; Group reordering cannot inject another member's artifact. Missing subject/children, invalid subject/media/digest, source changes and unsupported upstream APIs fail explicitly. Referrers tag fallback and signer trust verification are not implemented.
    security:
    - ociBearerAuth: []
    responses:
      '200':
        description: Verified and optionally artifactType-filtered OCI image index
        headers:
          Link: {schema: {type: string}}
          OCI-Filters-Applied: {schema: {type: string}}
          OCI-Gateway-Discovery-Coverage: {schema: {type: string, enum: [complete]}}
        content:
          application/vnd.oci.image.index.v1+json:
            schema:
              type: object
              required: [schemaVersion, manifests]
              properties:
                schemaVersion: {type: integer, const: 2}
                mediaType: {type: string}
                manifests:
                  type: array
                  items:
                    type: object
                    required: [mediaType, digest, size]
                    properties:
                      mediaType: {type: string}
                      digest: {type: string}
                      size: {type: integer, minimum: 0}
                      artifactType: {type: string}
                      annotations: {type: object, additionalProperties: {type: string}}
      '400': {"$ref": "../components/responses.yaml#/OCIError"}
      '401': {"$ref": "../components/responses.yaml#/OCIUnauthorized"}
      '403': {"$ref": "../components/responses.yaml#/OCIError"}
      '404': {"$ref": "../components/responses.yaml#/OCIError"}
      '409': {"$ref": "../components/responses.yaml#/OCIError"}
      '429': {"$ref": "../components/responses.yaml#/OCIError"}
      '501': {"$ref": "../components/responses.yaml#/OCIError"}
      '502': {"$ref": "../components/responses.yaml#/OCIError"}
      '503': {"$ref": "../components/responses.yaml#/OCIError"}
  head:
    operationId: headOCIReferrers
    description: Referrers page metadata with the same subject authority and full validation rules as GET.
    security:
    - ociBearerAuth: []
    responses:
      '200':
        description: Validated discovery page headers without a response body
        headers:
          Link: {schema: {type: string}}
          OCI-Gateway-Discovery-Coverage: {schema: {type: string, enum: [complete]}}
          OCI-Filters-Applied: {schema: {type: string}}
      '400': {"$ref": "../components/responses.yaml#/OCIError"}
      '401': {"$ref": "../components/responses.yaml#/OCIUnauthorized"}
      '403': {"$ref": "../components/responses.yaml#/OCIError"}
      '404': {"$ref": "../components/responses.yaml#/OCIError"}
      '409': {"$ref": "../components/responses.yaml#/OCIError"}
      '429': {"$ref": "../components/responses.yaml#/OCIError"}
      '501': {"$ref": "../components/responses.yaml#/OCIError"}
      '502': {"$ref": "../components/responses.yaml#/OCIError"}
      '503': {"$ref": "../components/responses.yaml#/OCIError"}
