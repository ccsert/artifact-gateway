NuGetPreviewGovernance:
  type: object
  additionalProperties: false
  required: [repositoryId, packageId, version, digest, governanceVersion, listed, tombstoned, quarantined]
  properties:
    repositoryId: {type: string, format: uuid}
    packageId: {type: string}
    version: {type: string}
    digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    governanceVersion: {type: string, description: "Opaque compare-and-swap version independent of repository configuration"}
    listed: {type: boolean, description: "Unlisted packages remain in registration and flat-container version lists and permit exact-version downloads"}
    tombstoned: {type: boolean}
    quarantined: {type: boolean, description: "Native reads are hidden only while the separate quarantine read policy is enabled"}
    updatedAt: {type: string, format: date-time}
    updatedBy: {type: string}
    reason: {type: string}
NuGetPreviewGovernanceRequest:
  type: object
  additionalProperties: false
  required: [expectedDigest, expectedGovernanceVersion, action, reason]
  properties:
    expectedDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    expectedGovernanceVersion: {type: string, minLength: 1}
    action: {type: string, enum: [unlist, relist, delete, restore, quarantine, release]}
    reason: {type: string, minLength: 1, maxLength: 2048}
NuGetPreviewQuarantineReadPolicy:
  type: object
  additionalProperties: false
  required: [version, enabled]
  properties:
    version: {type: string}
    enabled: {type: boolean, default: false}
NuGetPreviewQuarantineReadPolicyRequest:
  type: object
  additionalProperties: false
  required: [expectedVersion, enabled]
  properties:
    expectedVersion: {type: string, minLength: 1}
    enabled: {type: boolean}
NuGetPreviewRepositoryCreate:
  type: object
  additionalProperties: false
  required:
    - name
  properties:
    name:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    anonymousRead:
      type: boolean
      default: false
    type:
      type: string
      enum: [hosted, proxy]
      default: hosted
    endpoint:
      type: string
      format: uri
      description: Explicit HTTPS V3 service-index URL for a Proxy. Resources are discovered from this index.
    allowedHosts:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        type: string
      description: Explicit additional HTTPS authorities (host and optional port). Permission to fetch does not permit credentials to cross origins.
    upstreamAuth:
      $ref: '#/NuGetPreviewUpstreamAuth'
    egressMode:
      type: string
      enum: [direct, environment]
      default: direct
NuGetPreviewRepository:
  type: object
  required:
    - id
    - name
    - format
    - preview
    - sourceUrl
    - type
    - version
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    format:
      type: string
      const: nuget
    preview:
      type: boolean
      const: true
    sourceUrl:
      type: string
      format: uri
    type:
      type: string
      enum: [hosted, proxy]
    version:
      type: string
    endpoint:
      type: string
      format: uri
    allowedHosts:
      type: array
      items:
        type: string
    upstreamAuth:
      $ref: '#/NuGetPreviewUpstreamAuthStatus'
    egressMode:
      type: string
      enum: [direct, environment]
NuGetPreviewUpstreamAuth:
  type: object
  additionalProperties: false
  required: [scheme]
  description: Write-only source credential, sealed separately from local client credentials. A changed source binding requires a fresh secret or explicit none.
  properties:
    scheme:
      type: string
      enum: [none, basic, bearer]
    username:
      type: string
      maxLength: 512
    secret:
      type: string
      maxLength: 16384
      writeOnly: true
NuGetPreviewUpstreamAuthStatus:
  type: object
  required: [scheme, credentialsConfigured]
  properties:
    scheme:
      type: string
      enum: [none, basic, bearer]
    username:
      type: string
    credentialsConfigured:
      type: boolean
NuGetPreviewRepositoryReplace:
  type: object
  additionalProperties: false
  required: [name, version]
  properties:
    name:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    anonymousRead:
      type: boolean
      default: false
    type:
      type: string
      enum: [hosted, proxy]
      default: hosted
    endpoint:
      type: string
      format: uri
      description: Explicit HTTPS V3 service-index URL for a Proxy. Resources are discovered from this index.
    allowedHosts:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        type: string
      description: Explicit additional HTTPS authorities (host and optional port). Permission to fetch does not permit credentials to cross origins.
    upstreamAuth:
      $ref: '#/NuGetPreviewUpstreamAuth'
    egressMode:
      type: string
      enum: [direct, environment]
      default: direct
    version:
      type: string
      minLength: 1
NuGetPreviewGroupInput:
  type: object
  additionalProperties: false
  required: [name, members]
  properties:
    name:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    anonymousRead:
      type: boolean
      default: false
    members:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        format: uuid
    version:
      type: string
      description: Required when replacing an existing Group. Compared atomically.
NuGetPreviewGroup:
  type: object
  required: [id, name, format, preview, version, members, sourceUrl]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    format:
      type: string
      const: nuget
    preview:
      type: boolean
      const: true
    version:
      type: string
    anonymousRead:
      type: boolean
    members:
      type: array
      items:
        type: string
        format: uuid
    sourceUrl:
      type: string
      format: uri
NuGetPreviewSource:
  type: object
  required: [groupId, packageId, version, repositoryId, repositoryVersion, digest, size]
  description: Durable authority for the canonical package version. A reorder never changes this owner; a missing or changed owner fails closed.
  properties:
    groupId:
      type: string
      format: uuid
    packageId:
      type: string
    version:
      type: string
    repositoryId:
      type: string
      format: uuid
    repositoryVersion:
      type: string
    digest:
      type: string
    size:
      type: integer
      format: int64
NuGetPublicationRequest:
  type: object
  additionalProperties: false
  required:
    - packageId
    - version
    - digest
    - size
  properties:
    packageId:
      type: string
      minLength: 1
      maxLength: 100
    version:
      type: string
      minLength: 1
      maxLength: 256
    digest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    size:
      type: integer
      format: int64
      minimum: 1
      maximum: 268435456
NuGetPublicationSession:
  type: object
  required:
    - id
    - repositoryId
    - packageId
    - version
    - digest
    - size
    - state
    - createdAt
    - expiresAt
  properties:
    id:
      type: string
      format: uuid
    repositoryId:
      type: string
      format: uuid
    packageId:
      type: string
    version:
      type: string
    digest:
      type: string
    size:
      type: integer
      format: int64
    state:
      type: string
      enum:
        - reserved
        - staged
        - committed
        - expired
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    committedAt:
      type: string
      format: date-time
NuGetPreviewPackage:
  type: object
  required:
    - repositoryId
    - packageId
    - version
    - digest
    - size
    - publishedAt
    - packageUrl
    - registrationUrl
  properties:
    repositoryId:
      type: string
      format: uuid
    packageId:
      type: string
    version:
      type: string
    digest:
      type: string
    size:
      type: integer
      format: int64
    publishedAt:
      type: string
      format: date-time
    packageUrl:
      type: string
      format: uri
    registrationUrl:
      type: string
      format: uri
    sourceVersion:
      type: string
      description: Source configuration namespace of a fully verified Proxy cache publication.
    upstreamPackageUrl:
      type: string
      format: uri
    upstreamRegistrationUrl:
      type: string
      format: uri

NuGetPreviewPackageList:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/NuGetPreviewPackage'
    nextCursor:
      type: string
NuGetPreviewCapacity:
  type: object
  required:
    - repositoryId
    - usedBytes
    - objectCount
    - quotaBytes
  properties:
    repositoryId:
      type: string
      format: uuid
    usedBytes:
      type: integer
      format: int64
      minimum: 0
    objectCount:
      type: integer
      format: int64
      minimum: 0
    quotaBytes:
      type: integer
      format: int64
      minimum: 0
NuGetPreviewQuota:
  type: object
  additionalProperties: false
  required:
    - quotaBytes
  properties:
    quotaBytes:
      type: integer
      format: int64
      minimum: 0
NuGetPreviewSourceRevalidation:
  type: object
  additionalProperties: false
  required: [groupVersion, repositoryVersion]
  properties:
    groupVersion:
      type: string
      minLength: 1
    repositoryVersion:
      type: string
      minLength: 1
      description: Previously bound source configuration version. Only the same member and complete immutable digest/size can be confirmed after a new source configuration.
