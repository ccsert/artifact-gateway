RubyGemsPreviewRepositoryInput:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    anonymousRead:
      type: boolean
      default: false
RubyGemsPreviewRepository:
  type: object
  additionalProperties: false
  required: [id, name, format, type, preview, version, anonymousRead, sourceUrl, pushHost, publicationUrl]
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    format: {type: string, enum: [rubygems]}
    type: {type: string, enum: [hosted]}
    preview: {type: boolean, enum: [true]}
    version: {type: string}
    anonymousRead: {type: boolean}
    sourceUrl: {type: string}
    pushHost:
      type: string
      description: Base URI for gem push --host, without a trailing slash. The official client appends /api/v1/gems.
    publicationUrl: {type: string}
RubyGemsPreviewCapacity:
  type: object
  additionalProperties: false
  required: [usedBytes, pendingBytes, objectCount, quotaBytes]
  properties:
    usedBytes: {type: integer, format: int64, minimum: 0}
    pendingBytes: {type: integer, format: int64, minimum: 0}
    objectCount: {type: integer, format: int64, minimum: 0}
    quotaBytes: {type: integer, format: int64, minimum: 0}
RubyGemsPreviewQuotaInput:
  type: object
  additionalProperties: false
  required: [quotaBytes]
  properties:
    quotaBytes:
      type: integer
      format: int64
      minimum: 0
      description: Zero means no configured quota. Pending unexpired uploads reserve capacity.
RubyGemsPreviewGovernance:
  type: object
  additionalProperties: false
  description: Retained immutable gem identity. Yank always hides discovery and downloads. Independent quarantine hides them only when the default-disabled repository read policy is enabled. Both preserve bytes, identity and capacity.
  required: [repositoryId, name, version, platform, digest, governanceVersion, yanked, quarantined]
  properties:
    repositoryId: {type: string, format: uuid}
    name: {type: string}
    version: {type: string}
    platform: {type: string}
    digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    governanceVersion: {type: string, pattern: '^[1-9][0-9]*$'}
    yanked: {type: boolean}
    quarantined: {type: boolean}
    updatedAt: {type: string, format: date-time}
    updatedBy: {type: string}
    reason: {type: string}
RubyGemsPreviewGovernanceChange:
  type: object
  additionalProperties: false
  required: [expectedDigest, expectedGovernanceVersion, action, reason]
  properties:
    expectedDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    expectedGovernanceVersion: {type: string, pattern: '^[1-9][0-9]*$'}
    action: {type: string, enum: [yank, restore, quarantine, release]}
    reason: {type: string, minLength: 1, maxLength: 2048}
RubyGemsPreviewQuarantineReadPolicy:
  type: object
  additionalProperties: false
  required: [version, enabled]
  properties:
    version: {type: string, pattern: '^[1-9][0-9]*$'}
    enabled: {type: boolean, default: false}
RubyGemsPreviewQuarantineReadPolicyChange:
  type: object
  additionalProperties: false
  required: [expectedVersion, enabled]
  properties:
    expectedVersion: {type: string, pattern: '^[1-9][0-9]*$'}
    enabled: {type: boolean}
RubyGemsPreviewIdentity:
  type: object
  additionalProperties: false
  description: Exact server-owned, visible and distribution-eligible gem identity. Versions preserve the original archive spelling; duplicate RubyGems-canonical version/platform identities are rejected.
  required: [name, version, platform, digest, size, sourceGovernanceVersion]
  properties:
    name: {type: string, minLength: 1, maxLength: 128}
    version: {type: string, minLength: 1, maxLength: 128}
    platform: {type: string, minLength: 1, maxLength: 128}
    digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    size: {type: integer, format: int64, minimum: 1, maximum: 67108864}
    sourceGovernanceVersion: {type: string, pattern: '^[1-9][0-9]*$'}
RubyGemsPreviewReplicationRequest:
  type: object
  additionalProperties: false
  required: [sourceRepositoryId, targetRepositoryId, items]
  properties:
    sourceRepositoryId: {type: string, format: uuid}
    targetRepositoryId: {type: string, format: uuid}
    items:
      type: array
      minItems: 1
      maxItems: 100
      items: {$ref: '#/RubyGemsPreviewIdentity'}
RubyGemsPreviewReplicationItem:
  type: object
  additionalProperties: false
  required: [index, name, version, platform, digest, size, sourceGovernanceVersion, state, attempts]
  properties:
    index: {type: integer, minimum: 0, maximum: 99}
    name: {type: string}
    version: {type: string}
    platform: {type: string}
    digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    size: {type: integer, format: int64, minimum: 1, maximum: 67108864}
    sourceGovernanceVersion: {type: string, pattern: '^[1-9][0-9]*$'}
    state: {type: string, enum: [pending, running, succeeded, failed]}
    attempts: {type: integer, minimum: 0}
    code: {type: string, enum: [access_denied, source_changed, target_conflict, identity_conflict, quota_exceeded, transfer_failed]}
    targetSessionId: {type: string, format: uuid}
    result: {type: string, enum: [published, already_present]}
    completedAt: {type: string, format: date-time}
RubyGemsPreviewReplicationJob:
  type: object
  additionalProperties: false
  required: [id, planDigest, sourceRepositoryId, targetRepositoryId, actor, version, state, items, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    planDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    sourceRepositoryId: {type: string, format: uuid}
    targetRepositoryId: {type: string, format: uuid}
    actor: {type: string}
    version: {type: string, pattern: '^[1-9][0-9]*$'}
    state: {type: string, enum: [queued, running, succeeded, failed]}
    items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/RubyGemsPreviewReplicationItem'}}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
RubyGemsPreviewReplicationRetry:
  type: object
  additionalProperties: false
  required: [expectedVersion, itemIndexes]
  properties:
    expectedVersion: {type: string, pattern: '^[1-9][0-9]*$'}
    itemIndexes:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items: {type: integer, minimum: 0, maximum: 99}
