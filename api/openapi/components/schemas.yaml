ArtifactPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/Artifact"
    nextPageToken:
      type: string
AuditRecord:
  type: object
  required:
  - outcome
  - occurredAt
  properties:
    groupName:
      type: string
    repository:
      type: string
    memberName:
      type: string
    outcome:
      type: string
    actor:
      type: string
    occurredAt:
      type: string
      format: date-time
    format:
      type: string
    resource:
      type: string
    representation:
      type: string
    memberType:
      type: string
    upstreamHost:
      type: string
    operation:
      type: string
    status:
      type: integer
    cacheDisposition:
      type: string
    bytes:
      type: integer
      format: int64
    authorizationSource:
      type: string
      description: Optional bounded authorization decision source. Current values include
        repository_grants, legacy_static, legacy_protocol, and administrator; consumers
        must accept future bounded values.
    authorizationReason:
      type: string
      description: Optional bounded authorization decision reason. Current values include
        scope_not_granted and grant_lookup_failed; consumers must accept future bounded
        values.
    evidence:
      type: object
      description: Optional immutable, operation-specific evidence. Keys and values are
        bounded strings; consumers must accept future keys.
      maxProperties: 32
      additionalProperties:
        type: string
        maxLength: 2048
    requestId:
      type: string
    traceId:
      type: string
AuditList:
  type: array
  items:
    "$ref": "#/AuditRecord"
AuditPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/AuditRecord"
    nextPageToken:
      type: string
