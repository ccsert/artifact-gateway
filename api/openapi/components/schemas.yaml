---
Format:
  type: string
  enum:
  - raw
  - oci
  - maven
  - conan
  - npm
  - pypi
  - go
RepositoryOperation:
  type: string
  enum:
  - read
  - publish
  - browse
  - delete
  - restore
  - retain
  - reclaim
  - promote
  - replicate
FormatProfile:
  type: object
  required:
  - format
  - repositoryTypes
  - groupSupported
  - anonymousRead
  - hostedOperations
  - proxyOperations
  properties:
    format:
      "$ref": "#/Format"
    repositoryTypes:
      type: array
      uniqueItems: true
      items:
        type: string
        enum:
        - hosted
        - proxy
    groupSupported:
      type: boolean
    anonymousRead:
      type: boolean
    hostedOperations:
      type: array
      uniqueItems: true
      items:
        "$ref": "#/RepositoryOperation"
    proxyOperations:
      type: array
      uniqueItems: true
      items:
        "$ref": "#/RepositoryOperation"
FormatProfileList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/FormatProfile"
RuntimeNode:
  type: object
  required:
  - instanceId
  - sessionId
  - roles
  - workerFormats
  - workerKinds
  - startedAt
  - lastSeenAt
  - status
  properties:
    instanceId:
      type: string
    sessionId:
      type: string
    roles:
      type: array
      items:
        type: string
    workerFormats:
      type: array
      items:
        "$ref": "#/Format"
    workerKinds:
      type: array
      items:
        type: string
    startedAt:
      type: string
      format: date-time
    lastSeenAt:
      type: string
      format: date-time
    stoppedAt:
      type: string
      format: date-time
    status:
      type: string
      enum:
      - online
      - stale
      - offline
RuntimeNodeHealthIssue:
  type: object
  required:
  - code
  - severity
  - message
  properties:
    code:
      type: string
    severity:
      type: string
      enum:
      - warning
      - error
    message:
      type: string
RuntimeNodeHealth:
  type: object
  required:
  - status
  - online
  - stale
  - offline
  - issues
  properties:
    status:
      type: string
      enum:
      - healthy
      - degraded
      - critical
    online:
      type: integer
      minimum: 0
    stale:
      type: integer
      minimum: 0
    offline:
      type: integer
      minimum: 0
    issues:
      type: array
      items:
        "$ref": "#/RuntimeNodeHealthIssue"
RuntimeNodeList:
  type: object
  required:
  - items
  - health
  properties:
    items:
      type: array
      items:
        "$ref": "#/RuntimeNode"
    health:
      "$ref": "#/RuntimeNodeHealth"
EgressProxy:
  type: object
  description: Per-Proxy-Repository egress network proxy configuration. Only
    meaningful when the repository type is proxy. `password` is accepted on
    write (plaintext over TLS) and stored AES-256-GCM encrypted; responses
    never return it and carry `credentialsConfigured` instead.
  required:
  - mode
  additionalProperties: false
  properties:
    mode:
      type: string
      enum:
      - direct
      - environment
      - custom
      description: direct bypasses any proxy (keeping private-address
        protection); environment follows process HTTP(S)_PROXY/NO_PROXY;
        custom uses the per-repository proxy below.
    protocol:
      type: string
      enum:
      - http
      - socks5
      description: Custom proxy protocol. http uses CONNECT; socks5 supports
        optional remote DNS.
    host:
      type: string
      description: Custom proxy hostname or IP, without scheme or credentials.
    port:
      type: integer
      minimum: 1
      maximum: 65535
    username:
      type: string
      description: Optional proxy authentication username.
    password:
      type: string
      writeOnly: true
      description: Optional proxy authentication password. Write-only; stored
        encrypted. Omit on update to keep stored credentials.
    clearCredentials:
      type: boolean
      default: false
      description: When true on update, removes any stored proxy credentials.
    remoteDns:
      type: boolean
      default: false
      description: socks5 only. When true the proxy resolves the upstream
        hostname (socks5h); when false the gateway resolves locally and keeps
        the private-address check.
    noProxy:
      type: array
      items:
        type: string
      description: Upstream host suffixes or CIDR ranges that bypass the
        custom proxy and connect directly. Matched against the upstream host,
        never the proxy host.
    credentialsConfigured:
      type: boolean
      readOnly: true
      description: True when encrypted proxy credentials are stored.
EgressProxyTestResult:
  type: object
  description: Ephemeral result of an egress proxy connection test. Nothing
    is persisted.
  required:
  - reachable
  - egressMode
  - checkedAt
  properties:
    reachable:
      type: boolean
    egressMode:
      type: string
      enum:
      - direct
      - environment
      - custom
    proxyHost:
      type: string
      description: Custom proxy host (no credentials) when mode is custom.
    upstreamStatus:
      type: integer
      description: HTTP status returned by the upstream probe, when reached.
    latencyMs:
      type: integer
    error:
      type: string
      description: Sanitized failure reason when reachable is false.
    checkedAt:
      type: string
      format: date-time
APIKey:
  type: object
  required:
  - id
  - name
  - roles
  - createdAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    roles:
      type: array
      items:
        type: string
        enum:
        - admin
        - writer
        - reader
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
      description: Time after which the key can no longer authenticate.
    lastUsedAt:
      type: string
      format: date-time
      description: Most recent successful authentication time.
    revokedAt:
      type: string
      format: date-time
APIKeyList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/APIKey"
CreateAPIKey:
  type: object
  required:
  - name
  - roles
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
    roles:
      type: array
      minItems: 1
      items:
        type: string
        enum:
        - admin
        - writer
        - reader
    expiresAt:
      type: string
      format: date-time
      description: Optional expiry. Defaults to 90 days and cannot exceed 365 days.
CreatedAPIKey:
  allOf:
  - "$ref": "#/APIKey"
  - type: object
    required:
    - token
    properties:
      token:
        type: string
User:
  type: object
  required:
  - id
  - name
  - role
  - state
  - createdAt
  - version
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    role:
      type: string
      enum:
      - admin
      - writer
      - reader
    state:
      type: string
      enum:
      - active
      - disabled
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    version:
      type: string
UserList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/User"
CreateUser:
  type: object
  required:
  - name
  - password
  - role
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
    password:
      type: string
      format: password
      minLength: 8
    role:
      type: string
      enum:
      - admin
      - writer
      - reader
UpdateUser:
  type: object
  additionalProperties: false
  properties:
    role:
      type: string
      enum:
      - admin
      - writer
      - reader
    state:
      type: string
      enum:
      - active
      - disabled
OCITagList:
  type: object
  required:
  - name
  - tags
  properties:
    name:
      type: string
    tags:
      type: array
      items:
        type: string
OCIError:
  type: object
  required:
  - errors
  properties:
    errors:
      type: array
      items:
        type: object
        required:
        - code
        - message
        properties:
          code:
            type: string
          message:
            type: string
Repository:
  type: object
  required:
  - id
  - name
  - format
  - anonymousRead
  - state
  - version
  properties:
    id:
      type: string
    name:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    format:
      "$ref": "#/Format"
    type:
      type: string
      enum:
      - hosted
      - proxy
    endpoint:
      type: string
    allowedHosts:
      type: array
      items:
        type: string
    anonymousRead:
      type: boolean
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    egressProxy:
      "$ref": "#/EgressProxy"
    state:
      type: string
      description: Deletion is asynchronous. Protocol access stops in deleting; the worker advances it to deleted. The metadata row remains as an audit anchor.
      enum:
      - active
      - deleting
      - deleted
    version:
      type: string
CreateRepository:
  type: object
  required:
  - name
  - format
  additionalProperties: false
  properties:
    name:
      type: string
    format:
      "$ref": "#/Format"
    type:
      type: string
      enum:
      - hosted
      - proxy
      default: hosted
    endpoint:
      type: string
      description: Upstream base URL. Required when type is proxy; must be empty
        for hosted repositories.
    allowedHosts:
      type: array
      items:
        type: string
      description: Hosts the proxy may egress to. Required for raw, conan,
        and npm proxies. npm tarball redirects are limited to this list.
    anonymousRead:
      type: boolean
      default: false
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    egressProxy:
      "$ref": "#/EgressProxy"
UpdateRepository:
  type: object
  description: Editable repository management policy and proxy configuration. Hosted repositories only accept anonymousRead updates; name, format, and type are immutable after creation.
  additionalProperties: false
  properties:
    endpoint:
      type: string
      description: Upstream base URL (https). Required for proxy repositories.
    allowedHosts:
      type: array
      items:
        type: string
      description: Hosts the proxy may egress to. Required for raw, conan,
        and npm proxies. npm tarball redirects are limited to this list.
    anonymousRead:
      type: boolean
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    egressProxy:
      "$ref": "#/EgressProxy"
Group:
  type: object
  required:
  - id
  - name
  - format
  - anonymousRead
  - members
  - version
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    format:
      "$ref": "#/Format"
    anonymousRead:
      type: boolean
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    members:
      "$ref": "#/MemberList"
    version:
      type: string
CreateGroup:
  type: object
  required:
  - name
  - format
  - members
  additionalProperties: false
  properties:
    name:
      type: string
    format:
      "$ref": "#/Format"
    anonymousRead:
      type: boolean
      default: false
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    members:
      "$ref": "#/MemberList"
Member:
  type: object
  required:
  - repositoryId
  - position
  properties:
    repositoryId:
      type: string
      format: uuid
    position:
      type: integer
      minimum: 0
MemberList:
  type: array
  items:
    "$ref": "#/Member"
Grant:
  type: object
  required:
  - principal
  - scopes
  properties:
    principal:
      type: string
    scopes:
      type: array
      items:
        type: string
        enum:
        - repositories:read
        - repositories:write
        - repositories:admin
    resourcePrefix:
      type: string
      description: Optional canonical resource prefix. Empty or omitted grants repository-wide access.
      maxLength: 255
GrantList:
  type: array
  items:
    "$ref": "#/Grant"
RepositoryGrantRecord:
  type: object
  required: [repositoryId, repositoryName, format, principal, scopes]
  properties:
    repositoryId: {type: string, format: uuid}
    repositoryName: {type: string}
    format: {"$ref": "#/Format"}
    principal: {type: string}
    scopes:
      type: array
      items:
        type: string
        enum: [repositories:read, repositories:write, repositories:admin]
    resourcePrefix:
      type: string
      maxLength: 255
RepositoryGrantRecordList:
  type: array
  items:
    "$ref": "#/RepositoryGrantRecord"
RetentionPolicy:
  type: object
  required:
  - version
  - keepDays
  - minimumVersions
  properties:
    version:
      type: string
    enabled:
      type: boolean
      default: false
      description: Whether scheduled and manual retention execution is enabled.
    keepDays:
      type: integer
      minimum: 1
      description: Days to retain artifacts or versions before cleanup eligibility.
    snapshotKeepDays:
      type: integer
      minimum: 1
      description: Days to retain Maven SNAPSHOT versions. Defaults to keepDays when omitted.
    minimumVersions:
      type: integer
      minimum: 1
      description: Minimum newest versions protected per Maven module, OCI image, or Conan reference. Raw paths do not use version-count rules.
    maximumVersions:
      type: integer
      minimum: 0
      default: 0
      description: Maximum versions retained per Maven module, OCI image, or Conan reference. Zero disables the count cap; Raw paths do not use it.
    coordinatePatterns:
      type: array
      maxItems: 20
      description: Optional RE2 regular expressions selecting coordinates eligible for cleanup.
      items: {type: string, minLength: 1, maxLength: 256}
    protectedPatterns:
      type: array
      maxItems: 20
      description: RE2 regular expressions protecting matching coordinates from cleanup.
      items: {type: string, minLength: 1, maxLength: 256}
RepositoryCapacity:
  type: object
  required: [repositoryId, format, usedBytes, objectCount, quotaBytes]
  properties:
    repositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    usedBytes: {type: integer, format: int64, minimum: 0}
    objectCount: {type: integer, format: int64, minimum: 0}
    quotaBytes: {type: integer, format: int64, minimum: 0, description: "Zero disables the quota."}
    primaryBytes: {type: integer, format: int64, minimum: 0, description: "Cached primary artifact bytes when the repository exposes cache projections."}
    sidecarBytes: {type: integer, format: int64, minimum: 0, description: "Cached metadata and checksum sidecar bytes."}
    negativeCount: {type: integer, format: int64, minimum: 0, description: "Active negative-cache entries."}
    expiredObjectCount: {type: integer, format: int64, minimum: 0, description: "Expired cache entries eligible for reclamation."}
    reclaimableBytes: {type: integer, format: int64, minimum: 0, description: "Expired cached bytes eligible for reclamation."}
RepositoryCapacityList:
  type: array
  items:
    "$ref": "#/RepositoryCapacity"
RepositoryCapacityQuota:
  type: object
  required: [quotaBytes]
  additionalProperties: false
  properties:
    quotaBytes: {type: integer, format: int64, minimum: 0}
EffectiveAccessDecision:
  type: object
  required: [allowed, source, reason]
  properties:
    allowed: {type: boolean}
    source: {type: string}
    reason: {type: string}
EffectiveAccessPermissions:
  type: object
  required: [read, write, admin]
  properties:
    read: {"$ref": "#/EffectiveAccessDecision"}
    write: {"$ref": "#/EffectiveAccessDecision"}
    admin: {"$ref": "#/EffectiveAccessDecision"}
AuthenticationKind:
  type: string
  enum: [static_admin, static_resolver, local_session, api_key, oidc]
OIDCRoleMappingMatch:
  type: object
  required: [externalRole, gatewayRole]
  additionalProperties: false
  properties:
    externalRole: {type: string, minLength: 1}
    gatewayRole:
      type: string
      enum: [admin, writer, reader]
OIDCIdentityDetails:
  type: object
  required: [adminSubject, roleMappings]
  additionalProperties: false
  properties:
    adminSubject: {type: boolean}
    roleMappings:
      type: array
      items: {"$ref": "#/OIDCRoleMappingMatch"}
CurrentIdentity:
  type: object
  required: [actor, kind, administrator]
  additionalProperties: false
  properties:
    actor: {type: string, minLength: 1}
    kind: {"$ref": "#/AuthenticationKind"}
    role:
      type: string
      enum: [admin, writer, reader]
    administrator: {type: boolean}
    oidc: {"$ref": "#/OIDCIdentityDetails"}
RepositoryEffectiveAccess:
  type: object
  required: [actor, identity, repository, resource, simulated, anonymousRead, permissions]
  properties:
    actor: {type: string}
    identity: {"$ref": "#/CurrentIdentity"}
    resource:
      type: string
      description: Concrete canonical resource evaluated for prefix-scoped grants; empty means repository-wide access.
    simulated:
      type: boolean
      description: True when an administrator supplied an actor instead of evaluating the authenticated caller.
    repository:
      type: object
      required: [id, name, format, type, state]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        format: {"$ref": "#/Format"}
        type:
          type: string
          enum: [hosted, proxy]
        state:
          type: string
          enum: [active, deleting, deleted]
    anonymousRead: {"$ref": "#/EffectiveAccessDecision"}
    permissions: {"$ref": "#/EffectiveAccessPermissions"}
RetentionDryRun:
  type: object
  required: [policyVersion, totalCandidates, summary, candidates]
  properties:
    policyVersion: {type: string}
    totalCandidates: {type: integer, minimum: 0}
    summary: {"$ref": "#/RetentionDryRunSummary"}
    candidates:
      type: array
      items:
        type: object
        required: [format, coordinate, digest, createdAt, reasons, ageDays, versionType]
        properties:
          format: {"$ref": "#/Format"}
          coordinate: {type: string}
          digest: {type: string}
          createdAt: {type: string, format: date-time}
          reasons:
            type: array
            minItems: 1
            items: {type: string, enum: [age, maximum_versions]}
          ageDays: {type: integer, minimum: 0}
          versionType: {type: string, enum: [release, snapshot, version, asset]}
    nextPageToken: {type: string}
RetentionDryRunSummary:
  type: object
  required: [reasonCounts, versionTypeCounts]
  additionalProperties: false
  properties:
    reasonCounts: {"$ref": "#/RetentionReasonCounts"}
    versionTypeCounts: {"$ref": "#/RetentionVersionTypeCounts"}
    oldestCandidateAt: {type: string, format: date-time}
RetentionReasonCounts:
  type: object
  required: [age, maximumVersions]
  additionalProperties: false
  properties:
    age: {type: integer, minimum: 0}
    maximumVersions: {type: integer, minimum: 0}
RetentionVersionTypeCounts:
  type: object
  required: [release, snapshot, version, asset]
  additionalProperties: false
  properties:
    release: {type: integer, minimum: 0}
    snapshot: {type: integer, minimum: 0}
    version: {type: integer, minimum: 0}
    asset: {type: integer, minimum: 0}
RestoreArtifact:
  type: object
  required: [coordinate]
  additionalProperties: false
  properties:
    coordinate:
      type: string
      minLength: 1
      maxLength: 1024
LifecycleJob:
  type: object
  required:
  - id
  - kind
  - state
  - createdAt
  - attempts
  - maxAttempts
  - progressCurrent
  - progressTotal
  properties:
    id:
      type: string
    kind:
      type: string
      enum:
      - retention
      - promotion
      - replication
      - reclaim
    state:
      type: string
      enum:
      - pending
      - running
      - retrying
      - completed
      - failed
      - cancelled
    createdAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
    nextAttemptAt:
      type: string
      format: date-time
    leaseExpiresAt:
      type: string
      format: date-time
    attempts:
      type: integer
      minimum: 0
    maxAttempts:
      type: integer
      minimum: 1
      maximum: 20
    progressCurrent:
      type: integer
      minimum: 0
    progressTotal:
      type: integer
      minimum: 0
    progressMessage:
      type: string
      maxLength: 255
    lastError:
      type: string
      maxLength: 1024
RepositoryLifecycleJob:
  type: object
  required: [repositoryId, repositoryName, job]
  properties:
    repositoryId: {type: string, format: uuid}
    repositoryName: {type: string}
    job: {"$ref": "#/LifecycleJob"}
RepositoryLifecycleJobList:
  type: array
  items:
    "$ref": "#/RepositoryLifecycleJob"
CreateScheduledTask:
  type: object
  required: [name, kind, intervalMinutes, enabled]
  additionalProperties: false
  properties:
    name: {type: string, minLength: 1, maxLength: 100}
    description: {type: string, maxLength: 500, default: ""}
    kind:
      type: string
      enum: [repository-retention, audit-retention]
    repositoryId:
      type: string
      format: uuid
      description: Required for repository-retention and omitted for audit-retention.
    intervalMinutes: {type: integer, minimum: 15, maximum: 525600}
    enabled: {type: boolean}
    nextRunAt:
      type: string
      format: date-time
      description: Defaults to one interval after creation.
UpdateScheduledTask:
  allOf:
  - "$ref": "#/CreateScheduledTask"
ScheduledTask:
  type: object
  required: [id, name, description, kind, intervalMinutes, enabled, nextRunAt, version, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    description: {type: string}
    kind:
      type: string
      enum: [repository-retention, audit-retention]
    repositoryId: {type: string, format: uuid}
    intervalMinutes: {type: integer, minimum: 15, maximum: 525600}
    enabled: {type: boolean}
    nextRunAt: {type: string, format: date-time}
    lastRunAt: {type: string, format: date-time}
    lastRunId: {type: string, format: uuid}
    lastRunState:
      type: string
      enum: [submitted, failed]
    lastError: {type: string, maxLength: 1024}
    version: {type: string}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
ScheduledTaskRun:
  type: object
  required: [id, taskId, trigger, state, scheduledAt, createdAt]
  properties:
    id: {type: string, format: uuid}
    taskId: {type: string, format: uuid}
    trigger:
      type: string
      enum: [scheduled, manual]
    state:
      type: string
      enum: [submitted, failed]
    scheduledAt: {type: string, format: date-time}
    createdAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    targetKind:
      type: string
      enum: [lifecycle, audit-cleanup]
    targetId: {type: string}
    lastError: {type: string, maxLength: 1024}
AuditRetentionPolicy:
  type: object
  required: [version, enabled, keepDays]
  additionalProperties: false
  properties:
    version: {type: string}
    enabled: {type: boolean}
    keepDays: {type: integer, minimum: 0, maximum: 36500}
AnonymousAccessPolicy:
  type: object
  required: [version, enabled]
  additionalProperties: false
  properties:
    version: {type: string}
    enabled:
      type: boolean
      description: Permits unauthenticated protocol reads only when the Repository or Group policy also allows them.
OIDCSettings:
  type: object
  required: [version, source, enabled, issuer, audience, clientId, clientSecretConfigured, redirectUrl, scopes, adminSubjects, readerRoles, writerRoles, adminRoles]
  additionalProperties: false
  properties:
    version: {type: string}
    source: {type: string, enum: [environment, database]}
    enabled: {type: boolean}
    issuer: {type: string, format: uri}
    audience: {type: string}
    jwksUrl: {type: string, format: uri}
    clientId: {type: string}
    clientSecretConfigured: {type: boolean}
    redirectUrl: {type: string, format: uri}
    scopes:
      type: array
      items: {type: string}
    adminSubjects:
      type: array
      items: {type: string}
    readerRoles:
      type: array
      items: {type: string}
    writerRoles:
      type: array
      items: {type: string}
    adminRoles:
      type: array
      items: {type: string}
    updatedAt: {type: string, format: date-time}
OIDCSettingsUpdate:
  type: object
  required: [enabled, issuer, audience, clientId, redirectUrl, scopes, adminSubjects, readerRoles, writerRoles, adminRoles]
  additionalProperties: false
  properties:
    enabled: {type: boolean}
    issuer: {type: string, format: uri}
    audience: {type: string}
    jwksUrl: {type: string, format: uri}
    clientId: {type: string}
    clientSecret:
      type: string
      writeOnly: true
    clearClientSecret: {type: boolean, default: false}
    redirectUrl: {type: string, format: uri}
    scopes:
      type: array
      items: {type: string}
    adminSubjects:
      type: array
      items: {type: string}
    readerRoles:
      type: array
      items: {type: string}
    writerRoles:
      type: array
      items: {type: string}
    adminRoles:
      type: array
      items: {type: string}
OIDCConnectionTest:
  type: object
  required: [reachable, issuer, latencyMs, checkedAt]
