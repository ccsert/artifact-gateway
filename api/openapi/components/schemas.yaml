    version:
      type: string
    architecture:
      type: string
    canonicalIdentity:
      type: string
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    size:
      type: integer
      format: int64
    objectName:
      type: string
    publisher:
      type: string
    createdAt:
