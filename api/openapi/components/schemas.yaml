---
Format:
  type: string
  enum:
  - raw
  - oci
  - maven
  - conan
APIKey:
  type: object
  required:
  - id
  - name
  - roles
  - createdAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    roles:
      type: array
      items:
        type: string
        enum:
        - admin
        - writer
        - reader
    createdAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
APIKeyList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/APIKey"
CreateAPIKey:
  type: object
  required:
  - name
  - roles
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
    roles:
      type: array
      minItems: 1
      items:
        type: string
        enum:
        - admin
        - writer
        - reader
CreatedAPIKey:
  allOf:
  - "$ref": "#/APIKey"
  - type: object
    required:
    - token
    properties:
      token:
        type: string
User:
  type: object
  required:
  - id
  - name
  - role
  - state
  - createdAt
  - version
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    role:
      type: string
      enum:
      - admin
      - writer
      - reader
    state:
      type: string
      enum:
      - active
      - disabled
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    version:
      type: string
UserList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/User"
CreateUser:
  type: object
  required:
  - name
  - password
  - role
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
    password:
      type: string
      format: password
      minLength: 8
    role:
      type: string
      enum:
      - admin
      - writer
      - reader
UpdateUser:
  type: object
  additionalProperties: false
  properties:
    role:
      type: string
      enum:
      - admin
      - writer
      - reader
    state:
      type: string
      enum:
      - active
      - disabled
OCITagList:
  type: object
  required:
  - name
  - tags
  properties:
    name:
      type: string
    tags:
      type: array
      items:
        type: string
OCIError:
  type: object
  required:
  - errors
  properties:
    errors:
      type: array
      items:
        type: object
        required:
        - code
        - message
        properties:
          code:
            type: string
          message:
            type: string
Repository:
  type: object
  required:
  - id
  - name
  - format
  - anonymousRead
  - state
  - version
  properties:
    id:
      type: string
    name:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    format:
      "$ref": "#/Format"
    type:
      type: string
      enum:
      - hosted
      - proxy
    endpoint:
      type: string
    allowedHosts:
      type: array
      items:
        type: string
    anonymousRead:
      type: boolean
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    state:
      type: string
      enum:
      - active
      - deleting
      - deleted
    version:
      type: string
CreateRepository:
  type: object
  required:
  - name
  - format
  additionalProperties: false
  properties:
    name:
      type: string
    format:
      "$ref": "#/Format"
    type:
      type: string
      enum:
      - hosted
      - proxy
      default: hosted
    endpoint:
      type: string
      description: Upstream base URL. Required when type is proxy; must be empty
        for hosted repositories.
    allowedHosts:
      type: array
      items:
        type: string
      description: Hosts the proxy may egress to. Required for raw and conan
        proxies.
    anonymousRead:
      type: boolean
      default: false
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
UpdateRepository:
  type: object
  description: Editable repository management policy and proxy configuration. Hosted repositories only accept anonymousRead updates; name, format, and type are immutable after creation.
  additionalProperties: false
  properties:
    endpoint:
      type: string
      description: Upstream base URL (https). Required for proxy repositories.
    allowedHosts:
      type: array
      items:
        type: string
      description: Hosts the proxy may egress to. Required for raw and conan
        proxies.
    anonymousRead:
      type: boolean
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
Group:
  type: object
  required:
  - id
  - name
  - format
  - anonymousRead
  - members
  - version
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    format:
      "$ref": "#/Format"
    anonymousRead:
      type: boolean
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    members:
      "$ref": "#/MemberList"
    version:
      type: string
CreateGroup:
  type: object
  required:
  - name
  - format
  - members
  additionalProperties: false
  properties:
    name:
      type: string
    format:
      "$ref": "#/Format"
    anonymousRead:
      type: boolean
      default: false
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    members:
      "$ref": "#/MemberList"
Member:
  type: object
  required:
  - repositoryId
  - position
  properties:
    repositoryId:
      type: string
      format: uuid
    position:
      type: integer
      minimum: 0
MemberList:
  type: array
  items:
    "$ref": "#/Member"
Grant:
  type: object
  required:
  - principal
  - scopes
  properties:
    principal:
      type: string
    scopes:
      type: array
      items:
        type: string
        enum:
        - repositories:read
        - repositories:write
        - repositories:admin
    resourcePrefix:
      type: string
      description: Optional canonical resource prefix. Empty or omitted grants repository-wide access.
      maxLength: 255
GrantList:
  type: array
  items:
    "$ref": "#/Grant"
RetentionPolicy:
  type: object
  required:
  - version
  - keepDays
  - minimumVersions
  properties:
    version:
      type: string
    keepDays:
      type: integer
      minimum: 1
    minimumVersions:
      type: integer
      minimum: 1
RepositoryCapacity:
  type: object
  required: [repositoryId, format, usedBytes, objectCount, quotaBytes]
  properties:
    repositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    usedBytes: {type: integer, format: int64, minimum: 0}
    objectCount: {type: integer, format: int64, minimum: 0}
    quotaBytes: {type: integer, format: int64, minimum: 0, description: "Zero disables the quota."}
RepositoryCapacityQuota:
  type: object
  required: [quotaBytes]
  additionalProperties: false
  properties:
    quotaBytes: {type: integer, format: int64, minimum: 0}
EffectiveAccessDecision:
  type: object
  required: [allowed, source, reason]
  properties:
    allowed: {type: boolean}
    source: {type: string}
    reason: {type: string}
EffectiveAccessPermissions:
  type: object
  required: [read, write, admin]
  properties:
    read: {"$ref": "#/EffectiveAccessDecision"}
    write: {"$ref": "#/EffectiveAccessDecision"}
    admin: {"$ref": "#/EffectiveAccessDecision"}
RepositoryEffectiveAccess:
  type: object
  required: [actor, repository, anonymousRead, permissions]
  properties:
    actor: {type: string}
    repository:
      type: object
      required: [id, name, format, type, state]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        format: {"$ref": "#/Format"}
        type:
          type: string
          enum: [hosted, proxy]
        state:
          type: string
          enum: [active, deleting, deleted]
    anonymousRead: {"$ref": "#/EffectiveAccessDecision"}
    permissions: {"$ref": "#/EffectiveAccessPermissions"}
RetentionDryRun:
  type: object
  required: [policyVersion, candidates]
  properties:
    policyVersion: {type: string}
    candidates:
      type: array
      items:
        type: object
        required: [coordinate, digest, createdAt]
        properties:
          coordinate: {type: string}
          digest: {type: string}
          createdAt: {type: string, format: date-time}
RestoreArtifact:
  type: object
  required: [coordinate]
  additionalProperties: false
  properties:
    coordinate:
      type: string
      minLength: 1
      maxLength: 1024
LifecycleJob:
  type: object
  required:
  - id
  - kind
  - state
  - createdAt
  properties:
    id:
      type: string
    kind:
      type: string
      enum:
      - retention
      - promotion
      - replication
      - reclaim
    state:
      type: string
      enum:
      - pending
      - running
      - completed
      - failed
    createdAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
    lastError:
      type: string
      maxLength: 1024
AuditRetentionPolicy:
  type: object
  required: [version, enabled, keepDays]
  additionalProperties: false
  properties:
    version: {type: string}
    enabled: {type: boolean}
    keepDays: {type: integer, minimum: 0, maximum: 36500}
AnonymousAccessPolicy:
  type: object
  required: [version, enabled]
  additionalProperties: false
  properties:
    version: {type: string}
    enabled:
      type: boolean
      description: Permits unauthenticated protocol reads only when the Repository or Group policy also allows them.
AuditCleanupJob:
  type: object
  required: [id, policyVersion, cutoffAt, batchSize, deleted, state, createdAt]
  properties:
    id: {type: string, format: uuid}
    policyVersion: {type: string}
    cutoffAt: {type: string, format: date-time}
    batchSize: {type: integer, minimum: 1, maximum: 1000}
    deleted: {type: integer, minimum: 0}
    state: {type: string, enum: [pending, running, completed, failed]}
    createdAt: {type: string, format: date-time}
    startedAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    lastError: {type: string, maxLength: 1024}
PromotionRequest:
  type: object
  required: [targetRepositoryId, coordinate, digest]
  additionalProperties: false
  properties:
    targetRepositoryId: {type: string, format: uuid}
    coordinate: {type: string}
    digest: {type: string}
ReplicationRequest:
  type: object
  required: [targetRepositoryId, coordinate, digest]
  additionalProperties: false
  properties:
    targetRepositoryId: {type: string, format: uuid}
    coordinate: {type: string, minLength: 1, maxLength: 1024}
    digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
ReplicationPlan:
  type: object
  required: [id, sourceRepositoryId, targetRepositoryId, format, state, createdAt]
  properties:
    id: {type: string, format: uuid}
    sourceRepositoryId: {type: string, format: uuid}
    targetRepositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    state: {type: string, enum: [pending, running, completed, failed, cancelled]}
    createdAt: {type: string, format: date-time}
    startedAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    lastError: {type: string, maxLength: 1024}
ReplicationPlanDetail:
  allOf:
  - "$ref": "#/ReplicationPlan"
  - type: object
    required: [checkpoints]
    properties:
      checkpoints:
        type: array
        items: {"$ref": "#/ReplicationCheckpointProgress"}
ReplicationCheckpointProgress:
  type: object
  required: [objectKey, digest, size, byteOffset, state, attempts]
  properties:
    objectKey: {type: string}
    digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
    size: {type: integer, format: int64, minimum: 0}
    byteOffset: {type: integer, format: int64, minimum: 0}
    state: {type: string, enum: [pending, copying, verified, failed]}
    attempts: {type: integer, minimum: 0}
    lastError: {type: string, maxLength: 1024}
    verifiedAt: {type: string, format: date-time}
ArtifactTombstone:
  type: object
  required: [coordinate, digest, tombstonedAt]
  properties:
    coordinate: {type: string}
    digest: {type: string}
    tombstonedAt: {type: string, format: date-time}
ArtifactTombstonePage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {"$ref": "#/ArtifactTombstone"}
    nextPageToken: {type: string}
RepositoryCapabilities:
  type: object
  required:
  - format
  - type
  - operations
  properties:
    format:
      "$ref": "#/Format"
    type:
      type: string
      enum:
      - hosted
      - proxy
    operations:
      type: array
      uniqueItems: true
      items:
        type: string
        enum:
        - read
        - publish
        - browse
        - delete
        - restore
        - retain
        - reclaim
GroupCapacity:
  type: object
  required: [groupId, format, members]
  properties:
    groupId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    members:
      type: array
      items: {"$ref": "#/GroupCapacityMember"}
GroupCapacityMember:
  type: object
  required: [position, repositoryId, format, type, usedBytes, objectCount]
  properties:
    position: {type: integer, minimum: 0}
    repositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    type: {type: string, enum: [hosted, proxy]}
    usedBytes: {type: integer, format: int64, minimum: 0}
    objectCount: {type: integer, format: int64, minimum: 0}
    quotaBytes: {type: integer, format: int64, minimum: 0}
CreatePublishSession:
  oneOf:
  - "$ref": "#/CreateMavenPublishSession"
  description: Maven-only management publish session. Raw Hosted writes use PUT /raw/{repository}/{path};
    OCI Hosted writes use Registry V2 upload and manifest routes.
CreateMavenPublishSession:
  type: object
  required:
  - format
  - coordinate
  - pomObject
  - objects
  additionalProperties: false
  properties:
    format:
      type: string
      const: maven
    coordinate:
      type: string
      pattern: "^[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+(?::[A-Za-z0-9_.-]+(?::[A-Za-z0-9_.-]+)?)?$"
    pomObject:
      type: string
      pattern: "^[^/]+$"
    objects:
      type: array
      minItems: 1
      items:
        "$ref": "#/DeclaredObject"
CommitMavenCoordinate:
  type: object
  description: Expected names detect incomplete upload only. Digest, size, checksum,
    metadata, object keys, and visibility are derived and controlled by the Gateway.
  required:
  - expectedAssetNames
  additionalProperties: false
  properties:
    expectedAssetNames:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        pattern: "^[^/]+$"
DeclaredObject:
  type: object
  required:
  - name
  - digest
  - size
  properties:
    name:
      type: string
      pattern: "^[^/]+$"
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    size:
      type: integer
      minimum: 0
PublishSession:
  type: object
  required:
  - id
  - repositoryId
  - coordinate
  - state
  - expiresAt
  - objects
  properties:
    id:
      type: string
      format: uuid
    repositoryId:
      type: string
      format: uuid
    coordinate:
      type: string
    state:
      type: string
      enum:
      - open
      - committed
      - aborted
      - expired
    expiresAt:
      type: string
      format: date-time
    objects:
      type: array
      items:
        "$ref": "#/DeclaredObject"
Artifact:
  type: object
  required:
  - id
  - coordinate
  - digest
  - createdAt
  - state
  properties:
    id:
      type: string
      format: uuid
    coordinate:
      type: string
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    createdAt:
      type: string
      format: date-time
    state:
      type: string
      enum:
      - visible
      - deleted
ArtifactSummary:
  type: object
  required:
  - coordinate
  properties:
    coordinate:
      type: string
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    size:
      type: integer
      format: int64
      minimum: 0
    contentType:
      type: string
    createdAt:
      type: string
      format: date-time
    buildNumber:
      type: integer
      format: int32
      minimum: 0
      description: Snapshot build number; zero for release coordinates.
    publisher:
      type: string
      description: Publisher actor when the format records it.
ArtifactSummaryPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/ArtifactSummary"
    nextPageToken:
      type: string
OCIImage:
  type: object
  required:
  - name
  properties:
    name:
      type: string
      minLength: 1
OCIImagePage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/OCIImage"
    nextPageToken:
      type: string
MavenCoordinate:
  type: object
  required:
  - coordinate
  - digest
  - createdAt
  properties:
    coordinate:
      type: string
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    createdAt:
      type: string
      format: date-time
    publisher:
      type: string
      description: Publisher actor of the most recent committed publish session
        for this coordinate. Empty when no publish session was recorded (for
        example replicated or pre-session artifacts).
    buildNumber:
      type: integer
      description: Snapshot build number. Zero for release coordinates; one or
        greater for each published build of a SNAPSHOT coordinate.
MavenCoordinatePage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/MavenCoordinate"
    nextPageToken:
      type: string
ConanReference:
  type: object
  required:
  - reference
  properties:
    reference:
      type: string
      minLength: 1
    publisher:
      type: string
      description: Publisher actor of the most recent committed publish session
        for this reference. Empty when no publish session was recorded (for
        example replicated or pre-session artifacts).
ConanReferencePage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/ConanReference"
    nextPageToken:
      type: string
ConanRecipeRevision:
  type: object
  required: [reference, revision, digest, state, createdAt]
  properties:
    reference: {type: string}
    revision: {type: string}
    digest: {type: string}
    state: {type: string, enum: [visible, deleted]}
    createdAt: {type: string, format: date-time}
ConanRecipeRevisionList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {"$ref": "#/ConanRecipeRevision"}
    nextPageToken:
      type: string
ConanPackageRevision:
  type: object
  required: [reference, recipeRevision, packageId, revision, digest, state, createdAt]
  properties:
    reference: {type: string}
    recipeRevision: {type: string}
    packageId: {type: string}
    revision: {type: string}
    digest: {type: string}
    state: {type: string, enum: [visible, deleted]}
    createdAt: {type: string, format: date-time}
ConanPackageRevisionList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {"$ref": "#/ConanPackageRevision"}
ConanPackageIdList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {type: string}
ProxyCacheAsset:
  type: object
  required: [path, name, sidecar]
  properties:
    path: {type: string}
    name: {type: string}
    digest: {type: string}
    size: {type: integer, format: int64, minimum: 0}
    contentType: {type: string}
    member: {type: string}
    sidecar: {type: boolean}
ProxyCacheBrowseItem:
  type: object
  required: [key, coordinate]
  properties:
    key: {type: string}
    coordinate: {type: string}
    groupId: {type: string}
    artifactId: {type: string}
    version: {type: string}
    path: {type: string}
    digest: {type: string}
    size: {type: integer, format: int64, minimum: 0}
    contentType: {type: string}
    member: {type: string}
    assetCount: {type: integer, minimum: 0}
    primaryAssetCount: {type: integer, minimum: 0}
    sidecarCount: {type: integer, minimum: 0}
    extensions:
      type: array
      items: {type: string}
    assets:
      type: array
      items: {"$ref": "#/ProxyCacheAsset"}
ProxyCacheBrowsePage:
  type: object
  required: [items, totalEstimate, groupBy]
  properties:
    items:
      type: array
      items: {"$ref": "#/ProxyCacheBrowseItem"}
    nextPageToken: {type: string}
    totalEstimate: {type: integer, minimum: 0}
    groupBy: {type: string, enum: [version, component, asset]}
ProxyCacheInvalidateRequest:
  type: object
  additionalProperties: false
  properties:
    path: {type: string}
    prefix: {type: boolean, default: false}
    scope: {type: string, enum: [path, version, component, repository], default: path}
ProxyCacheNegativeClearRequest:
  type: object
  additionalProperties: false
  properties:
    path: {type: string, minLength: 1}
    prefix: {type: boolean, default: false}
ProxyCacheInvalidateResult:
  type: object
  required: [invalidated]
  properties:
    invalidated: {type: integer, minimum: 0}
ProxyCacheNegativeClearResult:
  type: object
  required: [cleared]
  properties:
    cleared: {type: integer, minimum: 0}
MavenCacheRefreshRequest:
  type: object
  additionalProperties: false
  properties:
    path: {type: string}
    gav: {type: string}
MavenCacheRefreshResult:
  type: object
  required: [repositoryId, repository, path, status, refreshed]
  properties:
    repositoryId: {type: string}
    repository: {type: string}
    path: {type: string}
    status: {type: integer}
    refreshed: {type: boolean}
    cacheKey: {type: string}
    contentType: {type: string}
    size: {type: integer, format: int64, minimum: 0}
    etag: {type: string}
    lastModified: {type: string}
MavenProxyHealth:
  type: object
  required: [repositoryId, repository, endpoint, reachable, proxyAllowed, circuitOpen, cacheEnabled, checkedAt]
  properties:
    repositoryId: {type: string}
    repository: {type: string}
    endpoint: {type: string}
    reachable: {type: boolean}
    status: {type: integer}
    error: {type: string}
    proxyAllowed: {type: boolean}
    circuitOpen: {type: boolean}
    cacheEnabled: {type: boolean}
    checkedAt: {type: string, format: date-time}
RawDirectoryEntry:
  type: object
  required:
  - path
  - digest
  - size
  - contentType
  properties:
    path:
      type: string
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    size:
      type: integer
      minimum: 0
    contentType:
      type: string
RawDirectoryPage:
  type: object
  required:
  - path
  - items
  properties:
    path:
      type: string
    items:
      type: array
      items:
        "$ref": "#/RawDirectoryEntry"
Deletion:
  type: object
  required:
  - id
  - state
  properties:
    id:
      type: string
      format: uuid
    state:
      type: string
      const: pending
Problem:
  type: object
  required:
  - type
  - title
  - status
  - code
  - message
  - requestId
  properties:
    type:
      type: string
      format: uri-reference
    title:
      type: string
    status:
      type: integer
    code:
      type: string
      enum:
      - invalid_request
      - invalid_page_token
      - access_denied
      - not_found
      - version_conflict
      - idempotency_conflict
      - coordinate_exists
      - session_closed
      - digest_mismatch
      - retention_protected
      - internal_error
    message:
      type: string
    requestId:
      type: string
