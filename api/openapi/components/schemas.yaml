    authorizationEndpoint: {type: string, format: uri}
    tokenEndpoint: {type: string, format: uri}
    jwksUrl: {type: string, format: uri}
    latencyMs: {type: integer, minimum: 0}
    checkedAt: {type: string, format: date-time}
AuditCleanupJob:
  type: object
  required: [id, policyVersion, cutoffAt, batchSize, deleted, state, createdAt]
  properties:
    id: {type: string, format: uuid}
    policyVersion: {type: string}
    cutoffAt: {type: string, format: date-time}
    batchSize: {type: integer, minimum: 1, maximum: 1000}
    deleted: {type: integer, minimum: 0}
    state: {type: string, enum: [pending, running, completed, failed]}
    createdAt: {type: string, format: date-time}
    startedAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    lastError: {type: string, maxLength: 1024}
PromotionRequest:
  type: object
  required: [targetRepositoryId, coordinate, digest]
  additionalProperties: false
  properties:
    targetRepositoryId: {type: string, format: uuid}
    coordinate: {type: string}
    digest: {type: string}
ReplicationRequest:
  type: object
  required: [targetRepositoryId, coordinate, digest]
  additionalProperties: false
  properties:
    targetRepositoryId: {type: string, format: uuid}
    coordinate: {type: string, minLength: 1, maxLength: 1024}
    digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
ReplicationPlan:
  type: object
  required: [id, sourceRepositoryId, targetRepositoryId, format, state, createdAt]
  properties:
    id: {type: string, format: uuid}
    sourceRepositoryId: {type: string, format: uuid}
    targetRepositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    state: {type: string, enum: [pending, running, completed, failed, cancelled]}
    createdAt: {type: string, format: date-time}
    startedAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    lastError: {type: string, maxLength: 1024}
ReplicationPlanDetail:
  allOf:
  - "$ref": "#/ReplicationPlan"
  - type: object
    required: [checkpoints]
    properties:
      checkpoints:
        type: array
        items: {"$ref": "#/ReplicationCheckpointProgress"}
ReplicationCheckpointProgress:
  type: object
  required: [objectKey, digest, size, byteOffset, state, attempts]
  properties:
    objectKey: {type: string}
    digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
    size: {type: integer, format: int64, minimum: 0}
    byteOffset: {type: integer, format: int64, minimum: 0}
    state: {type: string, enum: [pending, copying, verified, failed]}
    attempts: {type: integer, minimum: 0}
    lastError: {type: string, maxLength: 1024}
    verifiedAt: {type: string, format: date-time}
ArtifactTombstone:
  type: object
  required: [coordinate, digest, tombstonedAt]
  properties:
    coordinate: {type: string}
    digest: {type: string}
    tombstonedAt: {type: string, format: date-time}
ArtifactTombstonePage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {"$ref": "#/ArtifactTombstone"}
    nextPageToken: {type: string}
RepositoryCapabilities:
  type: object
  required:
  - format
  - type
  - operations
  properties:
    format:
      "$ref": "#/Format"
    type:
      type: string
      enum:
      - hosted
      - proxy
    operations:
      type: array
      uniqueItems: true
      items:
        "$ref": "#/RepositoryOperation"
GroupCapacity:
  type: object
  required: [groupId, format, members]
  properties:
    groupId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    members:
      type: array
      items: {"$ref": "#/GroupCapacityMember"}
GroupCapacityMember:
  type: object
  required: [position, repositoryId, format, type, usedBytes, objectCount]
  properties:
    position: {type: integer, minimum: 0}
    repositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    type: {type: string, enum: [hosted, proxy]}
    usedBytes: {type: integer, format: int64, minimum: 0}
    objectCount: {type: integer, format: int64, minimum: 0}
    quotaBytes: {type: integer, format: int64, minimum: 0}
CreatePublishSession:
  oneOf:
  - "$ref": "#/CreateMavenPublishSession"
  description: Maven-only management publish session. Raw Hosted writes use PUT /raw/{repository}/{path};
    OCI Hosted writes use Registry V2 upload and manifest routes.
CreateMavenPublishSession:
  type: object
  required:
  - format
  - coordinate
  - pomObject
  - objects
  additionalProperties: false
  properties:
    format:
      type: string
      const: maven
    coordinate:
      type: string
      pattern: "^[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+(?::[A-Za-z0-9_.-]+(?::[A-Za-z0-9_.-]+)?)?$"
    pomObject:
      type: string
      pattern: "^[^/]+$"
    objects:
      type: array
      minItems: 1
      items:
        "$ref": "#/DeclaredObject"
CommitMavenCoordinate:
  type: object
  description: Expected names detect incomplete upload only. Digest, size, checksum,
    metadata, object keys, and visibility are derived and controlled by the Gateway.
  required:
  - expectedAssetNames
  additionalProperties: false
  properties:
    expectedAssetNames:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        pattern: "^[^/]+$"
DeclaredObject:
  type: object
  required:
  - name
  - digest
  - size
  properties:
    name:
      type: string
      pattern: "^[^/]+$"
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    size:
      type: integer
      minimum: 0
PublishSession:
  type: object
  required:
  - id
  - repositoryId
  - coordinate
  - state
  - expiresAt
  - objects
  properties:
    id:
      type: string
      format: uuid
    repositoryId:
      type: string
      format: uuid
    coordinate:
      type: string
    state:
      type: string
      enum:
      - open
      - committed
      - aborted
      - expired
    expiresAt:
      type: string
      format: date-time
    objects:
      type: array
      items:
        "$ref": "#/DeclaredObject"
Artifact:
  type: object
  required:
  - id
  - coordinate
  - digest
  - createdAt
  - state
  properties:
    id:
      type: string
      format: uuid
    coordinate:
      type: string
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    createdAt:
      type: string
      format: date-time
    state:
      type: string
      enum:
      - visible
      - deleted
ArtifactSummary:
  type: object
  required:
  - coordinate
  properties:
    coordinate:
      type: string
    version:
      type: string
      description: Exact package version when the format exposes one independently from the coordinate.
    versionCount:
      type: integer
      format: int32
      minimum: 0
      description: Number of versions represented by a package-level browse result.
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    size:
      type: integer
      format: int64
      minimum: 0
    contentType:
      type: string
    createdAt:
      type: string
      format: date-time
    buildNumber:
      type: integer
      format: int32
      minimum: 0
      description: Snapshot build number; zero for release coordinates.
    publisher:
      type: string
      description: Publisher actor when the format records it.
ArtifactSummaryPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/ArtifactSummary"
    nextPageToken:
      type: string
GlobalArtifactSearchHit:
  allOf:
  - "$ref": "#/ArtifactSummary"
  - type: object
    required:
    - repositoryId
    - repositoryName
    - format
    - matchKind
    properties:
      repositoryId:
        type: string
        format: uuid
      repositoryName:
        type: string
      format:
        "$ref": "#/Format"
      matchKind:
        type: string
        enum:
        - coordinate
        - digest
        description: Whether this result matched a coordinate prefix or an exact digest.
GlobalArtifactSearchPage:
  type: object
  required:
  - items
  - searchedRepositories
  properties:
    items:
      type: array
      items:
        "$ref": "#/GlobalArtifactSearchHit"
    searchedRepositories:
      type: integer
      minimum: 0
      description: Number of readable active repositories considered by this query.
    nextPageToken:
      type: string
OCIImage:
  type: object
  required:
  - name
  properties:
    name:
      type: string
      minLength: 1
OCIImagePage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/OCIImage"
    nextPageToken:
      type: string
OCIManifestSummary:
  type: object
  required:
  - digest
  - mediaType
  - size
  - tags
  properties:
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    mediaType:
      type: string
    size:
      type: integer
      format: int64
      minimum: 0
    tags:
      type: array
      items:
        type: string
    subjectDigest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    artifactType:
      type: string
OCIManifestSummaryPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/OCIManifestSummary"
    nextPageToken:
      type: string
MavenCoordinate:
  type: object
  required:
  - coordinate
  - digest
  - createdAt
  properties:
    coordinate:
      type: string
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    createdAt:
      type: string
      format: date-time
    publisher:
      type: string
      description: Publisher actor of the most recent committed publish session
        for this coordinate. Empty when no publish session was recorded (for
        example replicated or pre-session artifacts).
    buildNumber:
      type: integer
      description: Snapshot build number. Zero for release coordinates; one or
        greater for each published build of a SNAPSHOT coordinate.
MavenCoordinatePage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/MavenCoordinate"
    nextPageToken:
      type: string
ConanReference:
  type: object
  required:
  - reference
  properties:
    reference:
      type: string
      minLength: 1
    publisher:
      type: string
      description: Publisher actor of the most recent committed publish session
        for this reference. Empty when no publish session was recorded (for
        example replicated or pre-session artifacts).
ConanReferencePage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/ConanReference"
    nextPageToken:
