      type: string
      const: pending
Problem:
  type: object
  required:
  - type
  - title
  - status
  - code
  - message
  - requestId
  properties:
    type:
      type: string
      format: uri-reference
    title:
      type: string
    status:
      type: integer
    code:
      type: string
      enum:
      - invalid_request
      - invalid_page_token
      - access_denied
      - not_found
      - version_conflict
      - idempotency_conflict
      - coordinate_exists
      - session_closed
      - digest_mismatch
      - retention_protected
      - internal_error
    message:
      type: string
    requestId:
      type: string
RepositoryPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/Repository"
    nextPageToken:
      type: string
GroupPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/Group"
    nextPageToken:
      type: string
ArtifactPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/Artifact"
    nextPageToken:
      type: string
AuditRecord:
  type: object
  required:
  - outcome
  - occurredAt
  properties:
    groupName:
      type: string
    repository:
      type: string
    memberName:
      type: string
    outcome:
      type: string
    actor:
      type: string
    occurredAt:
      type: string
      format: date-time
    format:
      type: string
    resource:
      type: string
    representation:
      type: string
    memberType:
      type: string
    upstreamHost:
      type: string
    operation:
      type: string
    status:
      type: integer
    cacheDisposition:
      type: string
    bytes:
      type: integer
      format: int64
    authorizationSource:
      type: string
      description: Optional bounded authorization decision source. Current values include
        repository_grants, legacy_static, legacy_protocol, and administrator; consumers
        must accept future bounded values.
    authorizationReason:
      type: string
      description: Optional bounded authorization decision reason. Current values include
        scope_not_granted and grant_lookup_failed; consumers must accept future bounded
        values.
    requestId:
      type: string
    traceId:
      type: string
AuditList:
  type: array
