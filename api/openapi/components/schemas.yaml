    state: {type: string, enum: [visible, deleted]}
    createdAt: {type: string, format: date-time}
ConanPackageRevisionList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {"$ref": "#/ConanPackageRevision"}
ConanPackageIdList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {type: string}
ProxyCacheAsset:
