---
Format:
  type: string
  enum:
  - raw
  - oci
  - maven
  - conan
  - npm
  - pypi
  - go
  - apt
RepositoryOperation:
  type: string
  enum:
  - read
  - publish
  - browse
  - delete
  - restore
  - retain
  - reclaim
  - promote
  - replicate
FormatProfile:
  type: object
  required:
  - format
  - repositoryTypes
  - groupSupported
  - anonymousRead
  - hostedOperations
  - proxyOperations
  properties:
    format:
      "$ref": "#/Format"
    repositoryTypes:
      type: array
      uniqueItems: true
      items:
        type: string
        enum:
        - hosted
        - proxy
    groupSupported:
      type: boolean
    anonymousRead:
      type: boolean
    hostedOperations:
      type: array
      uniqueItems: true
      items:
        "$ref": "#/RepositoryOperation"
    proxyOperations:
      type: array
      uniqueItems: true
      items:
        "$ref": "#/RepositoryOperation"
FormatProfileList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/FormatProfile"
RuntimeNode:
  type: object
  required:
  - instanceId
  - sessionId
  - roles
  - workerFormats
  - workerKinds
  - startedAt
  - lastSeenAt
  - status
  properties:
    instanceId:
      type: string
    sessionId:
      type: string
    roles:
      type: array
      items:
        type: string
    workerFormats:
      type: array
      items:
        "$ref": "#/Format"
    workerKinds:
      type: array
      items:
        type: string
    startedAt:
      type: string
      format: date-time
    lastSeenAt:
      type: string
      format: date-time
    stoppedAt:
      type: string
      format: date-time
    status:
      type: string
      enum:
      - online
      - stale
      - offline
RuntimeNodeHealthIssue:
  type: object
  required:
  - code
  - severity
  - message
  properties:
    code:
      type: string
    severity:
      type: string
      enum:
      - warning
      - error
    message:
      type: string
RuntimeNodeHealth:
  type: object
  required:
  - status
  - online
  - stale
  - offline
  - issues
  properties:
    status:
      type: string
      enum:
      - healthy
      - degraded
      - critical
    online:
      type: integer
      minimum: 0
    stale:
      type: integer
      minimum: 0
    offline:
      type: integer
      minimum: 0
    issues:
      type: array
      items:
        "$ref": "#/RuntimeNodeHealthIssue"
RuntimeNodeList:
  type: object
  required:
  - items
  - health
  properties:
    items:
      type: array
      items:
        "$ref": "#/RuntimeNode"
    health:
      "$ref": "#/RuntimeNodeHealth"
DiagnosticDependency:
  type: object
  required:
  - name
  - status
  properties:
    name:
      type: string
    status:
      type: string
      enum:
      - reachable
      - unreachable
      - not_configured
    detail:
      type: string
DiagnosticBuild:
  type: object
  required:
  - version
  - goVersion
  - revision
  properties:
    version:
      type: string
    goVersion:
      type: string
    revision:
      type: string
    modified:
      type: boolean
DiagnosticRuntime:
  type: object
  required:
  - instanceId
  - roles
  - workerFormats
  - workerKinds
  properties:
    instanceId:
      type: string
    roles:
      type: array
      items:
        type: string
    workerFormats:
      type: array
      items:
        "$ref": "#/Format"
    workerKinds:
      type: array
      items:
        type: string
DiagnosticScanner:
  type: object
  description: Sanitized scanner reachability and vulnerability database freshness.
  required:
  - name
  - formats
  - status
  - detail
  - checkedAt
  - databaseFreshness
  - databaseMaxAgeSeconds
  properties:
    name:
      type: string
    formats:
      type: array
      items:
        "$ref": "#/Format"
    status:
      type: string
      enum:
      - healthy
      - degraded
      - unhealthy
      - unreachable
      - unknown
      - not_configured
    detail:
      type: string
    checkedAt:
      type: string
      format: date-time
    version:
      type: string
    databaseFreshness:
      type: string
      enum:
      - fresh
      - stale
      - unknown
    databaseVersion:
      type: string
    databaseUpdatedAt:
      type: string
      format: date-time
    databaseMaxAgeSeconds:
      type: integer
      minimum: 0
DiagnosticQueueStat:
  type: object
  required:
  - kind
  - format
  - state
  - count
  properties:
    kind:
      type: string
      enum:
      - lifecycle
      - promotion
      - replication
    format:
      "$ref": "#/Format"
    state:
      type: string
      enum:
      - pending
      - retrying
      - running
      - failed
    count:
      type: integer
      minimum: 0
    oldestCreatedAt:
      type: string
      format: date-time
Diagnostics:
  type: object
  required:
  - generatedAt
  - build
  - runtime
  - dependencies
  - queues
  - nodes
  properties:
    generatedAt:
      type: string
      format: date-time
    build:
      "$ref": "#/DiagnosticBuild"
    runtime:
      "$ref": "#/DiagnosticRuntime"
    dependencies:
      type: array
      items:
        "$ref": "#/DiagnosticDependency"
    scanner:
      "$ref": "#/DiagnosticScanner"
    queues:
      type: array
      items:
        "$ref": "#/DiagnosticQueueStat"
    nodes:
      "$ref": "#/RuntimeNodeHealth"
EgressProxy:
  type: object
  description: Per-Proxy-Repository egress network proxy configuration. Only
    meaningful when the repository type is proxy. `password` is accepted on
    write (plaintext over TLS) and stored AES-256-GCM encrypted; responses
    never return it and carry `credentialsConfigured` instead.
  required:
  - mode
  additionalProperties: false
  properties:
    mode:
      type: string
      enum:
      - direct
      - environment
      - custom
      description: direct bypasses any proxy (keeping private-address
        protection); environment follows process HTTP(S)_PROXY/NO_PROXY;
        custom uses the per-repository proxy below.
    protocol:
      type: string
      enum:
      - http
      - socks5
      description: Custom proxy protocol. http uses CONNECT; socks5 supports
        optional remote DNS.
    host:
      type: string
      description: Custom proxy hostname or IP, without scheme or credentials.
    port:
      type: integer
      minimum: 1
      maximum: 65535
    username:
      type: string
      description: Optional proxy authentication username.
    password:
      type: string
      writeOnly: true
      description: Optional proxy authentication password. Write-only; stored
        encrypted. Omit on update to keep stored credentials.
    clearCredentials:
      type: boolean
      default: false
      description: When true on update, removes any stored proxy credentials.
    remoteDns:
      type: boolean
      default: false
      description: socks5 only. When true the proxy resolves the upstream
        hostname (socks5h); when false the gateway resolves locally and keeps
        the private-address check.
    noProxy:
      type: array
      items:
        type: string
      description: Upstream host suffixes or CIDR ranges that bypass the
        custom proxy and connect directly. Matched against the upstream host,
        never the proxy host.
    credentialsConfigured:
      type: boolean
      readOnly: true
      description: True when encrypted proxy credentials are stored.
EgressProxyTestResult:
  type: object
  description: Ephemeral result of an egress proxy connection test. Nothing
    is persisted.
  required:
  - reachable
  - egressMode
  - checkedAt
  properties:
    reachable:
      type: boolean
    egressMode:
      type: string
      enum:
      - direct
      - environment
      - custom
    proxyHost:
      type: string
      description: Custom proxy host (no credentials) when mode is custom.
    upstreamStatus:
      type: integer
      description: HTTP status returned by the upstream probe, when reached.
    latencyMs:
      type: integer
    error:
      type: string
      description: Sanitized failure reason when reachable is false.
    checkedAt:
      type: string
      format: date-time
APIKey:
  type: object
  required:
  - id
  - name
  - roles
  - createdAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    roles:
      type: array
      items:
        type: string
        enum:
        - admin
        - writer
        - reader
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
      description: Time after which the key can no longer authenticate.
    lastUsedAt:
      type: string
      format: date-time
      description: Most recent successful authentication time.
    revokedAt:
      type: string
      format: date-time
APIKeyList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/APIKey"
CreateAPIKey:
  type: object
  required:
  - name
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
    roles:
      type: array
      minItems: 0
      default: []
      items:
        type: string
        enum:
        - admin
        - writer
        - reader
    expiresAt:
      type: string
      format: date-time
      description: Optional expiry. Defaults to 90 days and cannot exceed 365 days.
CreatedAPIKey:
  allOf:
  - "$ref": "#/APIKey"
  - type: object
    required:
    - token
    properties:
      token:
        type: string
User:
  type: object
  required:
  - id
  - name
  - displayName
  - email
  - description
  - role
  - state
  - localPasswordEnabled
  - failedLoginAttempts
  - mustChangePassword
  - createdAt
  - version
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    displayName:
      type: string
    email:
      type: string
    description:
      type: string
    role:
      type: string
      enum:
      - admin
      - writer
      - reader
    state:
      type: string
      enum:
      - active
      - disabled
    lastLoginAt:
      type: string
      format: date-time
    passwordChangedAt:
      type: string
      format: date-time
    localPasswordEnabled:
      type: boolean
    failedLoginAttempts:
      type: integer
      minimum: 0
    lockedUntil:
      type: string
      format: date-time
    mustChangePassword:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    version:
      type: string
UserList:
  type: object
  required:
  - items
  - total
  - offset
  - limit
  properties:
    items:
      type: array
      items:
        "$ref": "#/User"
    total:
      type: integer
      minimum: 0
    offset:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
CreateUser:
  type: object
  required:
  - name
  - password
  - role
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
    displayName:
      type: string
      maxLength: 128
    email:
      type: string
      format: email
      maxLength: 254
    description:
      type: string
      maxLength: 512
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
    role:
      type: string
      enum:
      - admin
      - writer
      - reader
    mustChangePassword:
      type: boolean
      default: false
UpdateUser:
  type: object
  additionalProperties: false
  properties:
    displayName:
      type: string
      maxLength: 128
    email:
      type: string
      format: email
      maxLength: 254
    description:
      type: string
      maxLength: 512
    role:
      type: string
      enum:
      - admin
      - writer
      - reader
    state:
      type: string
      enum:
      - active
      - disabled
ResetUserPassword:
  type: object
  required:
  - password
  additionalProperties: false
  properties:
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
    mustChangePassword:
      type: boolean
      default: true
OCITagList:
  type: object
  required:
  - name
  - tags
  properties:
    name:
      type: string
    tags:
      type: array
      items:
        type: string
OCIError:
  type: object
  required:
  - errors
  properties:
    errors:
      type: array
      items:
        type: object
        required:
        - code
        - message
        properties:
          code:
            type: string
          message:
            type: string
Repository:
  type: object
  required:
  - id
  - name
  - format
  - anonymousRead
  - state
  - version
  properties:
    id:
      type: string
    name:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    format:
      "$ref": "#/Format"
    type:
      type: string
      description: APT hosted is accepted as a management-only preview repository; it is not advertised as protocol-capable until signed snapshots are implemented.
      enum:
      - hosted
      - proxy
    endpoint:
      type: string
    allowedHosts:
      type: array
      items:
        type: string
    anonymousRead:
      type: boolean
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    egressProxy:
      "$ref": "#/EgressProxy"
    state:
      type: string
      description: Deletion is asynchronous. Protocol access stops in deleting; the worker advances it to deleted. The metadata row remains as an audit anchor.
      enum:
      - active
      - deleting
      - deleted
    version:
      type: string
CreateRepository:
  type: object
  required:
  - name
  - format
  additionalProperties: false
  properties:
    name:
      type: string
    format:
      "$ref": "#/Format"
    type:
      type: string
      description: APT hosted is accepted as a management-only preview repository; it is not advertised as protocol-capable until signed snapshots are implemented.
      enum:
      - hosted
      - proxy
      default: hosted
    endpoint:
      type: string
      description: Upstream base URL. Required when type is proxy; must be empty
        for hosted repositories.
    allowedHosts:
      type: array
      items:
        type: string
      description: Hosts the proxy may egress to. Required for raw, conan,
        and npm proxies. npm tarball redirects are limited to this list.
    anonymousRead:
      type: boolean
      default: false
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    egressProxy:
      "$ref": "#/EgressProxy"
UpdateRepository:
  type: object
  description: Editable repository management policy and proxy configuration. Hosted repositories only accept anonymousRead updates; name, format, and type are immutable after creation.
  additionalProperties: false
  properties:
    endpoint:
      type: string
      description: Upstream base URL (https). Required for proxy repositories.
    allowedHosts:
      type: array
      items:
        type: string
      description: Hosts the proxy may egress to. Required for raw, conan,
        and npm proxies. npm tarball redirects are limited to this list.
    anonymousRead:
      type: boolean
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    egressProxy:
      "$ref": "#/EgressProxy"
Group:
  type: object
  required:
  - id
  - name
  - format
  - anonymousRead
  - members
  - version
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    format:
      "$ref": "#/Format"
    anonymousRead:
      type: boolean
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    members:
      "$ref": "#/MemberList"
    version:
      type: string
CreateGroup:
  type: object
  required:
  - name
  - format
  - members
  additionalProperties: false
  properties:
    name:
      type: string
    format:
      "$ref": "#/Format"
    anonymousRead:
      type: boolean
      default: false
      description: Anonymous read policy. Defaults to false and permits unauthenticated protocol GET/HEAD where effective policy allows it.
    members:
      "$ref": "#/MemberList"
Member:
  type: object
  required:
  - repositoryId
  - position
  properties:
    repositoryId:
      type: string
      format: uuid
    position:
      type: integer
      minimum: 0
MemberList:
  type: array
  items:
    "$ref": "#/Member"
Grant:
  type: object
  required:
  - principal
  - scopes
  properties:
    principal:
      type: string
    scopes:
      type: array
      items:
        type: string
        enum:
        - repositories:read
        - repositories:write
        - repositories:admin
        - repositories:intelligence
    resourcePrefix:
      type: string
      description: Optional canonical resource prefix. Empty or omitted grants repository-wide access.
      maxLength: 255
GrantList:
  type: array
  items:
    "$ref": "#/Grant"
RepositoryGrantRecord:
  type: object
  required: [repositoryId, repositoryName, format, principal, scopes]
  properties:
    repositoryId: {type: string, format: uuid}
    repositoryName: {type: string}
    format: {"$ref": "#/Format"}
    principal: {type: string}
    scopes:
      type: array
      items:
        type: string
        enum: [repositories:read, repositories:write, repositories:admin, repositories:intelligence]
    resourcePrefix:
      type: string
      maxLength: 255
RepositoryGrantRecordList:
  type: array
  items:
    "$ref": "#/RepositoryGrantRecord"
AuthorizationTemplateGrant:
  type: object
  required: [principal, scopes]
  additionalProperties: false
  properties:
    principal:
      type: string
      minLength: 1
      maxLength: 512
    scopes:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum: [repositories:read, repositories:write, repositories:admin, repositories:intelligence]
    resourcePrefix:
      type: string
      maxLength: 255
AuthorizationTemplateWritable:
  type: object
  required: [name, grants]
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
    description:
      type: string
      maxLength: 1000
    grants:
      type: array
      maxItems: 500
      items:
        "$ref": "#/AuthorizationTemplateGrant"
AuthorizationTemplate:
  allOf:
  - "$ref": "#/AuthorizationTemplateWritable"
  - type: object
    required: [id, version, createdAt, updatedAt]
    properties:
      id:
        type: string
        format: uuid
      version:
        type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
AuthorizationTemplateList:
  type: array
  items:
    "$ref": "#/AuthorizationTemplate"
AuthorizationRoleWritable:
  type: object
  required: [name, scopes]
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
    description:
      type: string
      maxLength: 1000
    scopes:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum: [repositories:read, repositories:write, repositories:admin, repositories:intelligence]
AuthorizationRole:
  allOf:
  - "$ref": "#/AuthorizationRoleWritable"
  - type: object
    required: [id, version, createdAt, updatedAt]
    properties:
      id:
        type: string
        format: uuid
      version:
        type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
AuthorizationRoleList:
  type: array
  items:
    "$ref": "#/AuthorizationRole"
ApplyAuthorizationTemplate:
  type: object
  required: [repositoryId]
  additionalProperties: false
  properties:
    repositoryId:
      type: string
      format: uuid
RetentionPolicy:
  type: object
  required:
  - version
  - keepDays
  - minimumVersions
  properties:
    version:
      type: string
    enabled:
      type: boolean
      default: false
      description: Whether scheduled and manual retention execution is enabled.
    keepDays:
      type: integer
      minimum: 1
      description: Days to retain artifacts or versions before cleanup eligibility.
    snapshotKeepDays:
      type: integer
      minimum: 1
      description: Days to retain Maven SNAPSHOT versions. Defaults to keepDays when omitted.
    minimumVersions:
      type: integer
      minimum: 1
      description: Minimum newest versions protected per Maven module, OCI image, Conan reference, npm package, or normalized PyPI project. Raw paths do not use version-count rules.
    maximumVersions:
      type: integer
      minimum: 0
      default: 0
      description: Maximum versions retained per Maven module, OCI image, Conan reference, npm package, or normalized PyPI project. Zero disables the count cap; Raw paths do not use it.
    coordinatePatterns:
      type: array
      maxItems: 20
      description: Optional RE2 regular expressions selecting cleanup units. They match Maven coordinates, OCI names or references, Conan references or revisions, Raw paths, npm package names or package versions, and PyPI project names or project versions.
      items: {type: string, minLength: 1, maxLength: 256}
    protectedPatterns:
      type: array
      maxItems: 20
      description: RE2 regular expressions protecting matching format-specific cleanup units from cleanup.
      items: {type: string, minLength: 1, maxLength: 256}
SecurityPolicy:
  type: object
  required: [version]
  additionalProperties: false
  properties:
    version: {type: string}
    enabled: {type: boolean, default: false, description: Enforce for promotions into this repository.}
    autoScanOnPublish: {type: boolean, default: false, description: Enqueue an asynchronous intelligence scan after a new artifact publication.}
    requireSignature: {type: boolean, default: false}
    requireVerifiedSignature: {type: boolean, default: false}
    requireSbom: {type: boolean, default: false}
    requireProvenance: {type: boolean, default: false}
    requireVulnerabilityScan: {type: boolean, default: false}
    maxAllowedSeverity:
      type: string
      enum: [none, low, medium, high, critical]
      default: critical
    failOnScanError: {type: boolean, default: true}
    allowedLicenses:
      type: array
      maxItems: 100
      uniqueItems: true
      items: {type: string, minLength: 1, maxLength: 128}
QuarantineReadPolicy:
  type: object
  required: [version, enabled]
  additionalProperties: false
  description: Hosted repository policy controlling protocol reads of quarantined artifacts. It is disabled by default.
  properties:
    version: {type: string}
    enabled: {type: boolean, default: false}
SecurityPolicyEvaluationRequest:
  type: object
  required: [sourceRepositoryId, coordinate, digest]
  additionalProperties: false
  properties:
    sourceRepositoryId:
      type: string
      format: uuid
    coordinate: {type: string, minLength: 1, maxLength: 1024}
    digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
SecurityPolicyEvaluation:
  type: object
  required: [allowed, enforced, policyVersion, intelligencePresent, reasons]
  additionalProperties: false
  properties:
    allowed: {type: boolean}
    enforced: {type: boolean}
    policyVersion: {type: string}
    intelligencePresent: {type: boolean}
    reasons:
      type: array
      items: {type: string}
RepositoryCapacity:
  type: object
  required: [repositoryId, format, usedBytes, objectCount, quotaBytes]
  properties:
    repositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    usedBytes: {type: integer, format: int64, minimum: 0}
    objectCount: {type: integer, format: int64, minimum: 0}
    quotaBytes: {type: integer, format: int64, minimum: 0, description: "Zero disables the quota."}
    primaryBytes: {type: integer, format: int64, minimum: 0, description: "Cached primary artifact bytes when the repository exposes cache projections."}
    sidecarBytes: {type: integer, format: int64, minimum: 0, description: "Cached metadata and checksum sidecar bytes."}
    negativeCount: {type: integer, format: int64, minimum: 0, description: "Active negative-cache entries."}
    expiredObjectCount: {type: integer, format: int64, minimum: 0, description: "Expired cache entries eligible for reclamation."}
    reclaimableBytes: {type: integer, format: int64, minimum: 0, description: "Expired cached bytes eligible for reclamation."}
RepositoryCapacityList:
  type: array
  items:
    "$ref": "#/RepositoryCapacity"
RepositoryCapacityQuota:
  type: object
  required: [quotaBytes]
  additionalProperties: false
  properties:
    quotaBytes: {type: integer, format: int64, minimum: 0}
EffectiveAccessDecision:
  type: object
  required: [allowed, source, reason]
  properties:
    allowed: {type: boolean}
    source: {type: string}
    reason: {type: string}
EffectiveAccessPermissions:
  type: object
  required: [read, write, admin, intelligence]
  properties:
    read: {"$ref": "#/EffectiveAccessDecision"}
    write: {"$ref": "#/EffectiveAccessDecision"}
    admin: {"$ref": "#/EffectiveAccessDecision"}
    intelligence: {"$ref": "#/EffectiveAccessDecision"}
AuthenticationKind:
  type: string
  enum: [static_admin, static_resolver, local_session, api_key, oidc]
OIDCRoleMappingMatch:
  type: object
  required: [externalRole, gatewayRole]
  additionalProperties: false
  properties:
    externalRole: {type: string, minLength: 1}
    gatewayRole:
      type: string
      enum: [admin, writer, reader]
OIDCIdentityDetails:
  type: object
  required: [adminSubject, roleMappings]
  additionalProperties: false
  properties:
    adminSubject: {type: boolean}
    roleMappings:
      type: array
      items: {"$ref": "#/OIDCRoleMappingMatch"}
CurrentIdentity:
  type: object
  required: [actor, kind, administrator]
  additionalProperties: false
  properties:
    actor: {type: string, minLength: 1}
    kind: {"$ref": "#/AuthenticationKind"}
    role:
      type: string
      enum: [admin, writer, reader]
    administrator: {type: boolean}
    oidc: {"$ref": "#/OIDCIdentityDetails"}
RepositoryEffectiveAccess:
  type: object
  required: [actor, identity, repository, resource, simulated, anonymousRead, permissions]
  properties:
    actor: {type: string}
    identity: {"$ref": "#/CurrentIdentity"}
    resource:
      type: string
      description: Concrete canonical resource evaluated for prefix-scoped grants; empty means repository-wide access.
    simulated:
      type: boolean
      description: True when an administrator supplied an actor instead of evaluating the authenticated caller.
    repository:
      type: object
      required: [id, name, format, type, state]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        format: {"$ref": "#/Format"}
        type:
          type: string
          enum: [hosted, proxy]
        state:
          type: string
          enum: [active, deleting, deleted]
    anonymousRead: {"$ref": "#/EffectiveAccessDecision"}
    permissions: {"$ref": "#/EffectiveAccessPermissions"}
RetentionDryRun:
  type: object
  required: [policyVersion, totalCandidates, summary, candidates]
  properties:
    policyVersion: {type: string}
    totalCandidates: {type: integer, minimum: 0}
    summary: {"$ref": "#/RetentionDryRunSummary"}
    candidates:
      type: array
      items:
        type: object
        required: [format, coordinate, digest, createdAt, reasons, ageDays, versionType]
        properties:
          format: {"$ref": "#/Format"}
          coordinate: {type: string}
          digest: {type: string}
          createdAt: {type: string, format: date-time}
          reasons:
            type: array
            minItems: 1
            items: {type: string, enum: [age, maximum_versions]}
          ageDays: {type: integer, minimum: 0}
          versionType: {type: string, enum: [release, snapshot, version, asset]}
    nextPageToken: {type: string}
RetentionDryRunSummary:
  type: object
  required: [reasonCounts, versionTypeCounts]
  additionalProperties: false
  properties:
    reasonCounts: {"$ref": "#/RetentionReasonCounts"}
    versionTypeCounts: {"$ref": "#/RetentionVersionTypeCounts"}
    oldestCandidateAt: {type: string, format: date-time}
RetentionReasonCounts:
  type: object
  required: [age, maximumVersions]
  additionalProperties: false
  properties:
    age: {type: integer, minimum: 0}
    maximumVersions: {type: integer, minimum: 0}
RetentionVersionTypeCounts:
  type: object
  required: [release, snapshot, version, asset]
  additionalProperties: false
  properties:
    release: {type: integer, minimum: 0}
    snapshot: {type: integer, minimum: 0}
    version: {type: integer, minimum: 0}
    asset: {type: integer, minimum: 0}
RestoreArtifact:
  type: object
  required: [coordinate]
  additionalProperties: false
  properties:
    coordinate:
      type: string
      minLength: 1
      maxLength: 1024
LifecycleJob:
  type: object
  required:
  - id
  - kind
  - state
  - createdAt
  - attempts
  - maxAttempts
  - progressCurrent
  - progressTotal
  properties:
    id:
      type: string
    kind:
      type: string
      enum:
      - retention
      - promotion
      - replication
      - reclaim
      - intelligence
      - scan
    state:
      type: string
      enum:
      - pending
      - running
      - retrying
      - completed
      - failed
      - cancelled
    createdAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
    nextAttemptAt:
      type: string
      format: date-time
    leaseExpiresAt:
      type: string
      format: date-time
    attempts:
      type: integer
      minimum: 0
    maxAttempts:
      type: integer
      minimum: 1
      maximum: 20
    progressCurrent:
      type: integer
      minimum: 0
    progressTotal:
      type: integer
      minimum: 0
    progressMessage:
      type: string
      maxLength: 255
    lastError:
      type: string
      maxLength: 1024
    details:
      "$ref": "#/LifecycleJobDetails"
LifecycleJobDetails:
  type: object
  additionalProperties: false
  required: [format, coordinate, digest]
  properties:
    format: {"$ref": "#/Format"}
    sourceRepositoryId: {type: string, format: uuid}
    coordinate: {type: string}
    digest: {type: string}
ArtifactScanRequest:
  type: object
  additionalProperties: false
  required: [coordinate, digest]
  properties:
    coordinate:
      type: string
      minLength: 1
      maxLength: 1024
    digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
ArtifactScanStatus:
  type: object
  additionalProperties: false
  required: [coordinate, digest, state]
  properties:
    coordinate: {type: string}
    digest: {type: string}
    state:
      type: string
      enum: [never, pending, running, retrying, completed, failed, cancelled]
    job: {"$ref": "#/LifecycleJob"}
ArtifactScanReconciliation:
  type: object
  additionalProperties: false
  required: [repositoryId, inspected, enqueued, retried, skipped, jobIds]
  properties:
    repositoryId: {type: string, format: uuid}
    inspected: {type: integer, minimum: 0}
    enqueued: {type: integer, minimum: 0}
    retried: {type: integer, minimum: 0}
    skipped: {type: integer, minimum: 0}
    jobIds:
      type: array
      maxItems: 1000
      items: {type: string, maxLength: 255}
LifecycleJobReconciliation:
  type: object
  additionalProperties: false
  required: [repositoryId, requeued, requeuedJobIds]
  properties:
    repositoryId: {type: string, format: uuid}
    requeued: {type: integer, minimum: 0}
    requeuedJobIds:
      type: array
      maxItems: 100
      items: {type: string, maxLength: 255}
RepositoryLifecycleJob:
  type: object
  required: [repositoryId, repositoryName, job]
  properties:
    repositoryId: {type: string, format: uuid}
    repositoryName: {type: string}
    job: {"$ref": "#/LifecycleJob"}
RepositoryLifecycleJobList:
  type: array
  items:
    "$ref": "#/RepositoryLifecycleJob"
CreateScheduledTask:
  type: object
  required: [name, kind, intervalMinutes, enabled]
  additionalProperties: false
  properties:
    name: {type: string, minLength: 1, maxLength: 100}
    description: {type: string, maxLength: 500, default: ""}
    kind:
      type: string
      enum: [repository-retention, audit-retention]
    repositoryId:
      type: string
      format: uuid
      description: Required for repository-retention and omitted for audit-retention.
    intervalMinutes: {type: integer, minimum: 15, maximum: 525600}
    enabled: {type: boolean}
    nextRunAt:
      type: string
      format: date-time
      description: Defaults to one interval after creation.
UpdateScheduledTask:
  allOf:
  - "$ref": "#/CreateScheduledTask"
ScheduledTask:
  type: object
  required: [id, name, description, kind, intervalMinutes, enabled, nextRunAt, version, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    description: {type: string}
    kind:
      type: string
      enum: [repository-retention, audit-retention]
    repositoryId: {type: string, format: uuid}
    intervalMinutes: {type: integer, minimum: 15, maximum: 525600}
    enabled: {type: boolean}
    nextRunAt: {type: string, format: date-time}
    lastRunAt: {type: string, format: date-time}
    lastRunId: {type: string, format: uuid}
    lastRunState:
      type: string
      enum: [submitted, failed]
    lastError: {type: string, maxLength: 1024}
    version: {type: string}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
ScheduledTaskRun:
  type: object
  required: [id, taskId, trigger, state, scheduledAt, createdAt]
  properties:
    id: {type: string, format: uuid}
    taskId: {type: string, format: uuid}
    trigger:
      type: string
      enum: [scheduled, manual]
    state:
      type: string
      enum: [submitted, failed]
    scheduledAt: {type: string, format: date-time}
    createdAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    targetKind:
      type: string
      enum: [lifecycle, audit-cleanup]
    targetId: {type: string}
    lastError: {type: string, maxLength: 1024}
AuditRetentionPolicy:
  type: object
  required: [version, enabled, keepDays]
  additionalProperties: false
  properties:
    version: {type: string}
    enabled: {type: boolean}
    keepDays: {type: integer, minimum: 0, maximum: 36500}
AnonymousAccessPolicy:
  type: object
  required: [version, enabled]
  additionalProperties: false
  properties:
    version: {type: string}
    enabled:
      type: boolean
      description: Permits unauthenticated protocol reads only when the Repository or Group policy also allows them.
OIDCSettings:
  type: object
  required: [version, source, enabled, issuer, audience, clientId, clientSecretConfigured, redirectUrl, scopes, adminSubjects, readerRoles, writerRoles, adminRoles, provisioningMode, emailLinkingEnabled, jitDefaultRole]
  additionalProperties: false
  properties:
    version: {type: string}
    source: {type: string, enum: [environment, database]}
    enabled: {type: boolean}
    issuer: {type: string, format: uri}
    audience: {type: string}
    jwksUrl: {type: string, format: uri}
    clientId: {type: string}
    clientSecretConfigured: {type: boolean}
    redirectUrl: {type: string, format: uri}
    scopes:
      type: array
      items: {type: string}
    adminSubjects:
      type: array
      items: {type: string}
    readerRoles:
      type: array
      items: {type: string}
    writerRoles:
      type: array
      items: {type: string}
    adminRoles:
      type: array
      items: {type: string}
    provisioningMode: {type: string, enum: [disabled, jit]}
    emailLinkingEnabled: {type: boolean}
    jitDefaultRole: {type: string, enum: [admin, writer, reader]}
    updatedAt: {type: string, format: date-time}
OIDCSettingsUpdate:
  type: object
  required: [enabled, issuer, audience, clientId, redirectUrl, scopes, adminSubjects, readerRoles, writerRoles, adminRoles, provisioningMode, emailLinkingEnabled, jitDefaultRole]
  additionalProperties: false
  properties:
    enabled: {type: boolean}
    issuer: {type: string, format: uri}
    audience: {type: string}
    jwksUrl: {type: string, format: uri}
    clientId: {type: string}
    clientSecret:
      type: string
      writeOnly: true
    clearClientSecret: {type: boolean, default: false}
    redirectUrl: {type: string, format: uri}
    scopes:
      type: array
      items: {type: string}
    adminSubjects:
      type: array
      items: {type: string}
    readerRoles:
      type: array
      items: {type: string}
    writerRoles:
      type: array
      items: {type: string}
    adminRoles:
      type: array
      items: {type: string}
    provisioningMode: {type: string, enum: [disabled, jit]}
    emailLinkingEnabled: {type: boolean}
    jitDefaultRole: {type: string, enum: [admin, writer, reader]}
OIDCConnectionTest:
  type: object
  required: [reachable, issuer, latencyMs, checkedAt]
  additionalProperties: false
  properties:
    reachable: {type: boolean}
    issuer: {type: string, format: uri}
    authorizationEndpoint: {type: string, format: uri}
    tokenEndpoint: {type: string, format: uri}
    jwksUrl: {type: string, format: uri}
    latencyMs: {type: integer, minimum: 0}
    checkedAt: {type: string, format: date-time}
UserIdentity:
  type: object
  required: [id, userId, kind, issuer, subject, email, displayName, emailVerified, createdAt]
  additionalProperties: false
  properties:
    id: {type: string, format: uuid}
    userId: {type: string, format: uuid}
    kind: {type: string, enum: [oidc]}
    issuer: {type: string, format: uri}
    subject: {type: string, minLength: 1}
    email: {type: string}
    displayName: {type: string}
    emailVerified: {type: boolean}
    lastLoginAt: {type: string, format: date-time}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
UserIdentityList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {"$ref": "#/UserIdentity"}
UserSession:
  type: object
  required: [id, userId, kind, ipAddress, userAgent, createdAt, expiresAt, current]
  additionalProperties: false
  properties:
    id: {type: string, format: uuid}
    userId: {type: string, format: uuid}
    kind: {type: string, enum: [local_session, oidc]}
    ipAddress: {type: string, maxLength: 64}
    userAgent: {type: string, maxLength: 512}
    createdAt: {type: string, format: date-time}
    expiresAt: {type: string, format: date-time}
    revokedAt: {type: string, format: date-time}
    current:
      type: boolean
      description: True when this is the session used for the management request.
UserSessionList:
  type: object
  required: [items]
  additionalProperties: false
  properties:
    items:
      type: array
      items: {"$ref": "#/UserSession"}
CreateUserIdentity:
  type: object
  required: [issuer, subject]
  additionalProperties: false
  properties:
    issuer: {type: string, format: uri}
    subject: {type: string, minLength: 1, maxLength: 512}
AuditCleanupJob:
  type: object
  required: [id, policyVersion, cutoffAt, batchSize, deleted, state, createdAt]
  properties:
    id: {type: string, format: uuid}
    policyVersion: {type: string}
    cutoffAt: {type: string, format: date-time}
    batchSize: {type: integer, minimum: 1, maximum: 1000}
    deleted: {type: integer, minimum: 0}
    state: {type: string, enum: [pending, running, completed, failed]}
    createdAt: {type: string, format: date-time}
    startedAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    lastError: {type: string, maxLength: 1024}
PromotionRequest:
  type: object
  required: [targetRepositoryId, coordinate, digest]
  additionalProperties: false
  properties:
    targetRepositoryId: {type: string, format: uuid}
    coordinate: {type: string}
    digest: {type: string}
ReplicationRequest:
  type: object
  required: [targetRepositoryId, coordinate, digest]
  additionalProperties: false
  properties:
    targetRepositoryId: {type: string, format: uuid}
    coordinate: {type: string, minLength: 1, maxLength: 1024}
    digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
ReplicationPlan:
  type: object
  required: [id, sourceRepositoryId, targetRepositoryId, format, state, createdAt]
  properties:
    id: {type: string, format: uuid}
    sourceRepositoryId: {type: string, format: uuid}
    targetRepositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    coordinate:
      type: string
      minLength: 1
      maxLength: 1024
      description: Immutable artifact coordinate. Omitted together with digest for legacy plans created before artifact identity was persisted.
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
      description: Immutable artifact digest. Omitted together with coordinate for legacy plans created before artifact identity was persisted.
    state: {type: string, enum: [pending, running, completed, failed, cancelled]}
    createdAt: {type: string, format: date-time}
    startedAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    lastError:
      type: string
      maxLength: 1024
      description: Worker failure text. Parked plans use artifact_quarantined or replication_snapshot_changed as stable control reasons.
ReplicationPlanDetail:
  allOf:
  - "$ref": "#/ReplicationPlan"
  - type: object
    required: [checkpoints]
    properties:
      checkpoints:
        type: array
        items: {"$ref": "#/ReplicationCheckpointProgress"}
ReplicationCheckpointProgress:
  type: object
  required: [objectKey, digest, size, byteOffset, state, attempts]
  properties:
    objectKey: {type: string}
    digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
    size: {type: integer, format: int64, minimum: 0}
    byteOffset: {type: integer, format: int64, minimum: 0}
    state: {type: string, enum: [pending, copying, verified, failed]}
    attempts: {type: integer, minimum: 0}
    lastError: {type: string, maxLength: 1024}
    verifiedAt: {type: string, format: date-time}
ArtifactTombstone:
  type: object
  required: [coordinate, digest, tombstonedAt]
  properties:
    coordinate: {type: string}
    digest: {type: string}
    tombstonedAt: {type: string, format: date-time}
ArtifactTombstonePage:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {"$ref": "#/ArtifactTombstone"}
    nextPageToken: {type: string}
RepositoryCapabilities:
  type: object
  required:
  - format
  - type
  - operations
  - artifactScanning
  - publicationScanning
  properties:
    format:
      "$ref": "#/Format"
    type:
      type: string
      enum:
      - hosted
      - proxy
    operations:
      type: array
      uniqueItems: true
      items:
        "$ref": "#/RepositoryOperation"
    artifactScanning:
      type: boolean
      description: True when a scanner is configured for this repository format and its assets can be resolved.
    publicationScanning:
      type: boolean
      description: True when new publications in this repository can automatically enqueue scanner jobs.
GroupCapacity:
  type: object
  required: [groupId, format, members]
  properties:
    groupId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    members:
      type: array
      items: {"$ref": "#/GroupCapacityMember"}
GroupCapacityMember:
  type: object
  required: [position, repositoryId, format, type, usedBytes, objectCount]
  properties:
    position: {type: integer, minimum: 0}
    repositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    type: {type: string, enum: [hosted, proxy]}
    usedBytes: {type: integer, format: int64, minimum: 0}
    objectCount: {type: integer, format: int64, minimum: 0}
    quotaBytes: {type: integer, format: int64, minimum: 0}
CreatePublishSession:
  oneOf:
  - "$ref": "#/CreateMavenPublishSession"
  description: Maven-only management publish session. Raw Hosted writes use PUT /raw/{repository}/{path};
    OCI Hosted writes use Registry V2 upload and manifest routes.
CreateMavenPublishSession:
  type: object
  required:
  - format
  - coordinate
  - pomObject
  - objects
  additionalProperties: false
  properties:
    format:
      type: string
      const: maven
    coordinate:
      type: string
      pattern: "^[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+(?::[A-Za-z0-9_.-]+(?::[A-Za-z0-9_.-]+)?)?$"
    pomObject:
      type: string
      pattern: "^[^/]+$"
    objects:
      type: array
      minItems: 1
      items:
        "$ref": "#/DeclaredObject"
CommitMavenCoordinate:
  type: object
  description: Expected names detect incomplete upload only. Digest, size, checksum,
    metadata, object keys, and visibility are derived and controlled by the Gateway.
  required:
  - expectedAssetNames
  additionalProperties: false
  properties:
    expectedAssetNames:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        pattern: "^[^/]+$"
DeclaredObject:
  type: object
  required:
  - name
  - digest
  - size
  properties:
    name:
      type: string
      pattern: "^[^/]+$"
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    size:
      type: integer
      minimum: 0
PublishSession:
  type: object
  required:
  - id
  - repositoryId
  - coordinate
  - state
  - expiresAt
  - objects
  properties:
    id:
      type: string
      format: uuid
    repositoryId:
      type: string
      format: uuid
    coordinate:
      type: string
    state:
      type: string
      enum:
      - open
      - committed
      - aborted
      - expired
    expiresAt:
      type: string
      format: date-time
    objects:
      type: array
      items:
        "$ref": "#/DeclaredObject"
Artifact:
  type: object
  required:
  - id
  - coordinate
  - digest
  - createdAt
  - state
  properties:
    id:
      type: string
      format: uuid
    coordinate:
      type: string
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    createdAt:
      type: string
      format: date-time
    state:
      type: string
      enum:
      - visible
      - deleted
ArtifactSummary:
  type: object
  required:
  - coordinate
  properties:
    coordinate:
      type: string
    version:
      type: string
      description: Exact package version when the format exposes one independently from the coordinate.
    versionCount:
      type: integer
      format: int32
      minimum: 0
      description: Number of versions represented by a package-level browse result.
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    size:
      type: integer
      format: int64
      minimum: 0
    contentType:
      type: string
    createdAt:
      type: string
      format: date-time
    cachedAt:
      type: string
      format: date-time
      description: Most recent successful cache fill or metadata revalidation time.
    sourceUrl:
      type: string
      format: uri
      description: Exact upstream URL persisted when this proxy asset was cached.
    buildNumber:
      type: integer
      format: int32
      minimum: 0
      description: Snapshot build number; zero for release coordinates.
    publisher:
      type: string
      description: Publisher actor when the format records it.
    intelligence:
      "$ref": "#/ArtifactIntelligenceSummary"
ArtifactSummaryPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/ArtifactSummary"
    nextPageToken:
      type: string
ArtifactIdentityPurpose:
  type: string
  enum: [scan, distribution]
ArtifactIdentity:
  type: object
  additionalProperties: false
  required: [coordinate, digest, publishedAt]
  properties:
    coordinate:
      type: string
      minLength: 1
      maxLength: 1024
      description: Protocol-owned canonical coordinate accepted by the requested operation.
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    size:
      type: integer
      format: int64
      minimum: 0
    publishedAt:
      type: string
      format: date-time
    intelligence:
      "$ref": "#/ArtifactIntelligenceSummary"
ArtifactIdentityPage:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 200
      items:
        "$ref": "#/ArtifactIdentity"
ArtifactSignature:
  type: object
  required: [keyId, algorithm, identity, signature, verified]
  additionalProperties: false
  properties:
    keyId: {type: string, minLength: 1, maxLength: 512}
    algorithm: {type: string, minLength: 1, maxLength: 128}
    identity: {type: string, minLength: 1, maxLength: 1024}
    signature: {type: string, minLength: 1, maxLength: 4096}
    verified: {type: boolean}
    verifiedAt: {type: string, format: date-time}
ArtifactSBOM:
  type: object
  required: [mediaType, digest]
  additionalProperties: false
  properties:
    mediaType: {type: string, minLength: 1, maxLength: 255}
    digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
    url: {type: string, format: uri, maxLength: 2048}
    size: {type: integer, format: int64, minimum: 0}
ArtifactProvenance:
  type: object
  required: [builder, buildType, sourceRepository, sourceCommit, buildId]
  additionalProperties: false
  properties:
    builder: {type: string, minLength: 1, maxLength: 512}
    buildType: {type: string, minLength: 1, maxLength: 512}
    sourceRepository: {type: string, maxLength: 2048}
    sourceCommit: {type: string, maxLength: 256}
    buildId: {type: string, maxLength: 512}
    startedAt: {type: string, format: date-time}
    finishedAt: {type: string, format: date-time}
ArtifactLicense:
  type: object
  required: [spdxId, name]
  additionalProperties: false
  properties:
    spdxId: {type: string, minLength: 1, maxLength: 128}
    name: {type: string, minLength: 1, maxLength: 512}
    source: {type: string, maxLength: 2048}
ArtifactIntelligenceSummary:
  type: object
  required: [signatureCount, sbomCount, licenseCount]
  additionalProperties: false
  properties:
    signatureCount: {type: integer, minimum: 0}
    sbomCount: {type: integer, minimum: 0}
    licenseCount: {type: integer, minimum: 0}
    vulnerabilityStatus:
      type: string
      enum: [not_scanned, clean, affected, error]
    critical: {type: integer, minimum: 0}
    high: {type: integer, minimum: 0}
    medium: {type: integer, minimum: 0}
    low: {type: integer, minimum: 0}
    unknown: {type: integer, minimum: 0}
ArtifactVulnerabilitySummary:
  type: object
  description: >-
    Bounded scanner result. affected requires at least one non-zero severity
    count; clean and not_scanned require zero counts. When findings is present,
    it is the complete set and its severity totals must exactly match the five
    counters. Duplicate id/source/component/version/location identities are not
    allowed.
  required: [scanner, status, critical, high, medium, low, unknown]
  additionalProperties: false
  properties:
    scanner: {type: string, minLength: 1, maxLength: 256, pattern: '^[^\r\n\x00]*\S[^\r\n\x00]*$'}
    scannedAt: {type: string, format: date-time}
    status: {type: string, enum: [not_scanned, clean, affected, error]}
    critical: {type: integer, minimum: 0, maximum: 1000000000}
    high: {type: integer, minimum: 0, maximum: 1000000000}
    medium: {type: integer, minimum: 0, maximum: 1000000000}
    low: {type: integer, minimum: 0, maximum: 1000000000}
    unknown: {type: integer, minimum: 0, maximum: 1000000000}
    findings:
      type: array
      description: Optional complete per-vulnerability evidence; omission keeps summary-only writers compatible.
      maxItems: 1000
      items: {"$ref": "#/ArtifactVulnerabilityFinding"}
ArtifactVulnerabilityFinding:
  type: object
  description: >-
    One affected component and remediation hint. Single-line identity fields
    cannot contain NUL, CR, or LF. Optional text may be omitted or empty.
  required: [id, severity, component]
  additionalProperties: false
  properties:
    id: {type: string, minLength: 1, maxLength: 128, pattern: '^[^\r\n\x00]*\S[^\r\n\x00]*$'}
    source: {type: string, maxLength: 128, pattern: '^(?:|[^\r\n\x00]*\S[^\r\n\x00]*)$'}
    severity:
      type: string
      enum: [critical, high, medium, low, unknown]
    component: {type: string, minLength: 1, maxLength: 512, pattern: '^[^\r\n\x00]*\S[^\r\n\x00]*$'}
    version: {type: string, maxLength: 256, pattern: '^(?:|[^\r\n\x00]*\S[^\r\n\x00]*)$'}
    fixedVersion: {type: string, maxLength: 256, pattern: '^(?:|[^\r\n\x00]*\S[^\r\n\x00]*)$'}
    location: {type: string, maxLength: 2048, pattern: '^(?:|[^\r\n\x00]*\S[^\r\n\x00]*)$'}
    title: {type: string, maxLength: 512, pattern: '^(?:|[^\r\n\x00]*\S[^\r\n\x00]*)$'}
    description:
      type: string
      maxLength: 4096
      pattern: '^(?:|[^\x00]*\S[^\x00]*)$'
      description: Optional multiline text; a non-empty value must contain at least one non-whitespace character.
    url:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^https?://'
      description: Optional HTTP(S) advisory URL without user information or credentials.
    cvssScore: {type: number, format: double, minimum: 0, maximum: 10}
    cvssVector: {type: string, maxLength: 256, pattern: '^(?:|[^\r\n\x00]*\S[^\r\n\x00]*)$'}
ArtifactIntelligence:
  type: object
  required: [repositoryId, format, coordinate, digest, signatures, sboms, licenses, version, createdAt, updatedAt, updatedBy]
  properties:
    repositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    coordinate: {type: string}
    digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
    signatures:
      type: array
      items: {"$ref": "#/ArtifactSignature"}
    sboms:
      type: array
      items: {"$ref": "#/ArtifactSBOM"}
    provenance: {"$ref": "#/ArtifactProvenance"}
    licenses:
      type: array
      items: {"$ref": "#/ArtifactLicense"}
    vulnerability: {"$ref": "#/ArtifactVulnerabilitySummary"}
    version: {type: string}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
    updatedBy: {type: string}
ArtifactIntelligenceWritable:
  type: object
  required: [signatures, sboms, licenses]
  additionalProperties: false
  properties:
    signatures:
      type: array
      maxItems: 20
      items: {"$ref": "#/ArtifactSignature"}
    sboms:
      type: array
      maxItems: 20
      items: {"$ref": "#/ArtifactSBOM"}
    provenance: {"$ref": "#/ArtifactProvenance"}
    licenses:
      type: array
      maxItems: 100
      items: {"$ref": "#/ArtifactLicense"}
    vulnerability: {"$ref": "#/ArtifactVulnerabilitySummary"}
ArtifactQuarantine:
  type: object
  required: [repositoryId, format, coordinate, digest, state, reason, version, updatedBy, updatedAt]
  additionalProperties: false
  properties:
    repositoryId: {type: string, format: uuid}
    format: {"$ref": "#/Format"}
    coordinate:
      type: string
      minLength: 1
      maxLength: 1024
      description: Immutable distribution coordinate; Conan uses the recipe revision, never an individual package revision.
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
      description: Immutable distribution digest; Conan uses the recipe revision digest.
    state:
      type: string
      enum: [quarantined, released]
    reason:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[^\x00]*\S[^\x00]*$'
    version: {type: string, minLength: 1}
    updatedBy: {type: string, minLength: 1, maxLength: 512}
    updatedAt: {type: string, format: date-time}
    quarantinedAt: {type: string, format: date-time}
    releasedAt: {type: string, format: date-time}
ArtifactQuarantineUpdate:
  type: object
  required: [state, reason]
  additionalProperties: false
  properties:
    state:
      type: string
      enum: [quarantined, released]
    reason:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[^\x00]*\S[^\x00]*$'
GlobalArtifactSearchHit:
  allOf:
  - "$ref": "#/ArtifactSummary"
  - type: object
    required:
    - repositoryId
    - repositoryName
    - format
    - matchKind
    properties:
      repositoryId:
        type: string
        format: uuid
      repositoryName:
        type: string
      format:
        "$ref": "#/Format"
      matchKind:
        type: string
        enum:
        - coordinate
        - digest
        description: Whether this result matched a coordinate prefix or an exact digest.
GlobalArtifactSearchPage:
  type: object
  required:
  - items
  - searchedRepositories
  properties:
    items:
      type: array
      items:
        "$ref": "#/GlobalArtifactSearchHit"
    searchedRepositories:
      type: integer
      minimum: 0
      description: Number of readable active repositories considered by this query.
    nextPageToken:
      type: string
OCIImage:
  type: object
  required:
  - name
  properties:
    name:
      type: string
      minLength: 1
OCIImagePage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/OCIImage"
    nextPageToken:
      type: string
OCIManifestSummary:
  type: object
  required:
  - digest
  - mediaType
  - size
  - tags
  properties:
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    mediaType:
      type: string
    size:
      type: integer
      format: int64
      minimum: 0
    tags:
      type: array
      items:
        type: string
    subjectDigest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    artifactType:
      type: string
OCIManifestSummaryPage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/OCIManifestSummary"
    nextPageToken:
      type: string
MavenCoordinate:
  type: object
  required:
  - coordinate
  - digest
  - createdAt
  properties:
    coordinate:
      type: string
    digest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    createdAt:
      type: string
      format: date-time
    publisher:
      type: string
      description: Publisher actor of the most recent committed publish session
        for this coordinate. Empty when no publish session was recorded (for
        example replicated or pre-session artifacts).
    buildNumber:
      type: integer
      description: Snapshot build number. Zero for release coordinates; one or
        greater for each published build of a SNAPSHOT coordinate.
MavenCoordinatePage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/MavenCoordinate"
    nextPageToken:
      type: string
ConanReference:
  type: object
  required:
  - reference
  properties:
    reference:
      type: string
      minLength: 1
    publisher:
      type: string
      description: Publisher actor of the most recent committed publish session
        for this reference. Empty when no publish session was recorded (for
        example replicated or pre-session artifacts).
ConanReferencePage:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        "$ref": "#/ConanReference"
    nextPageToken:
      type: string
ConanRecipeRevision:
  type: object
  required: [reference, revision, digest, state, createdAt]
  properties:
    reference: {type: string}
    revision: {type: string}
    digest: {type: string}
    state: {type: string, enum: [visible, deleted]}
