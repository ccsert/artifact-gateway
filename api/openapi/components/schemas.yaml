    inReleaseDigest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    signerIdentity:
      type: string
    keyFingerprint:
      type: string
    signatureAlgorithm:
      type: string
    createdAt:
      type: string
      format: date-time
    publishedAt:
      type: string
      format: date-time
RepositoryPage:
