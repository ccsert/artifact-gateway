        "$ref": "#/RawDirectoryEntry"
Deletion:
  type: object
  required:
  - id
  - state
  properties:
    id:
      type: string
      format: uuid
    state:
      type: string
      const: pending
WebhookEventType:
  type: string
  enum:
  - artifact.quarantined
  - artifact.released
WebhookSubscription:
  type: object
  required: [id, name, endpointUrl, eventTypes, enabled, version, secretConfigured, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    name: {type: string, minLength: 1, maxLength: 128}
    endpointUrl: {type: string, format: uri, maxLength: 2048}
    eventTypes:
      type: array
      minItems: 1
      uniqueItems: true
      items: {"$ref": "#/WebhookEventType"}
    enabled: {type: boolean}
    version: {type: string}
    secretConfigured: {type: boolean}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
CreateWebhookSubscription:
  type: object
  required: [name, endpointUrl, secret, eventTypes, enabled]
  properties:
    name: {type: string, minLength: 1, maxLength: 128}
    endpointUrl: {type: string, format: uri, maxLength: 2048}
    secret: {type: string, minLength: 32, maxLength: 256, writeOnly: true}
    eventTypes:
      type: array
      minItems: 1
      uniqueItems: true
      items: {"$ref": "#/WebhookEventType"}
    enabled: {type: boolean}
UpdateWebhookSubscription:
  type: object
  required: [name, endpointUrl, eventTypes, enabled]
  properties:
    name: {type: string, minLength: 1, maxLength: 128}
    endpointUrl: {type: string, format: uri, maxLength: 2048}
    secret: {type: string, minLength: 32, maxLength: 256, writeOnly: true}
    eventTypes:
      type: array
      minItems: 1
      uniqueItems: true
      items: {"$ref": "#/WebhookEventType"}
    enabled: {type: boolean}
WebhookSubscriptionList:
  type: array
  items: {"$ref": "#/WebhookSubscription"}
WebhookDeliveryState:
  type: string
  enum: [pending, delivering, retrying, succeeded, dead]
WebhookDelivery:
  type: object
  required: [id, eventId, eventType, subscriptionId, state, attempts, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    eventId: {type: string, format: uuid}
    eventType: {"$ref": "#/WebhookEventType"}
    subscriptionId: {type: string, format: uuid}
    state: {"$ref": "#/WebhookDeliveryState"}
    attempts: {type: integer, minimum: 0, maximum: 8}
    nextAttemptAt: {type: string, format: date-time}
    lastStatus: {type: integer, minimum: 100, maximum: 599}
    lastError: {type: string, maxLength: 1024}
    deliveredAt: {type: string, format: date-time}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
WebhookDeliveryList:
  type: array
  items: {"$ref": "#/WebhookDelivery"}
Problem:
  type: object
  required:
  - type
  - title
  - status
  - code
  - message
  - requestId
  properties:
    type:
      type: string
      format: uri-reference
    title:
      type: string
    status:
      type: integer
    code:
      type: string
      enum:
      - invalid_request
      - invalid_state
      - encryption_key_unavailable
      - invalid_page_token
      - name_exists
      - access_denied
      - not_found
      - version_conflict
      - idempotency_conflict
      - coordinate_exists
      - session_closed
      - digest_mismatch
      - identity_mismatch
      - quota_exceeded
      - unsupported_media_type
      - retention_protected
      - security_policy_denied
      - artifact_quarantined
      - signer_unavailable
      - internal_error
    message:
      type: string
    requestId:
      type: string
CreateAPTPublicationSession:
  type: object
  additionalProperties: false
  required:
  - suite
  - component
  - objectName
  - declaredDigest
  - declaredSize
  properties:
    suite:
      type: string
      pattern: "^[a-z0-9][a-z0-9+.-]{0,127}$"
    component:
      type: string
      pattern: "^[a-z0-9][a-z0-9+.-]{0,127}$"
    objectName:
      type: string
      minLength: 5
      maxLength: 255
      pattern: "^[^/]+[.]deb$"
    declaredDigest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    declaredSize:
      type: integer
      format: int64
      minimum: 1
      maximum: 1073741824
    expectedIdentity:
      type: string
      maxLength: 1024
APTPublicationSession:
  type: object
  additionalProperties: false
  required:
  - id
  - repositoryId
  - suite
  - component
  - publisher
  - objectName
  - declaredDigest
  - declaredSize
  - state
  - expiresAt
  - createdAt
  properties:
    id:
      type: string
      format: uuid
    repositoryId:
      type: string
      format: uuid
    suite:
      type: string
    component:
      type: string
    publisher:
      type: string
    objectName:
      type: string
    declaredDigest:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
    declaredSize:
      type: integer
      format: int64
    expectedIdentity:
      type: string
    packageRevisionId:
      type: string
      format: uuid
    state:
      type: string
      enum:
      - open
      - uploading
      - staged
      - aborted
    expiresAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
APTPackageRevision:
