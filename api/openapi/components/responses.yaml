---
Problem:
  description: Problem response
  content:
    application/problem+json:
      schema:
        "$ref": "../components/schemas.yaml#/Problem"
FormatProfileList:
  description: Supported artifact formats and management capabilities
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/FormatProfileList"
RuntimeNodeList:
  description: Gateway runtime node inventory and capabilities
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RuntimeNodeList"
Diagnostics:
  description: Sanitized runtime and dependency diagnostics for administrators
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/Diagnostics"
APIKey:
  description: Revocable API key metadata
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/APIKey"
APIKeyList:
  description: API key metadata
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/APIKeyList"
CreatedAPIKey:
  description: Newly generated API key. The plaintext token is returned only by this response.
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/CreatedAPIKey"
User:
  description: User account metadata. The password hash is never returned.
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/User"
UserList:
  description: User account metadata
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/UserList"
BinaryObject:
  description: Committed immutable protocol object
  content:
    application/octet-stream:
      schema:
        type: string
        contentEncoding: binary
OCIManifest:
  description: Committed OCI manifest, returned with Docker-Content-Digest
  headers:
    Docker-Content-Digest:
      required: true
      schema:
        type: string
        pattern: "^sha256:[a-f0-9]{64}$"
  content:
    application/vnd.oci.image.manifest.v1+json:
      schema:
        type: object
    application/vnd.oci.image.index.v1+json:
      schema:
        type: object
OCIUploadAccepted:
  description: Registry V2 upload in progress
  headers:
    Location:
      required: true
      schema:
        type: string
    Docker-Upload-UUID:
      required: true
      schema:
        type: string
        format: uuid
    Range:
      schema:
        type: string
OCITagList:
  description: OCI tag list ordered lexicographically. A Link header with rel=next
    is returned when more tags are available.
  headers:
    Link:
      schema:
        type: string
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/OCITagList"
OCIError:
  description: OCI Registry error response
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/OCIError"
BasicUnauthorized:
  description: Native protocol Basic authentication required when anonymous read policy
    is disabled
  headers:
    WWW-Authenticate:
      required: true
      schema:
        type: string
        pattern: "^Basic "
OCIUnauthorized:
  description: OCI Bearer authentication challenge
  headers:
    WWW-Authenticate:
      required: true
      schema:
        type: string
        pattern: "^Bearer "
ProtocolNotFound:
  description: No committed object is addressable at this protocol path
Repository:
  description: Repository
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/Repository"
EgressProxyTest:
  description: Egress proxy connection test result
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/EgressProxyTestResult"
RepositoryList:
  description: Repository page
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RepositoryPage"
Group:
  description: Group
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/Group"
GroupList:
  description: Group page
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/GroupPage"
MemberList:
  description: Members
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/MemberList"
GrantList:
  description: Grants
  headers:
    ETag:
      required: true
      schema:
        type: string
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/GrantList"
RepositoryGrantRecordList:
  description: Repository grants across all repositories
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RepositoryGrantRecordList"
AuthorizationTemplate:
  description: Reusable repository grant template
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/AuthorizationTemplate"
AuthorizationTemplateList:
  description: Reusable repository grant templates
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/AuthorizationTemplateList"
AuthorizationRole:
  description: Reusable repository permission role
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/AuthorizationRole"
AuthorizationRoleList:
  description: Reusable repository permission roles
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/AuthorizationRoleList"
ArtifactIntelligence:
  description: Security, build provenance, license, and vulnerability metadata for one immutable artifact identity
  headers:
    ETag:
      required: true
      schema: {type: string}
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/ArtifactIntelligence"
ArtifactQuarantine:
  description: Versioned quarantine state for one immutable distribution anchor; Conan uses the recipe revision and its package closure.
  headers:
    ETag:
      description: Current quarantine version. Supply this value in If-Match when replacing the state.
      required: true
      schema: {type: string}
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/ArtifactQuarantine"
RetentionPolicy:
  description: Retention policy
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RetentionPolicy"
SecurityPolicy:
  description: Repository security admission policy
  headers:
    ETag:
      required: true
      schema: {type: string}
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/SecurityPolicy"
QuarantineReadPolicy:
  description: Repository quarantine read policy
  headers:
    ETag:
      required: true
      schema: {type: string}
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/QuarantineReadPolicy"
WebhookSubscription:
  description: Webhook subscription with signing secret redacted
  headers:
    ETag:
      required: true
      schema: {type: string}
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/WebhookSubscription"}
WebhookSubscriptionList:
  description: Webhook subscriptions
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/WebhookSubscriptionList"}
WebhookDelivery:
  description: Durable webhook delivery state
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/WebhookDelivery"}
WebhookDeliveryList:
  description: Recent webhook deliveries
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/WebhookDeliveryList"}
SecurityPolicyEvaluation:
  description: Security admission evaluation for an immutable artifact
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/SecurityPolicyEvaluation"
AuditRetentionPolicy:
  description: Global audit retention policy
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/AuditRetentionPolicy"}
AnonymousAccessPolicy:
  description: Global anonymous protocol-read policy
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/AnonymousAccessPolicy"}
OIDCSettings:
  description: Effective runtime OIDC authentication settings with credentials redacted
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/OIDCSettings"}
OIDCConnectionTest:
  description: OIDC discovery connectivity result
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/OIDCConnectionTest"}
UserIdentityList:
  description: External identities linked to a local user
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/UserIdentityList"}
UserIdentity:
  description: External identity linked to a local user
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/UserIdentity"}
UserSession:
  description: Server-side metadata for one signed user session
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/UserSession"}
UserSessionList:
  description: User session metadata without bearer tokens
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/UserSessionList"}
AuditCleanupJob:
  description: Audit cleanup job
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/AuditCleanupJob"}
AuditCleanupJobList:
  description: Audit cleanup jobs, newest first
  content:
    application/json:
      schema:
        type: array
        items: {"$ref": "../components/schemas.yaml#/AuditCleanupJob"}
RepositoryCapacity:
  description: Logical repository capacity and configured quota
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RepositoryCapacity"
RepositoryCapacityList:
  description: Logical capacity snapshots across all repositories
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RepositoryCapacityList"
GroupCapacity:
  description: Logical capacity contribution from Group members.
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/GroupCapacity"
CurrentIdentity:
  description: Safe authentication source and global-role explanation for the caller
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/CurrentIdentity"
RepositoryEffectiveAccess:
  description: Effective repository access decisions for the authenticated actor and anonymous read policy
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RepositoryEffectiveAccess"
RetentionDryRun:
  description: Repository retention candidates without state changes
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RetentionDryRun"
    text/csv:
      schema:
        type: string
LifecycleJobList:
  description: Lifecycle jobs for one repository, newest first
  content:
    application/json:
      schema:
        type: array
        items:
          "$ref": "../components/schemas.yaml#/LifecycleJob"
RepositoryLifecycleJobList:
  description: Lifecycle jobs across all repositories, newest first
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RepositoryLifecycleJobList"
ArtifactTombstoneList:
  description: Tombstoned artifacts for one repository
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/ArtifactTombstonePage"
RepositoryCapabilities:
  description: Operations supported by a Hosted repository format
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RepositoryCapabilities"
PublishSession:
  description: Publish session
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/PublishSession"
Artifact:
  description: Artifact
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/Artifact"
ArtifactList:
  description: Artifact page
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/ArtifactPage"
ArtifactSummaryList:
  description: Format-aware artifact browse/search page
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/ArtifactSummaryPage"
OCIImageList:
  description: OCI image-name projection page
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/OCIImagePage"
OCIManifestSummaryList:
  description: Visible OCI manifests for one image, including untagged digests
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/OCIManifestSummaryPage"
MavenCoordinateList:
  description: Maven committed-coordinate projection page
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/MavenCoordinatePage"
ConanReferenceList:
  description: Conan visible recipe-reference projection page
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/ConanReferencePage"
ConanRecipeRevisionList:
  description: Conan recipe revisions for one reference
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/ConanRecipeRevisionList"}
ConanPackageRevisionList:
  description: Conan package revisions for one package ID
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/ConanPackageRevisionList"}
ConanPackageIdList:
  description: Conan package IDs for one recipe revision
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/ConanPackageIdList"}
ProxyCacheBrowsePage:
  description: Maven Proxy cache browse page
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/ProxyCacheBrowsePage"}
ProxyCacheInvalidateResult:
  description: Number of invalidated positive cache indexes
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/ProxyCacheInvalidateResult"}
ProxyCacheNegativeClearResult:
  description: Number of cleared negative cache indexes
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/ProxyCacheNegativeClearResult"}
MavenCacheRefreshResult:
  description: Maven Proxy cache refresh result
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/MavenCacheRefreshResult"}
MavenProxyHealth:
  description: Maven Proxy upstream health
  content:
    application/json:
      schema: {"$ref": "../components/schemas.yaml#/MavenProxyHealth"}
RawDirectoryList:
  description: Lexicographically ordered Native Raw directory-prefix page
  headers:
    Link:
      schema:
        type: string
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/RawDirectoryPage"
Deletion:
  description: Accepted asynchronous deletion. The repository is immediately unavailable to protocol traffic and is finalized by the background deletion worker; audit metadata is retained.
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/Deletion"
AuditList:
  description: Administrative audit records, ordered newest first
  content:
    application/json:
      schema:
        "$ref": "../components/schemas.yaml#/AuditList"
