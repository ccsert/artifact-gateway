---
repositories_repositoryId_conan_references:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listConanReferences
    description: Lists visible Conan recipe references in lexical order. The optional q parameter is a reference prefix used for browse and search.
    parameters:
    - "$ref": "../components/parameters.yaml#/ConanReferencePrefix"
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200':
        "$ref": "../components/responses.yaml#/ConanReferenceList"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_conan_recipe_revisions:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listConanRecipeRevisions
    description: Lists visible recipe revisions for one Conan reference in lexical order. Results can be filtered by revision ID or digest and paged with an opaque token.
    parameters:
    - name: reference
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - "$ref": "../components/parameters.yaml#/ConanRevisionQuery"
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200': {"$ref": "../components/responses.yaml#/ConanRecipeRevisionList"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
repositories_repositoryId_conan_package_revisions:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listConanPackageRevisions
    parameters:
    - name: reference
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: recipeRevision
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: packageId
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200': {"$ref": "../components/responses.yaml#/ConanPackageRevisionList"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
repositories_repositoryId_conan_package_ids:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listConanPackageIds
    parameters:
    - name: reference
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: recipeRevision
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200': {"$ref": "../components/responses.yaml#/ConanPackageIdList"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
repositories_repositoryId_conan_package_revisions_revision:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - name: revision
    in: path
    required: true
    schema: {type: string, minLength: 1, maxLength: 255}
  delete:
    operationId: deleteConanPackageRevision
    parameters:
    - name: reference
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: recipeRevision
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: packageId
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '204': {description: Package revision tombstoned}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
repositories_repositoryId_conan_publish_sessions:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  post:
    operationId: createConanPublishSession
    description: >
      Opens a one-hour Hosted Conan recipe or package publication under exact
      repository resource write permission. Requires official lowercase 32-hex
      RREV/PREV, a 40-hex package ID for packages, and the complete supported
      manifest asset set. Uses the same content and identity validation as
      native publication; no revision or file is visible before commit.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateConanPublishSession"
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '201':
        "$ref": "../components/responses.yaml#/PublishSession"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
conan_publish_sessions_sessionId:
  parameters:
  - "$ref": "../components/parameters.yaml#/SessionId"
  get:
    operationId: getConanPublishSession
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200':
        "$ref": "../components/responses.yaml#/PublishSession"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
conan_publish_sessions_sessionId_objects_objectName:
  parameters:
  - "$ref": "../components/parameters.yaml#/SessionId"
  - name: objectName
    in: path
    required: true
    schema:
      type: string
      pattern: '^(conanfile\.py|conan_export\.tgz|conan_sources\.tgz|conanmanifest\.txt|conaninfo\.txt|conan_package\.tgz)$'
  put:
    operationId: uploadConanPublishObject
    description: >
      Verifies the declared size and SHA-256, writes a fresh immutable staging
      key and atomically advances the open session's versioned object pointer.
      This does not make the file visible. Only declared supported filenames
      are accepted; the management endpoint cannot modify a native session.
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '204':
        description: Verified and staged
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
conan_publish_sessions_sessionId_commit:
  parameters:
  - "$ref": "../components/parameters.yaml#/SessionId"
  post:
    operationId: commitConanPublishSession
    description: >
      Reads back the complete staged snapshot and applies the same bounded
      asset, manifest MD5 tree, RREV/PREV and package-ID validation as native
      publication. A session version fence rejects concurrent pointer changes.
      One transaction makes the immutable revision visible, marks the session
      committed and writes a publish audit for the actual commit caller.
      Validation, quota or storage failure leaves the revision invisible;
      incomplete legacy declarations cannot bypass this boundary. This
      endpoint cannot commit a native session.
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200':
        "$ref": "../components/responses.yaml#/ConanPublishCommit"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
      '507':
        "$ref": "../components/responses.yaml#/Problem"
