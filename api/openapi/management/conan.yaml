---
repositories_repositoryId_conan_references:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listConanReferences
    description: Lists visible Conan recipe references in lexical order. The optional q parameter is a reference prefix used for browse and search.
    parameters:
    - "$ref": "../components/parameters.yaml#/ConanReferencePrefix"
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200':
        "$ref": "../components/responses.yaml#/ConanReferenceList"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_conan_recipe_revisions:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listConanRecipeRevisions
    description: Lists visible recipe revisions for one Conan reference in lexical order. Results can be filtered by revision ID or digest and paged with an opaque token.
    parameters:
    - name: reference
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - "$ref": "../components/parameters.yaml#/ConanRevisionQuery"
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200': {"$ref": "../components/responses.yaml#/ConanRecipeRevisionList"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
repositories_repositoryId_conan_package_revisions:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listConanPackageRevisions
    parameters:
    - name: reference
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: recipeRevision
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: packageId
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200': {"$ref": "../components/responses.yaml#/ConanPackageRevisionList"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
repositories_repositoryId_conan_package_ids:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listConanPackageIds
    parameters:
    - name: reference
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: recipeRevision
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200': {"$ref": "../components/responses.yaml#/ConanPackageIdList"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
repositories_repositoryId_conan_package_revisions_revision:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - name: revision
    in: path
    required: true
    schema: {type: string, minLength: 1, maxLength: 255}
  delete:
    operationId: deleteConanPackageRevision
    parameters:
    - name: reference
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: recipeRevision
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: packageId
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '204': {description: Package revision tombstoned}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
repositories_repositoryId_conan_publish_sessions:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  post:
    operationId: createConanPublishSession
    description: Opens a one-hour Conan publish session for a recipe revision or a package revision of a Hosted Conan repository. Declared objects are uploaded and verified individually, and the revision becomes visible only on commit.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateConanPublishSession"
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '201':
        "$ref": "../components/responses.yaml#/PublishSession"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
conan_publish_sessions_sessionId:
  parameters:
  - "$ref": "../components/parameters.yaml#/SessionId"
  get:
    operationId: getConanPublishSession
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200':
        "$ref": "../components/responses.yaml#/PublishSession"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
conan_publish_sessions_sessionId_objects_objectName:
  parameters:
  - "$ref": "../components/parameters.yaml#/SessionId"
  - name: objectName
    in: path
    required: true
    schema:
      type: string
      pattern: "^[^/]+$"
  put:
    operationId: uploadConanPublishObject
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '204':
        description: Verified and staged
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
conan_publish_sessions_sessionId_commit:
  parameters:
  - "$ref": "../components/parameters.yaml#/SessionId"
  post:
    operationId: commitConanPublishSession
    responses:
      '501':
        "$ref": "../components/responses.yaml#/Problem"
      '200':
        "$ref": "../components/responses.yaml#/ConanPublishCommit"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
      '507':
        "$ref": "../components/responses.yaml#/Problem"
