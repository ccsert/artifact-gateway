---
service_accounts:
  get:
    operationId: listServiceAccounts
    parameters:
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccountList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createServiceAccount
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateServiceAccount"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/ServiceAccount"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"

service_accounts_serviceAccountId:
  put:
    operationId: updateServiceAccount
    parameters:
    - name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/UpdateServiceAccount"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccount"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"

service_accounts_serviceAccountId_credentials:
  parameters:
  - name: serviceAccountId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: listServiceAccountCredentials
    parameters:
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccountCredentialList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createServiceAccountCredential
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateServiceAccountCredential"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/CreatedServiceAccountCredential"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"

service_accounts_serviceAccountId_credentials_credentialId:
  delete:
    operationId: revokeServiceAccountCredential
    parameters:
    - name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccountCredential"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
