---
repositories:
  get:
    operationId: listRepositories
    parameters:
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RepositoryList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createRepository
    parameters:
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateRepository"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/Repository"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
repository_grants:
  get:
    operationId: listRepositoryGrants
    description: Lists repository grant records across all repositories for the administrator console.
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RepositoryGrantRecordList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
authorization_templates:
  get:
    operationId: listAuthorizationTemplates
    responses:
      '200':
        "$ref": "../components/responses.yaml#/AuthorizationTemplateList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createAuthorizationTemplate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/AuthorizationTemplateWritable"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/AuthorizationTemplate"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
authorization_templates_templateId:
  parameters:
  - "$ref": "../components/parameters.yaml#/AuthorizationTemplateId"
  get:
    operationId: getAuthorizationTemplate
    responses:
      '200':
        "$ref": "../components/responses.yaml#/AuthorizationTemplate"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
  put:
    operationId: updateAuthorizationTemplate
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/AuthorizationTemplateWritable"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/AuthorizationTemplate"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
  delete:
    operationId: deleteAuthorizationTemplate
    responses:
      '204':
        description: Authorization template deleted
      '404':
        "$ref": "../components/responses.yaml#/Problem"
authorization_templates_templateId_apply:
  parameters:
  - "$ref": "../components/parameters.yaml#/AuthorizationTemplateId"
  post:
    operationId: applyAuthorizationTemplate
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/ApplyAuthorizationTemplate"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/GrantList"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: getRepository
    responses:
      '200':
        "$ref": "../components/responses.yaml#/Repository"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
  delete:
    operationId: deleteRepository
    responses:
      '202':
        "$ref": "../components/responses.yaml#/Deletion"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
  patch:
    operationId: updateRepository
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/UpdateRepository"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/Repository"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_grants:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listGrants
    responses:
      '200':
        "$ref": "../components/responses.yaml#/GrantList"
  put:
    operationId: replaceGrants
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/GrantList"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/GrantList"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_effective_access:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: getRepositoryEffectiveAccess
    summary: Explain effective repository access, including denied decisions
    description: Without actor, explains the authenticated caller. Administrators may provide actor and an optional simulated global role. Resource evaluates prefix-scoped grants against a concrete artifact coordinate or path.
    parameters:
    - name: actor
      in: query
      schema: {type: string, minLength: 1, maxLength: 512}
    - name: role
      in: query
      schema: {type: string, enum: [reader, writer, admin]}
    - name: resource
      in: query
      schema: {type: string, maxLength: 2048}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RepositoryEffectiveAccess"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_retention_policy:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: getRetentionPolicy
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RetentionPolicy"
  put:
    operationId: replaceRetentionPolicy
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/RetentionPolicy"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RetentionPolicy"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
