# Opt-in Hosted/Proxy/Group preview, outside the public format catalog.
governance:
  parameters:
    - {$ref: '#/repositoryId'}
    - {name: chartName, in: path, required: true, schema: {type: string}}
    - {name: version, in: path, required: true, schema: {type: string}}
  get:
    operationId: getHelmPreviewGovernance
    description: Repository administrator reads retained Hosted or cached Proxy governance, including tombstoned charts. Uncached upstream index entries have no durable governance record.
    responses:
      '200':
        description: Retained chart governance
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewGovernance'}
      '401': {description: Authentication required}
      '403': {description: Repository administrator required}
      '404': {description: No retained publication}
      '503': {description: Preview disabled or storage unavailable}
  post:
    operationId: applyHelmPreviewGovernance
    description: Compare-and-set the immutable digest and governance version. delete creates a retained tombstone; restore and release verify complete original chart/provenance bytes and metadata before relaxing state. An unchanged action at the current version is an unaudited no-op; a stale version conflicts. State and audit commit atomically. Fixed Group authority never falls through to another member.
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewGovernanceChange'}
    responses:
      '200':
        description: Current chart governance
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewGovernance'}
      '400': {description: Invalid action or request}
      '401': {description: Authentication required}
      '403': {description: Repository administrator required}
      '404': {description: No retained publication}
      '409': {description: Digest or governance version conflict}
      '502': {description: Original chart/provenance closure failed verification}
      '503': {description: Preview disabled or storage/audit unavailable}
quarantine_read_policy:
  parameters:
    - {$ref: '#/repositoryId'}
  get:
    operationId: getHelmPreviewQuarantineReadPolicy
    responses:
      '200':
        description: Independent repository quarantine read policy
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewQuarantineReadPolicy'}
      '401': {description: Authentication required}
      '403': {description: Repository administrator required}
      '404': {description: Repository not found}
      '503': {description: Preview disabled or storage unavailable}
  put:
    operationId: replaceHelmPreviewQuarantineReadPolicy
    description: Repository administrator compares the independent policy version. enabled=true blocks quarantined charts in indexes, browse responses and assets. Disabling a previously enabled block first verifies every retained non-tombstoned quarantined closure that would become readable. No-op writes preserve the version and audit count. Tombstones always remain hidden.
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewQuarantineReadPolicyChange'}
    responses:
      '200':
        description: Current independent quarantine read policy
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewQuarantineReadPolicy'}
      '400': {description: Invalid policy request}
      '401': {description: Authentication required}
      '403': {description: Repository administrator required}
      '404': {description: Repository not found}
      '409': {description: Policy version conflict}
      '422': {description: Preview inventory limit prevents complete verification}
      '502': {description: Original chart/provenance closure failed verification}
      '503': {description: Preview disabled or storage/audit unavailable}
groups:
  post:
    operationId: createHelmPreviewGroup
    description: Administrator-only ordered Hosted/Proxy view. Direct members only; nested Groups and cycles are rejected. The first selected chart identity is durably bound to one source.
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewGroupInput'}
    responses:
      '201':
        description: Created preview Group
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewGroup'}
      '400': {description: "Invalid name, members, nested Group or cycle"}
      '401': {description: "Authentication required"}
      '403': {description: "Administrator required"}
      '409': {description: "Name or member configuration conflict"}
      '503': {description: "Preview disabled or Group storage unavailable"}
group:
  parameters:
    - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
  get:
    operationId: getHelmPreviewGroup
    responses:
      '200':
        description: Current ordered preview Group
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewGroup'}
      '401': {description: "Authentication required"}
      '403': {description: "Group read permission required"}
      '404': {description: "Preview Group not found"}
      '503': {description: "Preview disabled or Group storage unavailable"}
  put:
    operationId: replaceHelmPreviewGroup
    description: Atomically replaces direct members using the current Group version. Reordering does not change existing chart source authorities or bypass an unavailable bound source.
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewGroupReplace'}
    responses:
      '200':
        description: Updated ordered preview Group
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewGroup'}
      '400': {description: "Invalid members or missing version"}
      '401': {description: "Authentication required"}
      '403': {description: "Administrator required"}
      '404': {description: "Preview Group not found"}
      '409': {description: "Group version or member configuration conflict"}
      '503': {description: "Preview disabled or Group storage unavailable"}
source:
  parameters:
    - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: chartName, in: path, required: true, schema: {type: string}}
    - {name: version, in: path, required: true, schema: {type: string}}
  get:
    operationId: getHelmPreviewSource
    description: Explains the existing immutable chart authority without fetching an index or downloading assets. Resource read authorization applies to the Group and its bound Repository.
    responses:
      '200':
        description: Fixed source and verified cache status
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewSource'}
      '401': {description: "Authentication required"}
      '403': {description: "Source read permission required"}
      '404': {description: "Chart authority not bound"}
      '409': {description: "Bound source configuration changed"}
      '503': {description: "Preview disabled or source state unavailable"}
repositories:
  post:
    operationId: createHelmPreviewRepository
    parameters:
      - {$ref: '#/helmPreviewIdempotencyKey'}
    description: Create an explicitly enabled Helm Hosted or Proxy preview. Requires administrator permission; excluded from the public format catalog. Proxy sources require an explicit HTTPS index URL, allowlisted assets and independently sealed upstream credentials.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/helm-preview.yaml#/HelmPreviewRepositoryCreate
    responses:
      '201':
        description: Created or identical idempotent replay
        content:
          application/json:
            schema:
              $ref: ../components/helm-preview.yaml#/HelmPreviewRepository
      '400':
        description: >-
          Invalid name or body
      '401':
        description: >-
          Authentication required
      '403':
        description: >-
          Administrator required
      '409':
        description: >-
          Name or idempotency conflict
      '503':
        description: >-
          Preview disabled or storage unavailable
repository:
  parameters:
    - {$ref: '#/repositoryId'}
  get:
    operationId: getHelmPreviewRepository
    responses:
      '200':
        description: Helm preview repository, redacted source configuration and index URL
        content:
          application/json:
            schema:
              $ref: ../components/helm-preview.yaml#/HelmPreviewRepository
      '401':
        description: >-
          Authentication required
      '403':
        description: >-
          Repository read permission required
      '404':
        description: >-
          Preview repository not found
      '503':
        description: >-
          Preview disabled or unavailable
  put:
    operationId: replaceHelmPreviewRepository
    description: Replace explicit source configuration using its current version. A changed source requires fresh credentials or explicit none; old immutable source bindings are never silently reused.
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewRepositoryReplace'}
    responses:
      '200':
        description: Updated preview repository
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewRepository'}
      '400': {description: "Invalid source or missing fresh credential"}
      '401': {description: "Authentication required"}
      '403': {description: "Administrator required"}
      '404': {description: "Preview repository not found"}
      '409': {description: "Repository configuration version changed"}
      '503': {description: "Preview disabled or storage unavailable"}
charts:
  parameters:
    - {$ref: '#/repositoryId'}
  get:
    operationId: listHelmPreviewCharts
    description: Single consistent snapshot of at most 4096 chart entries, filtered by chart resource grants. Cold Proxy entries contain index metadata with cached=false and omit unknown byte counts and provenance. An inventory exceeding the preview bound fails explicitly.
    responses:
      '200':
        description: Index identities and download locations, with verified byte counts and provenance only for complete cached closures
        content:
          application/json:
            schema:
              $ref: ../components/helm-preview.yaml#/HelmPreviewChartList
      '401':
        description: >-
          Authentication required
      '403':
        description: >-
          Repository read permission required
      '404':
        description: >-
          Preview repository not found
      '422':
        description: >-
          Preview inventory exceeds its bound
      '503':
        description: >-
          Preview disabled or unavailable
chart:
  parameters:
    - {$ref: '#/repositoryId'}
    - name: chartName
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
    - name: version
      in: path
      required: true
      schema: {type: string, maxLength: 256}
  get:
    operationId: getHelmPreviewChart
    responses:
      '200':
        description: Chart identity, explicit cache state and download locations; unknown byte counts and provenance are omitted for cold metadata
        content:
          application/json:
            schema:
              $ref: ../components/helm-preview.yaml#/HelmPreviewChart
      '401':
        description: >-
          Authentication required
      '403':
        description: >-
          Chart read permission required
      '404':
        description: >-
          Chart not found
      '503':
        description: >-
          Preview disabled or unavailable
  put:
    operationId: publishHelmPreviewChart
    parameters:
      - {$ref: '#/helmPreviewIdempotencyKey'}
    description: >-
      Gateway-specific publication API, not a native helm push or ChartMuseum endpoint.
      Upload one chart and optional provenance as a single immutable closure. Chart.yaml name/version
      must equal the path; chart filename must be name-version.tgz and provenance name-version.tgz.prov.
      The provenance must contain the same chart metadata and full chart SHA-256; publisher trust is
      verified separately by Helm using a consumer-owned public keyring. Gateway does not import
      private keys or assert signature trust. Exact closure replay is idempotent; changing chart,
      provenance or its absence returns 409. Objects are read back and verified before transaction
      commit. Pending uploads never appear in the index.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [chart]
            properties:
              chart: {type: string, format: binary, contentEncoding: binary, description: 'A bounded tar.gz chart; maximum 64 MiB compressed, 256 MiB expanded across packaged dependencies, 10000 total entries and at most 8 nested packaged dependencies'}
              provenance: {type: string, format: binary, contentEncoding: binary, description: 'Optional original OpenPGP clearsigned Helm provenance, maximum 1 MiB'}
    responses:
      '201':
        description: Complete chart closure committed or identical replay
        content:
          application/json:
            schema:
              $ref: ../components/helm-preview.yaml#/HelmPreviewChart
      '400':
        description: >-
          Invalid archive, provenance, identity, multipart body or filename
      '401':
        description: >-
          Authentication required
      '403':
        description: >-
          Chart write permission required
      '404':
        description: >-
          Hosted preview repository not found
      '405':
        description: Proxy and Group do not accept publication
      '409':
        description: >-
          Immutable closure, pending owner or quota conflict
      '410':
        description: >-
          Upload reservation expired before publication
      '413':
        description: >-
          Compressed chart or provenance exceeds its bound
      '503':
        description: >-
          Preview disabled, incomplete object read-back or storage unavailable
capacity:
  parameters:
    - {$ref: '#/repositoryId'}
  get:
    operationId: getHelmPreviewCapacity
    responses:
      '200':
        description: Committed chart and provenance size and repository quota
        content:
          application/json:
            schema:
              $ref: ../components/helm-preview.yaml#/HelmPreviewCapacity
      '401':
        description: >-
          Authentication required
      '403':
        description: >-
          Repository read permission required
      '404':
        description: >-
          Preview repository not found
      '503':
        description: >-
          Preview disabled or unavailable
  put:
    operationId: replaceHelmPreviewQuota
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [quotaBytes]
            properties:
              quotaBytes: {type: integer, format: int64, minimum: 0}
    responses:
      '200':
        description: Updated quota, zero means unlimited
        content:
          application/json:
            schema:
              $ref: ../components/helm-preview.yaml#/HelmPreviewCapacity
      '400':
        description: >-
          Invalid quota
      '401':
        description: >-
          Authentication required
      '403':
        description: >-
          Repository admin permission required
      '404':
        description: >-
          Preview repository not found
      '503':
        description: >-
          Preview disabled or unavailable
repositoryId:
  name: repositoryId
  in: path
  required: true
  schema: {type: string, format: uuid}
helmPreviewIdempotencyKey:
  name: Idempotency-Key
  in: header
  required: false
  description: Actor-scoped replay key. An expired publication reservation requires a new key; exact closure replay without a key is also safe.
  schema: {type: string, minLength: 1, maxLength: 200}

replication_jobs:
  post:
    operationId: createHelmPreviewReplicationJob
    description: >-
      Creates a bounded, durable Hosted-to-Hosted replication plan. This default-disabled preview
      fixes strict chart identities, complete chart/provenance SHA-256 and sizes, and source governance versions.
      Provenance digest/size must both describe the same optional closure (empty/zero when absent). Each chart commits
      atomically; a failed batch retains completed items. No credentials, source object keys, Proxy or
      Group targets are accepted. The current durable actor, source read and target write authority,
      governance and capacity are checked again by the worker at publication.
    parameters:
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewReplicationRequest'}
    responses:
      '202':
        description: Queued plan, or the same plan on an exact idempotent replay
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewReplicationJob'}
      '400': {description: "Invalid or duplicate chart identity, unbounded plan or key"}
      '401': {description: "Authentication required"}
      '403': {description: "Current source read and target write authority required"}
      '404': {description: "Active Helm Hosted repository or exact source chart not found"}
      '409': {description: "Different plan for the key, source governance changed, conflict or capacity denied"}
      '503': {description: "Preview disabled or durable replication unavailable"}
replication_job:
  parameters:
    - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
  get:
    operationId: getHelmPreviewReplicationJob
    description: Returns exact item results; current read authority on both repositories is required.
    responses:
      '200':
        description: Durable job and chart checkpoints without secrets or physical object keys
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewReplicationJob'}
      '401': {description: "Authentication required"}
      '403': {description: "Source and target read authority required"}
      '404': {description: "Job not found"}
      '503': {description: "Preview disabled or durable replication unavailable"}
replication_retry:
  parameters:
    - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
  post:
    operationId: retryHelmPreviewReplicationJob
    description: >-
      The original durable actor can retry explicitly selected failed items of a failed job using
      its current version. Completed items, plan, actor and source pins remain fixed. An exact key
      replay never schedules another attempt. This is chart-level recovery, not a batch rollback.
    parameters:
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewReplicationRetry'}
    responses:
      '202':
        description: Selected failed items queued, or an exact retry replay
        content:
          application/json:
            schema: {$ref: '../components/helm-preview.yaml#/HelmPreviewReplicationJob'}
      '400': {description: "Invalid retry key or item set"}
      '401': {description: "Authentication required"}
      '403': {description: "Original actor with current source read and target write authority required"}
      '404': {description: "Job not found"}
      '409': {description: "Job version, retry payload, state or selected item conflicts"}
      '503': {description: "Preview disabled or durable replication unavailable"}
