---
audits:
  get:
    operationId: listAudits
    description: Lists administrative audit records. Authorization decision fields are
      present only when the record represents a repository authorization decision.
    parameters:
    - name: group
      in: query
      schema:
        type: string
    - name: repository
      in: query
      schema:
        type: string
    - name: outcome
      in: query
      description: Exact audit outcome filter.
      schema:
        type: string
    - name: format
      in: query
      description: Exact artifact format filter.
      schema:
        type: string
    - name: operation
      in: query
      description: Exact HTTP or management operation filter.
      schema:
        type: string
    - name: actor
      in: query
      description: Exact actor or principal filter.
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    responses:
      '200':
        "$ref": "../components/responses.yaml#/AuditList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
audits_page:
  get:
    operationId: listAuditPage
    summary: Lists administrative audit records using a stable cursor
    description: Returns a bounded audit page. The page token is scoped to all filters and expires.
    parameters:
    - name: group
      in: query
      schema:
        type: string
    - name: repository
      in: query
      schema:
        type: string
    - name: outcome
      in: query
      description: Exact audit outcome filter.
      schema:
        type: string
    - name: format
      in: query
      description: Exact artifact format filter.
      schema:
        type: string
    - name: operation
      in: query
      description: Exact HTTP or management operation filter.
      schema:
        type: string
    - name: actor
      in: query
      description: Exact actor or principal filter.
      schema:
        type: string
    - name: from
      in: query
      description: Inclusive lower bound for occurredAt.
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      description: Inclusive upper bound for occurredAt.
      schema:
        type: string
        format: date-time
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        description: Cursor-paginated administrative audit records, ordered newest first.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/AuditPage"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
audit_retention_policy:
  get:
    operationId: getAuditRetentionPolicy
    responses:
      '200': {"$ref": "../components/responses.yaml#/AuditRetentionPolicy"}
  put:
    operationId: replaceAuditRetentionPolicy
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: {"$ref": "../components/schemas.yaml#/AuditRetentionPolicy"}
    responses:
      '200': {"$ref": "../components/responses.yaml#/AuditRetentionPolicy"}
      '412': {"$ref": "../components/responses.yaml#/Problem"}
audit_retention_execute:
  post:
    operationId: executeAuditRetention
    parameters:
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    responses:
      '202': {"$ref": "../components/responses.yaml#/AuditCleanupJob"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}
audit_retention_jobs:
  get:
    operationId: listAuditRetentionJobs
    responses:
      '200': {"$ref": "../components/responses.yaml#/AuditCleanupJobList"}
