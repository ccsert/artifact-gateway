      '404':
        description: Preview resource not found
      '503':
        description: Preview capability unavailable
stage:
  parameters:
    - name: repositoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  put:
    operationId: stageNuGetPublicationSession
    description: Internal NuGet Hosted preview; not a public format admission.
    responses:
      '200':
        description: NuGet Hosted preview response
        content:
          application/json:
            schema:
              $ref: ../components/nuget-preview.yaml#/NuGetPublicationSession
      '400':
        description: Invalid request
      '401':
        description: Authentication required
      '403':
        description: Repository permission required
      '404':
        description: Preview resource not found
      '409':
        description: Identity, session or quota conflict
      '410':
        description: Publication session expired; create a new session with a new idempotency key
      '413':
        description: Package archive exceeds the 256 MiB preview bound
      '503':
        description: Preview capability unavailable
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            contentEncoding: binary
