governance:
  parameters:
    - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: packageId, in: path, required: true, schema: {type: string, minLength: 1}}
    - {name: version, in: path, required: true, schema: {type: string, minLength: 1}}
  get:
    operationId: getNuGetPreviewGovernance
    description: Administrator-only governance evidence for a published or tombstoned cached package. Default-disabled preview; not a formal format admission.
    responses:
      '200':
        description: Current immutable identity and governance version
        content:
          application/json:
            schema: {$ref: '../components/nuget-preview.yaml#/NuGetPreviewGovernance'}
      '401': {description: "Authentication required"}
      '403': {description: "Repository administrator required"}
      '404': {description: "Preview repository or package not found"}
      '503': {description: "Preview disabled or governance unavailable"}
  post:
    operationId: applyNuGetPreviewGovernance
    description: >-
      Changes one exact package identity using its digest and governance compare-and-swap version.
      Unlist affects search visibility while exact-version reads remain available. Tombstones hide
      all native representations and retain bytes for restoration. Quarantine is independent and
      hides reads only when the repository quarantine read policy is enabled. A Group never selects
      a different authority to bypass governance. No physical objects are reclaimed by this operation.
      Proxy operations require an already verified cached package; only Hosted accepts unlist/relist.
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/nuget-preview.yaml#/NuGetPreviewGovernanceRequest'}
    responses:
      '200':
        description: Updated governance evidence
        content:
          application/json:
            schema: {$ref: '../components/nuget-preview.yaml#/NuGetPreviewGovernance'}
      '400': {description: "Invalid governance request or action"}
      '401': {description: "Authentication required"}
      '403': {description: "Repository administrator required"}
      '404': {description: "Preview repository or package not found"}
      '405': {description: "Proxy sources do not permit local unlist or relist"}
      '409': {description: "Package identity or governance version changed"}
      '503': {description: "Preview disabled or governance unavailable"}
quarantine_read_policy:
  parameters:
    - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
  get:
    operationId: getNuGetPreviewQuarantineReadPolicy
    description: Administrator-only preview policy; disabled by default and independent of package quarantine state.
    responses:
      '200':
        description: Versioned quarantine read policy
        content:
          application/json:
            schema: {$ref: '../components/nuget-preview.yaml#/NuGetPreviewQuarantineReadPolicy'}
      '401': {description: "Authentication required"}
      '403': {description: "Repository administrator required"}
      '404': {description: "Preview repository not found"}
      '503': {description: "Preview disabled or policy unavailable"}
  put:
    operationId: replaceNuGetPreviewQuarantineReadPolicy
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/nuget-preview.yaml#/NuGetPreviewQuarantineReadPolicyRequest'}
    responses:
      '200':
        description: Updated quarantine read policy
        content:
          application/json:
            schema: {$ref: '../components/nuget-preview.yaml#/NuGetPreviewQuarantineReadPolicy'}
      '400': {description: "Invalid policy request"}
      '401': {description: "Authentication required"}
      '403': {description: "Repository administrator required"}
      '404': {description: "Preview repository not found"}
      '409': {description: "Policy version changed"}
      '503': {description: "Preview disabled or policy unavailable"}
repositories:
  post:
    operationId: createNuGetPreviewRepository
    description: Internal NuGet preview; not a public format admission.
    responses:
      '201':
        description: NuGet Hosted preview response
        content:
          application/json:
            schema:
              $ref: ../components/nuget-preview.yaml#/NuGetPreviewRepository
      '400':
        description: Invalid request
      '401':
        description: Authentication required
      '403':
        description: Repository permission required
      '409':
        description: Identity, session or quota conflict
      '503':
        description: Preview capability unavailable
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/nuget-preview.yaml#/NuGetPreviewRepositoryCreate
repository:
  parameters:
    - name: repositoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getNuGetPreviewRepository
    description: Internal NuGet preview; not a public format admission.
    responses:
      '200':
        description: NuGet Hosted preview response
        content:
          application/json:
            schema:
              $ref: ../components/nuget-preview.yaml#/NuGetPreviewRepository
      '400':
        description: Invalid request
      '401':
        description: Authentication required
      '403':
        description: Repository permission required
      '404':
        description: Preview resource not found
      '503':
        description: Preview capability unavailable
  put:
    operationId: replaceNuGetPreviewRepository
    description: Replace a preview source using its current version. Source rebinding requires a new secret or explicit none; old cache namespaces are never reused.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/nuget-preview.yaml#/NuGetPreviewRepositoryReplace
    responses:
      '200':
        description: Updated preview source
        content:
          application/json:
            schema:
              $ref: ../components/nuget-preview.yaml#/NuGetPreviewRepository
      '400':
        description: Invalid source or missing fresh credential
      '401':
        description: Authentication required
      '403':
        description: Administrator required
      '404':
        description: Preview repository not found
      '409':
        description: Source configuration version conflict
      '503':
        description: Preview unavailable
