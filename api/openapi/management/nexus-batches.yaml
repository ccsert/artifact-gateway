        }
      }
    },
    "post": {
      "operationId": "startNexusMigrationBatch",
      "description": "Administrators only. Atomically persist immutable source version, mappings and policy. A background worker scans bounded pages using private durable checkpoints; interruption resumes the last committed cursor. A second paged observation must match before the complete manifest is sealed. Incomplete or bounded-out scans never become ready and cannot publish. Source drift or expired cursors require a new batch; REST enumeration is not a transactional source snapshot. Idempotency scope is actor and operation; a reused key with a different body conflicts. Capacity evidence is operator supplied and bound to target, pool and freshness; unknown or insufficient evidence prohibits target writes.",
      "parameters": [
        {
          "name": "Idempotency-Key",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      ],
      "responses": {
        "202": {
          "description": "Durable migration state. ETag carries the current batch version.",
          "headers": {
            "ETag": {
              "schema": {
                "type": "string"
              }
            }
          },
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationBatch"
              }
            }
          }
        },
        "400": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "401": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "403": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "404": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "409": {
