        },
        "422": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "503": {
          "$ref": "../components/responses.yaml#/Problem"
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationStart"
            }
          }
        }
      }
    }
  },
