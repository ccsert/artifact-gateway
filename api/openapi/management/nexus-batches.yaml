  "schemas": {
    "NexusMigrationMapping": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "sourceRepository": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "targetRepositoryId": {
          "type": "string",
          "format": "uuid"
        }
      },
      "required": [
        "sourceRepository",
        "targetRepositoryId"
      ]
    },
    "NexusMigrationCapacityEvidence": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "targetId": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "poolId": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "observedAt": {
          "type": "string",
          "format": "date-time"
        },
        "validUntil": {
          "type": "string",
          "format": "date-time"
        },
        "freeBytes": {
          "type": [
            "integer",
            "null"
          ],
          "format": "int64",
          "minimum": 0
        },
        "downloadBytes": {
          "type": [
            "integer",
            "null"
          ],
          "format": "int64",
          "minimum": 0
        },
        "uploadBytes": {
          "type": [
            "integer",
            "null"
          ],
          "format": "int64",
          "minimum": 0
        },
        "backupBytes": {
          "type": [
            "integer",
            "null"
          ],
          "format": "int64",
          "minimum": 0
        },
        "restoreBytes": {
          "type": [
            "integer",
            "null"
          ],
          "format": "int64",
          "minimum": 0
        },
        "headroomBytes": {
          "type": [
            "integer",
            "null"
          ],
          "format": "int64",
          "minimum": 0
        }
      },
      "required": [
        "targetId",
        "poolId",
        "observedAt",
        "validUntil",
        "freeBytes",
        "downloadBytes",
        "uploadBytes",
        "backupBytes",
        "restoreBytes",
        "headroomBytes"
      ]
    },
    "NexusMigrationStart": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "sourceId": {
          "type": "string",
          "format": "uuid"
        },
        "sourceVersion": {
          "type": "string",
          "pattern": "^[1-9][0-9]*$"
        },
        "mappings": {
          "type": "array",
          "minItems": 1,
          "maxItems": 10,
          "items": {
            "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationMapping"
          }
        },
        "policyVersion": {
          "type": "string",
          "enum": [
            "native-v1"
          ]
        },
        "capacityEvidence": {
          "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationCapacityEvidence"
        }
      },
      "required": [
        "sourceId",
        "sourceVersion",
        "mappings",
        "policyVersion",
        "capacityEvidence"
      ]
    },
    "NexusMigrationResume": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "capacityEvidence": {
          "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationCapacityEvidence"
        }
      },
      "required": [
        "capacityEvidence"
      ]
    },
    "NexusMigrationCounts": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "pending": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "uploaded": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "verified": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "committed": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "skipped": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "conflict": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "failed": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "unsupported": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "sourceMissing": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "sourceDeleted": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        }
      },
      "required": [
        "pending",
        "uploaded",
        "verified",
        "committed",
        "skipped",
        "conflict",
        "failed",
        "unsupported",
        "sourceMissing",
        "sourceDeleted"
      ]
    },
    "NexusMigrationBatch": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "version": {
          "type": "string"
        },
        "sourceId": {
          "type": "string",
          "format": "uuid"
        },
        "sourceVersion": {
          "type": "string"
        },
        "mappings": {
          "type": "array",
          "items": {
            "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationMapping"
          }
        },
        "policyVersion": {
          "type": "string"
        },
        "capacityEvidence": {
          "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationCapacityEvidence"
        },
        "state": {
          "type": "string",
          "enum": [
            "scanning",
            "ready",
            "running",
            "pausing",
            "paused",
            "blocked",
            "completed",
            "failed",
            "cancelled"
          ]
        },
        "manifestSha256": {
          "type": "string"
        },
        "scanComplete": {
          "type": "boolean"
        },
        "metadataDiscovered": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "entryCount": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "totalBytes": {
          "type": [
            "integer",
            "null"
          ],
          "format": "int64",
          "minimum": 0
        },
        "transferredBytes": {
          "type": "integer",
          "format": "int64",
          "minimum": 0,
          "description": "Copy-stage source bytes actually read, including retries and revalidation of existing identities. Separate from pre-copy sourceVerificationBytes; neither counter implies target visibility."
        },
        "verifiedBytes": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "visibleIdentities": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "counts": {
          "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationCounts"
        },
        "lastError": {
          "type": "string"
        },
        "createdAt": {
          "type": "string",
          "format": "date-time"
        },
        "updatedAt": {
          "type": "string",
          "format": "date-time"
        },
        "sourceVerificationBytes": {
          "type": "integer",
          "format": "int64",
          "minimum": 0,
          "description": "Actual source bytes read to fill missing manifest hashes during source verification, separately persisted even if the scan fails. Discovery-provided required hashes avoid this transfer."
        },
        "lastScanFailure": {
          "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationScanFailure"
        }
      },
      "required": [
        "id",
        "version",
        "sourceId",
        "sourceVersion",
        "mappings",
        "policyVersion",
        "capacityEvidence",
        "state",
        "manifestSha256",
        "scanComplete",
        "metadataDiscovered",
        "entryCount",
        "totalBytes",
        "transferredBytes",
        "verifiedBytes",
