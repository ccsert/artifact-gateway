---
repositories_repositoryId_restore:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  post:
    operationId: restoreRepositoryArtifact
    description: >
      Restores a tombstoned identity under Repository admin permission. For npm,
      this reuses the original version, warning, manifest and tarball identity;
      object size/digest and the collection fence are checked before visibility
      returns, and the actor's restore audit commits with metadata. A version
      whose collection has started or whose bytes are missing cannot be restored.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/RestoreArtifact"
    responses:
      '204':
        description: Tombstoned artifact restored
      '409':
        description: Collection has started or retained object bytes are unavailable
        content:
          application/problem+json:
            schema:
              "$ref": "../components/schemas.yaml#/Problem"
