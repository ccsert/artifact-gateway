---
lifecycle_jobs:
  get:
    operationId: listLifecycleJobs
    description: Lists the newest lifecycle jobs across all repositories for the administrator console.
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 500
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RepositoryLifecycleJobList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"

repositories_repositoryId_lifecycle_jobs:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listRepositoryLifecycleJobs
    responses:
      '200':
        "$ref": "../components/responses.yaml#/LifecycleJobList"
      '403':
        "$ref": "../components/responses.yaml#/Problem"

repositories_repositoryId_lifecycle_jobs_reconcile_intelligence:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  post:
    operationId: reconcileRepositoryArtifactIntelligence
    summary: Requeue failed artifact intelligence copy jobs
    description: Requeues up to 100 failed or cancelled intelligence copy jobs
      for this repository. Running, pending, retrying, and completed jobs are
      left unchanged. Candidate selection and state reset are atomic.
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    responses:
      '200':
        description: Reconciliation summary
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/LifecycleJobReconciliation"
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '500': {"$ref": "../components/responses.yaml#/Problem"}

repositories_repositoryId_lifecycle_jobs_lifecycleJobId_run:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/LifecycleJobId"
  post:
    operationId: runRepositoryLifecycleJobNow
    responses:
      '200': {"$ref": "#/components/responses/LifecycleJob"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}

repositories_repositoryId_lifecycle_jobs_lifecycleJobId_retry:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/LifecycleJobId"
  post:
    operationId: retryRepositoryLifecycleJob
    responses:
      '200': {"$ref": "#/components/responses/LifecycleJob"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}

repositories_repositoryId_lifecycle_jobs_lifecycleJobId_cancel:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/LifecycleJobId"
  post:
    operationId: cancelRepositoryLifecycleJob
    responses:
      '200': {"$ref": "#/components/responses/LifecycleJob"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}

components:
  responses:
    LifecycleJob:
      description: Updated lifecycle job
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/LifecycleJob"
