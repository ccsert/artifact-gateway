---
repositories_repositoryId_artifact_intelligence:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - name: coordinate
    in: query
    required: true
    schema: {type: string, minLength: 1, maxLength: 1024}
  - name: digest
    in: query
    required: true
    schema: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
  get:
    operationId: getArtifactIntelligence
    responses:
      '200': {"$ref": "../components/responses.yaml#/ArtifactIntelligence"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
  put:
    operationId: replaceArtifactIntelligence
    parameters:
    - "$ref": "../components/parameters.yaml#/OptionalIfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: {"$ref": "../components/schemas.yaml#/ArtifactIntelligenceWritable"}
    responses:
      '200': {"$ref": "../components/responses.yaml#/ArtifactIntelligence"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '412': {"$ref": "../components/responses.yaml#/Problem"}
