---
groups:
  get:
    operationId: listGroups
    parameters:
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/GroupList"
  post:
    operationId: createGroup
    parameters:
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateGroup"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/Group"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
groups_groupId:
  parameters:
  - "$ref": "../components/parameters.yaml#/GroupId"
  get:
    operationId: getGroup
    responses:
      '200':
        "$ref": "../components/responses.yaml#/Group"
  put:
    operationId: replaceGroup
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/Group"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/Group"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
  delete:
    operationId: deleteGroup
    responses:
      '204':
        description: Deleted
groups_groupId_members:
  parameters:
  - "$ref": "../components/parameters.yaml#/GroupId"
  get:
    operationId: listGroupMembers
    responses:
      '200':
        "$ref": "../components/responses.yaml#/MemberList"
  put:
    operationId: replaceGroupMembers
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/MemberList"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/MemberList"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
    x-gateway-memberConstraints:
    - repositoryId_unique
    - position_contiguous_from_zero
    - repository_format_matches_group
groups_groupId_capacity:
  parameters:
  - "$ref": "../components/parameters.yaml#/GroupId"
  get:
    operationId: getGroupCapacity
    responses:
      '200':
        "$ref": "../components/responses.yaml#/GroupCapacity"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
groups_groupId_resolution:
  parameters:
  - "$ref": "../components/parameters.yaml#/GroupId"
  get:
    operationId: getGroupResolution
    summary: Inspect the server-owned Group member candidate order
    description: Administrative configuration inspection. Uses the protocol resolver's Hosted-first order with configured positions within each type. Missing, inactive and mismatched repositories are excluded. No artifacts or upstreams are queried; this is not a per-artifact hit result or an authorization decision for a particular reader.
    responses:
      '200':
        description: Current eligible member candidates
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/GroupResolution"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"

groups_groupId_browse:
  parameters:
  - "$ref": "../components/parameters.yaml#/GroupId"
  get:
    operationId: browseGroup
    summary: Browse known Maven and Raw Group contributions
    description: >-
      Returns a bounded union of visible Hosted publications and live Proxy cache
      indexes for members the reader can browse. No upstream or object-store scan.
      Sources are local candidates, never a prediction of the next protocol hit.
      Missing cache evidence does not prove an upstream miss. Maven cache records
      fetched only through this Group require the current authorized resolution scope.
      Navigation binds identity, member order, repository configuration and grants.
      Groups with more than 64 configured members are not supported by this endpoint.
    security:
    - bearerAuth: []
    - {}
    parameters:
    - name: parent
      in: query
      schema:
        type: string
        maxLength: 16384
      description: Opaque node ID returned by this Group directory.
    - "$ref": "../components/parameters.yaml#/PageSize"
    - name: pageToken
      in: query
      schema:
        type: string
        maxLength: 16384
      description: Opaque continuation bound to this Group and parent.
    responses:
      '200':
        description: Direct children and authorized candidate order
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/GroupBrowsePage"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '500':
        "$ref": "../components/responses.yaml#/Problem"
