---
repositories_repositoryId_artifacts:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listArtifacts
    parameters:
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ArtifactList"
repositories_repositoryId_artifact_usage:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listRepositoryArtifactUsage
    summary: Get paginated lifecycle download usage aggregated per artifact address
    description: >-
      Returns one live page ordered by resource then format (bytewise ascending).
      Download increments do not reorder addresses. New addresses between requests
      can move offset boundaries; refresh to restart browsing. Items, totalCount
      and whole-repository totals come from one consistent read snapshot.
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    - name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
    - name: q
      in: query
      description: Case-sensitive literal substring of the artifact address. Surrounding whitespace is trimmed; SQL wildcard characters have no special meaning.
      schema: {type: string, maxLength: 512}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RepositoryArtifactUsage"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_artifacts_artifactId:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - name: artifactId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: getArtifact
    responses:
      '200':
        "$ref": "../components/responses.yaml#/Artifact"
  delete:
    operationId: deleteArtifact
    responses:
      '202':
        "$ref": "../components/responses.yaml#/Deletion"
