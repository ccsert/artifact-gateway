---
runtime_nodes:
  get:
    operationId: listRuntimeNodes
    summary: List Gateway runtime nodes and worker capabilities
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RuntimeNodeList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
diagnostics:
  get:
    operationId: getDiagnostics
    summary: Get sanitized runtime and dependency diagnostics
    responses:
      '200':
        "$ref": "../components/responses.yaml#/Diagnostics"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
runtime_logs:
  get:
    operationId: listRuntimeLogs
    summary: Query this process's bounded, redacted runtime log buffer
    description: Results are local to the process and are lost on restart. The response identifies its instance and session; it is not a cluster-wide log query.
    parameters:
    - name: from
      in: query
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      schema:
        type: string
        format: date-time
    - name: windowSeconds
      in: query
      description: Rolling lookback duration in seconds, calculated from one locked query snapshot. Mutually exclusive with from and to. Omitted time bounds default to a rolling hour. Cursors bind this duration; changing it requires a new snapshot.
      schema:
        type: integer
        minimum: 1
        maximum: 86400
    - name: instanceId
      in: query
      schema:
        type: string
    - name: level
      in: query
      schema:
        type: string
    - name: component
      in: query
      schema:
        type: string
    - name: requestId
      in: query
      schema:
        type: string
    - name: traceId
      in: query
      schema:
        type: string
    - name: keyword
      in: query
      schema:
        type: string
    - name: beforeSequence
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: afterCursor
      in: query
      description: Opaque session and filter bound cursor. Mutually exclusive with beforeSequence. Results use ascending sequence order; continue the returned cursor until hasMore is false. An initial reverse page provides a cursor at its snapshot tail for future follow.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RuntimeLogPage"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
      '504':
        "$ref": "../components/responses.yaml#/Problem"
