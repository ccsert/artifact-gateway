  "schemas": {
    "NexusMigrationSchedule": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "version",
        "state",
        "templateBatchId",
        "sourceId",
        "sourceVersion",
        "mappings",
        "policyVersion",
        "intervalSeconds",
        "nextRunAt",
        "lastSuccessfulAt",
        "consumedObservedAt",
        "capacityEvidence",
        "activeBatchId",
        "lastBatchId",
        "lastError",
        "dispatchAttempts",
        "createdAt",
        "updatedAt"
      ],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "version": {
          "type": "string"
        },
        "state": {
          "type": "string",
          "enum": [
            "active",
            "waiting_capacity",
            "paused",
            "blocked",
            "stopped"
          ]
        },
        "templateBatchId": {
          "type": "string",
          "format": "uuid"
        },
        "sourceId": {
          "type": "string",
          "format": "uuid"
        },
        "sourceVersion": {
          "type": "string"
        },
        "mappings": {
          "type": "array",
          "minItems": 1,
          "maxItems": 10,
          "items": {
            "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationMapping"
          }
        },
        "policyVersion": {
          "type": "string",
          "enum": [
            "native-v1"
          ]
        },
        "intervalSeconds": {
          "type": "integer",
          "minimum": 60,
          "maximum": 2592000
        },
        "nextRunAt": {
          "type": [
            "string",
            "null"
          ],
          "format": "date-time"
        },
        "lastSuccessfulAt": {
          "type": [
            "string",
            "null"
          ],
          "format": "date-time",
          "description": "Most recent fully verified batch within the plan-supported native content scope. Exact regenerated Maven metadata remains in original unsupported details and counts; this is not complete-source clearance or client-cutover evidence."
        },
        "consumedObservedAt": {
          "type": [
            "string",
            "null"
          ],
          "format": "date-time"
        },
        "capacityEvidence": {
          "oneOf": [
            {
              "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationCapacityEvidence"
            },
            {
              "type": "null"
            }
          ]
        },
        "activeBatchId": {
          "type": "string"
        },
        "lastBatchId": {
          "type": "string"
        },
        "lastError": {
          "type": "string",
          "maxLength": 128
        },
        "dispatchAttempts": {
          "type": "integer",
          "minimum": 0,
          "maximum": 3
        },
        "createdAt": {
          "type": "string",
          "format": "date-time"
        },
        "updatedAt": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
    "NexusMigrationSchedulePage": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "items",
        "nextCursor"
      ],
      "properties": {
        "items": {
          "type": "array",
          "items": {
            "$ref": "./nexus-schedules.yaml#/schemas/NexusMigrationSchedule"
          }
        },
        "nextCursor": {
          "type": "string"
        }
      }
    },
    "NexusMigrationScheduleCreate": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "templateBatchId",
        "intervalSeconds"
      ],
      "properties": {
        "templateBatchId": {
          "type": "string",
          "format": "uuid"
        },
        "intervalSeconds": {
          "type": "integer",
          "minimum": 60,
          "maximum": 2592000
        },
        "capacityEvidence": {
          "$ref": "./nexus-batches.yaml#/schemas/NexusMigrationCapacityEvidence"
        }
      }
    }
  }
}
