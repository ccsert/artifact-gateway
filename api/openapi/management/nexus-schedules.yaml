          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "refreshNexusMigrationScheduleCapacity",
      "description": "Administrators only. Store one new operator observation, strictly newer than the prior observation. A waiting_capacity schedule becomes active; paused schedules remain paused. If-Match and actor-scoped idempotency are required.",
      "parameters": [
