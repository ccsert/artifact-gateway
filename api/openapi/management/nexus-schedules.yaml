        },
        "503": {
          "$ref": "../components/responses.yaml#/Problem"
        }
      }
    },
    "post": {
      "operationId": "createNexusMigrationSchedule",
      "description": "Administrators only. Freeze the source version, mappings and native policy from a successfully completed batch. Each occurrence fully re-enumerates using the existing durable batch worker. One pending operator capacity observation is consumed once; missing or expired observations cause waiting_capacity. There is no trusted remote object-pool observer. Restart and missed intervals coalesce to one due occurrence; no backlog or browser timer is used. A stopped plan cannot resume. Genuine unsupported payloads, SNAPSHOT, missing required artifacts and source drift reject a template. Exact regenerated Maven metadata may remain as separately reported unsupported entries.",
      "parameters": [
        {
          "name": "Idempotency-Key",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "./nexus-schedules.yaml#/schemas/NexusMigrationScheduleCreate"
            }
          }
        }
      },
      "responses": {
        "201": {
          "description": "Durable administrator-owned migration schedule. ETag is the CAS version.",
          "headers": {
            "ETag": {
              "schema": {
                "type": "string"
              }
            }
          },
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./nexus-schedules.yaml#/schemas/NexusMigrationSchedule"
              }
            }
          }
        },
        "400": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "401": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "403": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "404": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "409": {
          "$ref": "../components/responses.yaml#/Problem"
        },
        "412": {
