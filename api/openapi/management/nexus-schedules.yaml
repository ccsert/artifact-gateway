    "get": {
      "operationId": "listNexusMigrationSchedules",
      "description": "Administrators only. Lists durable schedules; nextRunAt is the next eligible UTC occurrence, not a promise that capacity or a worker is available.",
      "parameters": [
        {
          "name": "limit",
          "in": "query",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 20
          }
        },
        {
          "name": "cursor",
          "in": "query",
          "schema": {
            "type": "string",
            "maxLength": 36
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Durable administrator-owned migration schedule. ETag is the CAS version.",
          "headers": {
            "ETag": {
              "schema": {
                "type": "string"
              }
            }
          },
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./nexus-schedules.yaml#/schemas/NexusMigrationSchedulePage"
              }
