email_preview:
  post:
    operationId: previewEmailNotification
    description: Administrator-only offline preview of a fixed synthetic scenario. Never enqueues or sends mail.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/EmailPreviewInput'
    responses:
      '200':
        description: HTML and equivalent plain text
        content:
          application/json:
            schema:
              $ref: '#/EmailPreview'
      '400':
        $ref: '../components/responses.yaml#/Problem'
      '401':
        $ref: '../components/responses.yaml#/Problem'
      '403':
        $ref: '../components/responses.yaml#/Problem'
EmailPreviewInput:
  type: object
  additionalProperties: false
  required: [scenario, locale]
  properties:
    scenario: {type: string, enum: [warning, critical, resolved]}
    locale: {type: string, enum: [en, zh-CN]}
EmailPreview:
  type: object
  additionalProperties: false
  required: [subject, html, text, templateVersion]
  properties:
    subject: {type: string}
    html: {type: string}
    text: {type: string}
    templateVersion: {type: string}

