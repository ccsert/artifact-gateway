EmailCapability:
  type: object
  additionalProperties: false
  required: [enabled, reason]
  properties:
    enabled: {type: boolean}
    reason: {type: string, enum: [ready, email_disabled, encryption_key_unavailable]}
EmailTargetInput:
  type: object
  additionalProperties: false
  required: [name, locale]
  properties:
    name: {type: string, minLength: 1, maxLength: 128}
    locale: {type: string, enum: [en, zh-CN]}
    enabled: {type: boolean, default: false}
    recipient: {type: string, maxLength: 254, writeOnly: true, description: Required at creation. Omit on update to retain the encrypted recipient.}
EmailTarget:
  type: object
  additionalProperties: false
  required: [id, name, locale, enabled, recipientConfigured, version, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    locale: {type: string, enum: [en, zh-CN]}
    enabled: {type: boolean}
    recipientConfigured: {type: boolean}
    version: {type: string}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
EmailTargetList:
  type: array
  items: {$ref: '#/EmailTarget'}
EmailTestInput:
  type: object
  additionalProperties: false
  required: [targetId, scenario]
  properties:
    targetId: {type: string, format: uuid}
    scenario: {type: string, enum: [warning, critical, resolved]}
EmailDelivery:
  type: object
  additionalProperties: false
  required: [id, eventId, targetId, targetVersion, scenario, locale, templateVersion, state, attempts, possibleDuplicate, version, createdAt, updatedAt]
  properties:
    kind: {type: string, enum: [test, repository_quota]}
    quotaRuleId: {type: string, format: uuid}
    episodeId: {type: string, format: uuid}
    eventSequence: {type: integer, format: int64, minimum: 1}
    automaticCancellationCode: {type: string, enum: [rule_changed, rule_disabled, rule_deleted]}
    id: {type: string, format: uuid}
    eventId: {type: string, format: uuid}
    targetId: {type: string, format: uuid}
    targetVersion: {type: string}
    scenario: {type: string, enum: [warning, critical, resolved]}
    locale: {type: string, enum: [en, zh-CN]}
    templateVersion: {type: string}
    state: {type: string, enum: [pending, delivering, retrying, accepted, dead]}
    attempts: {type: integer}
    errorCode: {type: string}
    possibleDuplicate: {type: boolean}
    version: {type: string}
    nextAttemptAt: {type: string, format: date-time}
    acceptedAt: {type: string, format: date-time}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
EmailDeliveryList:
  type: array
  items: {$ref: '#/EmailDelivery'}
