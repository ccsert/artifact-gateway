---
artifact_search:
  get:
    operationId: searchArtifacts
    summary: Search visible artifacts across every readable repository
    parameters:
    - name: q
      in: query
      required: true
      description: Coordinate prefix, or an exact SHA-256 digest with or without the sha256 prefix.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    - name: format
      in: query
      schema:
        "$ref": "../components/schemas.yaml#/Format"
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        description: Cross-repository artifact search page
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/GlobalArtifactSearchPage"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"

repositories_repositoryId_artifact_search:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: searchRepositoryArtifacts
    parameters:
    - name: q
      in: query
      schema:
        type: string
        maxLength: 255
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ArtifactSummaryList"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
