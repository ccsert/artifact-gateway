name: artifact-gateway-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: integration-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 1s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: integration-password
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for migration in /migrations/*.sql; do psql -h postgres -U gateway -d gateway -v ON_ERROR_STOP=1 -f \"$$migration\"; done"]
    volumes:
      - ./migrations:/migrations:ro

  test:
    image: golang:1.26-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-ready:
        condition: service_completed_successfully
    environment:
      TEST_DATABASE_URL: postgres://gateway:integration-password@postgres:5432/gateway?sslmode=disable
      TEST_S3_ENDPOINT: http://minio:9000
      TEST_S3_ACCESS_KEY: integration-minio
      TEST_S3_SECRET_KEY: integration-password
    working_dir: /src
    command: ["go", "test", "-tags=integration", "./internal/app"]
    volumes:
      - ./:/src:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: integration-minio
      MINIO_ROOT_PASSWORD: integration-password

  minio-ready:
    image: curlimages/curl:8.14.1
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until curl --fail --silent http://minio:9000/minio/health/live > /dev/null; do sleep 1; done"]
