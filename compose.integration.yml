name: artifact-gateway-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: integration-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 1s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: integration-password
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for migration in /migrations/*.sql; do psql -h postgres -U gateway -d gateway -v ON_ERROR_STOP=1 -f \"$$migration\"; done"]
    volumes:
      - ./migrations:/migrations:ro

  test:
    image: golang:1.26-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      TEST_DATABASE_URL: postgres://gateway:integration-password@postgres:5432/gateway?sslmode=disable
    working_dir: /src
    command: ["go", "test", "-tags=integration", "./internal/app"]
    volumes:
      - ./:/src:ro
