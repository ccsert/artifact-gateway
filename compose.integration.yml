name: artifact-gateway-integration

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: gateway_test
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: integration-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_test"]
      interval: 1s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: integration-password
      PGDATABASE: gateway_test
    entrypoint: ["/usr/local/bin/run-migrations"]
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/usr/local/bin/run-migrations:ro

  test:
    image: golang:1.26.5-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs-ready:
        condition: service_completed_successfully
    environment:
      TEST_DATABASE_URL: postgres://gateway:integration-password@postgres:5432/gateway_test?sslmode=disable
      TEST_RUSTFS_ENDPOINT: http://rustfs:9000
      TEST_RUSTFS_ACCESS_KEY: integration-rustfs
      TEST_RUSTFS_SECRET_KEY: integration-password
    working_dir: /src
    command: ["go", "test", "-p", "1", "-tags=integration", "./internal/app", "./internal/aptpublication", "./internal/repository", "./internal/objectstore"]
    volumes:
      - ./:/src:ro
      - artifact-gateway-go-mod:/go/pkg/mod
      - artifact-gateway-go-build:/root/.cache/go-build

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    entrypoint: ["/bin/sh", "/usr/local/bin/run-rustfs"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: integration-rustfs
      RUSTFS_SECRET_KEY: integration-password
      RUSTFS_RPC_SECRET: integration-rustfs-independent-rpc-secret
    volumes:
      - ./scripts/run-rustfs.sh:/usr/local/bin/run-rustfs:ro

  rustfs-ready:
    image: curlimages/curl:8.14.1
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until curl --fail --silent http://rustfs:9000/health > /dev/null; do sleep 1; done"]

volumes:
  artifact-gateway-go-mod:
    external: true
  artifact-gateway-go-build:
    external: true
