name: artifact-gateway-integration

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: integration-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 1s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: integration-password
    entrypoint: ["/usr/local/bin/run-migrations"]
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/usr/local/bin/run-migrations:ro

  test:
    image: golang:1.26.5-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-ready:
        condition: service_completed_successfully
    environment:
      TEST_DATABASE_URL: postgres://gateway:integration-password@postgres:5432/gateway?sslmode=disable
      TEST_S3_ENDPOINT: http://minio:9000
      TEST_S3_ACCESS_KEY: integration-minio
      TEST_S3_SECRET_KEY: integration-password
    working_dir: /src
    command: ["go", "test", "-p", "1", "-tags=integration", "./internal/app"]
    volumes:
      - ./:/src:ro
      - artifact-gateway-go-mod:/go/pkg/mod
      - artifact-gateway-go-build:/root/.cache/go-build

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: integration-minio
      MINIO_ROOT_PASSWORD: integration-password

  minio-ready:
    image: curlimages/curl:8.14.1
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until curl --fail --silent http://minio:9000/minio/health/live > /dev/null; do sleep 1; done"]

volumes:
  artifact-gateway-go-mod:
    external: true
  artifact-gateway-go-build:
    external: true
